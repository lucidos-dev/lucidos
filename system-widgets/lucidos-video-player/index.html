<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video player</title>
  <script src="/api/v1/sdk-prefs.js"></script>
  <link rel="stylesheet" href="/api/v1/sdk-iframe.css">
  <script src="/api/v1/sdk.js"></script>
  <style>
    body { margin: 0; background: transparent; }
    /* `--ratio` is the clip's width over its height, set once its metadata
       loads. The player keeps that shape up to `--max-height`, so a tall clip
       narrows instead of growing past one screen. It stops at `--min-width`,
       which keeps the scrubber usable and puts bars beside a tall clip. */
    .player {
      --ratio: 16 / 9;
      --max-height: 22rem;
      --min-width: 18rem;
      width: min(100%, max(var(--min-width), calc(var(--max-height) * (var(--ratio)))));
      overflow: hidden;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-surface);
    }
    /* In a widget box, a thread card or a dashboard tile, the box is the
       surface: the picture fills what the bar leaves and keeps its shape
       inside it. */
    html[data-widget-size], html[data-widget-size] body { height: 100%; }
    html[data-widget-size] .player {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 0;
      background: none;
    }
    html[data-widget-size] .stage {
      flex: 1;
      min-height: 0;
      aspect-ratio: auto;
      max-height: none;
    }
    /* An explicit width, or a capped height shrinks the box to the clip. */
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: var(--ratio);
      max-height: var(--max-height);
      background: var(--bg-tertiary);
      cursor: pointer;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: translateZ(0);
    }
    /* The SDK's own `button` and `input` rules pad and fill every control.
       Override them all here: their padding squeezes the icon to zero width,
       and their hover fill sticks grey after a tap. */
    .play, .play:hover, .full, .full:hover, .big-play, .big-play:hover {
      flex: none;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: var(--radius-round);
      cursor: pointer;
    }
    .play, .play:hover, .full, .full:hover {
      width: 1.5rem;
      height: 1.5rem;
    }
    .play, .play:hover, .big-play, .big-play:hover {
      background: var(--accent);
      color: var(--text-on-accent);
    }
    .full, .full:hover {
      background: transparent;
      color: var(--text-secondary);
    }
    .big-play, .big-play:hover {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3rem;
      height: 3rem;
      translate: -50% -50%;
      box-shadow: var(--shadow-md);
      transition: opacity var(--duration-fast) ease, scale var(--duration-fast) ease;
    }
    .big-play:active { scale: 0.92; }
    /* It invites the first play and a replay, and stays off the picture
       while the clip is under way, paused or not. */
    .started .big-play { opacity: 0; scale: 0.8; pointer-events: none; }
    .play:focus-visible, .full:focus-visible { box-shadow: var(--focus-ring); }
    .play svg { width: 0.625rem; height: 0.625rem; fill: currentColor; }
    .full svg { width: 0.75rem; height: 0.75rem; fill: currentColor; }
    /* Nudged right, so the triangle looks centred in the circle. */
    .big-play svg { width: 1.125rem; height: 1.125rem; margin-left: 0.125rem; fill: currentColor; }
    .play .pause-icon, .playing .play .play-icon { display: none; }
    .playing .play .pause-icon { display: block; }
    .bar {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.375rem 0.5rem 0.375rem 0.375rem;
    }
    /* The input stays tall so a tap anywhere near the thin track seeks. */
    .scrub {
      --track: 0.25rem;
      --thumb: 0.75rem;
      --played: 0;
      flex: 1;
      min-width: 0;
      height: 1.5rem;
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    /* The played fill ends under the thumb's centre, which travels
       between half a thumb from each end. */
    .scrub::-webkit-slider-runnable-track {
      height: var(--track);
      border-radius: var(--radius-round);
      background:
        linear-gradient(var(--accent), var(--accent)) 0 / calc(var(--thumb) / 2 + (100% - var(--thumb)) * var(--played)) 100% no-repeat,
        var(--bg-quaternary);
    }
    .scrub::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: var(--thumb);
      height: var(--thumb);
      margin-top: calc((var(--track) - var(--thumb)) / 2);
      border: none;
      border-radius: var(--radius-round);
      background: var(--text-primary);
    }
    .scrub::-moz-range-track {
      height: var(--track);
      border-radius: var(--radius-round);
      background: var(--bg-quaternary);
    }
    .scrub::-moz-range-progress {
      height: var(--track);
      border-radius: var(--radius-round);
      background: var(--accent);
    }
    .scrub::-moz-range-thumb {
      width: var(--thumb);
      height: var(--thumb);
      border: none;
      border-radius: var(--radius-round);
      background: var(--text-primary);
    }
    .scrub:focus-visible::-webkit-slider-thumb { box-shadow: var(--focus-ring); }
    .scrub:focus-visible::-moz-range-thumb { box-shadow: var(--focus-ring); }
    .time {
      flex: none;
      color: var(--text-secondary);
      font-size: var(--font-size-xs);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .error {
      color: var(--text-secondary);
      font-size: var(--font-size-sm);
      padding: 0.5rem 0.75rem;
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-control);
    }
  </style>
</head>
<body>
  <div class="player" id="player">
    <div class="stage" id="stage">
      <video id="video" preload="metadata" playsinline></video>
      <!-- The bar's play button is the keyboard's; this one is for a tap. -->
      <button class="big-play" type="button" aria-hidden="true" tabindex="-1">
        <svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>
      </button>
    </div>
    <div class="bar">
      <button class="play" id="play" type="button" aria-label="Play" data-tooltip="Play">
        <svg class="play-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>
        <svg class="pause-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>
      </button>
      <input class="scrub" id="scrub" type="range" min="0" max="0" step="0.01" value="0" aria-label="Position">
      <span class="time" id="time">0:00</span>
      <button class="full" id="full" type="button" aria-label="Full screen" data-tooltip="Full screen">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h5v2H4v3H2zM9 2h5v5h-2V4H9zM2 9h2v3h3v2H2zM12 9h2v5H9v-2h3z"/></svg>
      </button>
    </div>
  </div>
  <script>
    lucidos.ui.applyPreferences();
    lucidos.ui.watchPreferences();

    const player = document.getElementById('player');
    const stage = document.getElementById('stage');
    const play = document.getElementById('play');
    const scrub = document.getElementById('scrub');
    const time = document.getElementById('time');
    const full = document.getElementById('full');
    const video = document.getElementById('video');

    // A workspace path plays through the /data mount, which serves ranges, so
    // Safari can seek. An https URL plays as given.
    function clipUrl(clip) {
      return /^https:\/\//i.test(clip) ? clip : lucidos.data.url(clip);
    }

    function clock(seconds) {
      if (!Number.isFinite(seconds)) return '0:00';
      const whole = Math.floor(seconds);
      return `${Math.floor(whole / 60)}:${String(whole % 60).padStart(2, '0')}`;
    }

    function showPosition() {
      scrub.value = String(video.currentTime);
      time.textContent = video.duration
        ? `${clock(video.currentTime)} / ${clock(video.duration)}`
        : clock(video.currentTime);
      const played = video.duration ? video.currentTime / video.duration : 0;
      scrub.style.setProperty('--played', String(played));
    }

    // Safari stops drawing a video while it is scrolled out of view. Back in
    // view, inside our iframe on a transformed pane, it sometimes never resumes
    // while the clock runs on. A seek to the current position draws again
    // (docs/temporary-measures.md § Video frame stall repaint).
    const STALL_SECONDS = 1.5;
    let lastFrameTime = 0;
    let onScreen = false;

    function watchFrames() {
      video.requestVideoFrameCallback((_now, frame) => {
        lastFrameTime = frame.mediaTime;
        watchFrames();
      });
    }

    function settleFrameClock() {
      lastFrameTime = video.currentTime;
    }

    function isInline() {
      return !video.webkitDisplayingFullscreen
        && document.fullscreenElement !== video
        && document.pictureInPictureElement !== video
        && (!video.webkitPresentationMode || video.webkitPresentationMode === 'inline');
    }

    // A full screen request takes a moment to open, and the video still reads
    // inline meanwhile. Unloading or hiding it then cancels the request, so
    // release and repaint wait it out. A count, since a second tap can start
    // a request while the first one still waits.
    let fullScreenRequestsPending = 0;

    // Rebuild the layer Safari drops while the page or the frame is hidden.
    function repaint() {
      if (fullScreenRequestsPending || !video.src || !isInline()) return;
      video.style.display = 'none';
      void video.offsetHeight;
      video.style.display = '';
      const target = Math.min(video.currentTime + 0.001, video.duration || Infinity);
      if (video.paused && video.readyState > 0 && canSeekTo(target)) {
        try {
          video.currentTime = target;
        } catch {
          // Some media sources reject seeks. The layer was still rebuilt.
        }
      }
      settleFrameClock();
      showPosition();
    }

    function canSeekTo(seconds) {
      const ranges = video.seekable;
      for (let i = 0; i < ranges.length; i++) {
        if (ranges.start(i) <= seconds && seconds <= ranges.end(i)) return true;
      }
      return false;
    }

    // Browsers present no frames for a video nobody can see, which is no
    // stall. A server that ignores byte ranges leaves the clip unseekable, and
    // a seek there rewinds to the start.
    function repaintIfStalled() {
      const watched = onScreen && !document.hidden && !video.webkitDisplayingFullscreen;
      const stalled = watched
        && !video.paused
        && !video.seeking
        && video.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA
        && video.currentTime - lastFrameTime > STALL_SECONDS;
      if (!stalled || !canSeekTo(video.currentTime) || fullScreenRequestsPending) return;
      settleFrameClock();
      video.currentTime = video.currentTime;
    }

    // A decoded frame of a 4K clip holds tens of megabytes, and WebKit keeps
    // every widget frame in the page's one content process. A thread of clips
    // that all stay decoded runs it out of memory, and iOS kills the page. So a
    // clip out of sight lets go of its media and reloads at its position.
    let url = '';
    let hostVisible = true;
    // A clip starts released and loads once it is first on screen.
    let released = true;
    // Null when the clip had no metadata yet, so its own fragment still decides
    // where it starts.
    let releasedAt = null;
    // Until the reload reaches its metadata, currentTime still reads 0, so
    // the position lives here.
    let resumeAt = null;

    // The time fragment makes Safari draw that frame before playing. A clip
    // URL with a fragment of its own keeps it and seeks at its metadata.
    function sourceAt(seconds) {
      return url.includes('#') ? url : `${url}#t=${seconds}`;
    }

    // Seekable ranges can still be empty at loadedmetadata. Try again at
    // canplay, then drop the target even when it is out of range.
    function resume(lastChance) {
      if (resumeAt === null) return;
      if (!url.includes('#')) {
        resumeAt = null;
      } else if (canSeekTo(resumeAt)) {
        video.currentTime = resumeAt;
        resumeAt = null;
      } else if (lastChance) {
        resumeAt = null;
      }
    }

    function release() {
      if (released || fullScreenRequestsPending || !isInline()) return;
      video.pause();
      released = true;
      releasedAt = resumeAt ?? (video.readyState > 0 ? video.currentTime : null);
      resumeAt = null;
      video.removeAttribute('src');
      video.load();
    }

    // release() skips a clip in PiP or full screen, so leaving that mode while
    // out of sight releases it.
    function releaseIfHidden() {
      if (!onScreen || !hostVisible) release();
    }

    function show() {
      if (!onScreen || !hostVisible) return;
      if (!released) return repaint();
      resumeAt = releasedAt === null ? null : Math.max(releasedAt, 0.001);
      video.src = sourceAt(resumeAt ?? 0.001);
      released = false;
    }

    function fail(message) {
      player.replaceChildren(Object.assign(document.createElement('div'), {
        className: 'error',
        textContent: message,
      }));
    }

    // A pause before the clip starts, by a tap or by another frame's sound,
    // rejects with AbortError. That is not a failure.
    function toggle() {
      if (!video.paused) return video.pause();
      video.play().catch((e) => {
        if (e.name !== 'AbortError') fail(`Could not play the clip: ${e.message}`);
      });
    }

    // Safari's own video player comes first wherever it exists: an iPhone has
    // no other full screen. A request can also stall without an answer, so
    // one that has not opened after a while says so. Either failure keeps the
    // player, which still works in place.
    const FULL_SCREEN_WAIT_MS = 2000;

    function enterFullScreen() {
      let answered = false;
      const settle = () => {
        if (answered) return;
        answered = true;
        fullScreenRequestsPending -= 1;
      };
      video.addEventListener('webkitbeginfullscreen', settle, { once: true });
      document.addEventListener('fullscreenchange', settle, { once: true });
      const refused = (reason) => {
        settle();
        lucidos.ui.toast(`Could not go full screen: ${reason}`, 'error');
        releaseIfHidden();
      };
      fullScreenRequestsPending += 1;
      // Only Safari's own player is known to stick until Lucidos restarts.
      let neverOpened = 'it never opened';
      try {
        if (video.webkitEnterFullscreen) {
          neverOpened = 'it never opened. iOS may be stuck: close and reopen Lucidos';
          video.webkitEnterFullscreen();
        } else if (document.fullscreenEnabled && video.requestFullscreen) {
          video.requestFullscreen().catch((e) => refused(e.message));
        } else {
          return refused('this browser has no full screen for video');
        }
      } catch (e) {
        return refused(e.message);
      }
      setTimeout(() => {
        video.removeEventListener('webkitbeginfullscreen', settle);
        document.removeEventListener('fullscreenchange', settle);
        if (answered) return;
        if (!isInline()) return settle();
        refused(neverOpened);
      }, FULL_SCREEN_WAIT_MS);
    }

    const { clip } = lucidos.params();
    if (typeof clip !== 'string' || clip.trim() === '') {
      fail('No clip to play.');
    } else {
      url = clipUrl(clip.trim());
      stage.addEventListener('click', () => {
        if (!video.controls) toggle();
      });
      play.addEventListener('click', toggle);
      full.addEventListener('click', enterFullScreen);
      // Full screen shows the video alone, so it takes the browser's controls.
      document.addEventListener('fullscreenchange', () => {
        video.controls = document.fullscreenElement === video;
        releaseIfHidden();
      });
      for (const event of ['webkitpresentationmodechanged', 'webkitendfullscreen', 'leavepictureinpicture']) {
        video.addEventListener(event, releaseIfHidden);
      }
      video.addEventListener('play', () => {
        player.classList.add('playing', 'started');
        play.setAttribute('aria-label', 'Pause');
        play.dataset.tooltip = 'Pause';
      });
      video.addEventListener('pause', () => {
        player.classList.remove('playing');
        play.setAttribute('aria-label', 'Play');
        play.dataset.tooltip = 'Play';
      });
      video.addEventListener('ended', () => player.classList.remove('started'));
      video.addEventListener('loadedmetadata', () => {
        if (video.videoWidth && video.videoHeight) {
          player.style.setProperty('--ratio', `${video.videoWidth} / ${video.videoHeight}`);
        }
        scrub.max = String(video.duration || 0);
        resume(false);
        showPosition();
      });
      video.addEventListener('canplay', () => resume(true));
      video.addEventListener('timeupdate', () => {
        showPosition();
      });
      if ('requestVideoFrameCallback' in video) {
        watchFrames();
        video.addEventListener('play', settleFrameClock);
        video.addEventListener('seeking', settleFrameClock);
        video.addEventListener('timeupdate', repaintIfStalled);
      }
      new IntersectionObserver(entries => {
        for (const entry of entries) {
          const wasOnScreen = onScreen;
          onScreen = entry.isIntersecting;
          if (!onScreen) release();
          else if (!wasOnScreen) show();
          settleFrameClock();
        }
      }, { threshold: 0.01 }).observe(video);
      lucidos.widget.onVisibility(visible => {
        hostVisible = visible;
        if (visible) show();
        else release();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') repaint();
        else settleFrameClock();
      });
      window.addEventListener('pageshow', repaint);
      video.addEventListener('error', () => {
        if (!released) fail(`Could not load ${clip}.`);
      });
      scrub.addEventListener('input', () => {
        resumeAt = null;
        video.currentTime = Number(scrub.value);
        showPosition();
      });
    }
  </script>
</body>
</html>
