# Standalone crate — explicitly NOT part of the parent workspace because
# this crate targets `wasm32-unknown-unknown` and shouldn't pollute the
# workspace lockfile or default-target builds.
[workspace]

[package]
name = "test-echo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Tiny WASM signer used by lucidos-engine integration tests."

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
