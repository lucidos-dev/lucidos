# Release notices tell users what to do after an upgrade.
#
# 1. Add a notice item only when users need to know or do something. Use
#    CHANGELOG.md for the general list of changes.
# 2. Group items by the release that ships them. Set since to that release's
#    plain semver, without a leading v. A dev build below it hides the item.
# 3. Append entries in release order. Never reorder, delete or rename an id.
#    The workspace remembers the last answered item by id.
# 4. Give each item a title and a one-line summary of at most 100 characters.
#    Say what to do, including "Nothing to do" where appropriate. Put details
#    and links in the Markdown body, which opens under Read more.
# 5. Use only_when to show an item where it applies. Use superseded_by to name
#    a later item that replaces it. The replacement must preserve all checks
#    and any action the old item carries. The engine defines the conditions.
# 6. When the user can check their workspace, name each audit check in checks
#    as "section: check name". The section must own that check. For another
#    request, use action and write one sentence in the user's words. Use the
#    same wording for duplicate requests. Request a full audit only when
#    targeted checks cannot cover the change. The engine combines requests
#    from visible items into Check my workspace.
#
# See system-knowhow/workspace-audit.md § A targeted run for check selection.

[[item]]
id = "run-a-workspace-audit"
since = "0.29.0"
title = "Run a workspace audit"
summary = "Check your workspace for drift."
body = """
Lucidos keeps moving, and your workspace does not move with it. An app built \
against an older SDK, a trigger subscribed to an event that has since been \
renamed, a recipe still describing the old way to reach an API: all of them \
keep sitting there, and a trigger on a renamed event simply stops firing with \
nothing to see.

A workspace audit sweeps what you have on disk and reports the drift. It \
changes nothing on its own: it writes a report, and you decide what to fix.

Worth doing now, and worth doing again after any release that moves a lot.
"""
action = "Audit my workspace for drift."

[[item]]
id = "deprecated-spawn-aliases-removed"
since = "0.38.1"
title = "Two deprecated spawn aliases were removed"
summary = "Check your workspace for calls that still use the old aliases."
body = """
Two long-deprecated shortcuts are gone. `run_coding_agent` no longer accepts \
`repo` (use `folder`), and `lucidos spawn-thread` no longer accepts `--parent` \
(use `--relation child`). Both had carried a deprecation warning for a while.

Almost every workspace already uses the new forms and needs nothing. But a \
recipe, trigger or script that still passes an old form will now fail with a \
clear rename error instead of running.

A workspace audit finds any such straggler on disk and tells you the one-line \
fix. Worth running once now.
"""
action = "Audit my workspace for drift."

[[item]]
id = "apps-run-isolated"
since = "0.38.3"
title = "Your apps now run isolated"
summary = "Check whether your apps still use APIs they can no longer reach."
body = """
An app used to run in the same browser process as Lucidos itself, which is how \
one busy app could freeze the whole page. Each app now gets its own process. It \
can no longer hang the rest of Lucidos, and it can no longer read the shell, \
your device id, or another app.

The cost lands on apps that reached for the browser directly. An app that \
stored something in `localStorage`, or called the engine with its own `fetch`, \
loses that. Everything it does through `lucidos.*` is unchanged.

**This one is quiet.** Most apps wrap a storage call in a `try`, so the app \
still opens and simply stops remembering your settings. A workspace audit finds \
every affected app and says what each one needs. Expect real changes rather \
than renames, and a few that wait on us: an app reaching a corner of the API \
the SDK does not cover yet has nothing to move onto.
"""
action = "Audit my workspace for drift."

[[item]]
id = "thread-summary-drops-coding-agent-applying"
since = "0.40.2"
title = "A thread field your apps could read was removed"
summary = "Check your apps for references to the removed thread field."
body = """
Thread summaries no longer carry `coding_agent_applying`. Lucidos never acted \
on it, and it could stay `true` long after a merge had finished.

An app, script or recipe that still reads it usually gets nothing back, with \
no error to say so. A workspace audit finds any code that still reads it and \
says what to do.
"""
action = "Audit my workspace for drift."

[[item]]
id = "cli-misrouted-looks-and-config"
since = "0.40.2"
title = "Some files you saved may be in the wrong folder"
summary = "Check whether any looks or config files went to the wrong folder."
body = """
`lucidos data write` used to file three folders under `artifacts/`: \
`config/`, `auth-modules/` and `scripts/`. So an `apis.json` saved that way \
never loaded, and a signer or script saved that way was never found. Nothing \
said so.

The command now writes each file where it belongs. A file saved before the \
fix still sits under `artifacts/`, where nothing reads it. A workspace audit \
finds any such file and says how to move it.
"""
action = "Audit my workspace for drift."

[[item]]
id = "spawn-thread-cc-model-removed"
since = "0.40.2"
title = "One old spawn flag was removed"
summary = "Check your workspace for calls that still use the old flag."
body = """
`lucidos spawn-thread` no longer accepts `--cc-model`. Use \
`--coding-agent-model` instead, with the same value. The new name has been \
documented since 0.39.2.

A recipe, trigger or script that still passes the old flag will now fail with \
an unknown-argument error instead of running. A workspace audit finds any \
such call and says what to change.
"""
action = "Audit my workspace for drift."

[[item]]
id = "every-workspace-has-home"
since = "0.47.2"
title = "Every workspace now has Home"
summary = "Nothing to do."
body = """
Home is one conversation that never ends. Open it from the Home icon in the \
thread header: at its start on desktop, beside the Lucidos mark on a phone. From Home, Lucidos can follow up any of your threads, and it \
presses your buttons only when you ask it to in that message.

It used to sit behind a switch under Experimental. The switch is gone, so \
Home shows even if you had it off. Its history is still there.

Home works when you write in it or talk to it out loud. It also works when \
something it started for you comes back to it, such as a thread or a wait for \
an event. It starts no work by itself. Work that belongs to no thread, such as \
a summary of a file written outside any thread, records its cost on Home.
"""

[[item]]
id = "mcp-servers-reach-only-their-threads"
since = "0.48.2"
title = "MCP servers now reach only the threads that use them"
summary = "Check whether any triggers still need an MCP server assigned."
body = """
A running MCP server used to add its tools to every thread. Now a thread \
switches a server on for itself when it needs it, so a thread that \
never uses a server no longer pays for its tools.

A trigger that uses an MCP server should list it in its MCP servers. Its fires \
then have the server from the first step. A fire may call only a listed \
server, or one with Auto-approve on. A call to any other server is refused, \
and you get a notification naming the trigger.

An audit of your triggers finds each one that used a server it does not list, \
and says what to add.
"""
action = "Audit my workspace's triggers."

[[item]]
id = "home-board"
since = "0.48.2"
title = "Widgets pinned to Home now live on the Home board"
summary = "Open Home to see your existing widgets."
superseded_by = "two-dashboards"
body = """
Home now has two faces: the Home board and the Home chat. Every widget you \
pinned to Home is a tile on the board, live, at its default size.

On a desktop, the board is a rail at the right edge of the window, beside \
your threads. The button in the window's top-right corner hides the rail, \
and the same button shows it again. Drag the rail's \
edge to change its width. The Home icon opens the Home chat.

On a phone, the Home icon opens Home on the board, with the prompt under it. \
Tap the prompt to slide the chat up, and tap the Home icon again to slide it \
back down.

Holding the Home icon no longer lists Home's widgets. They are all on the \
board now. Add on the board pins another widget to Home. Edit moves, resizes \
and removes tiles. A tile's menu hides it on the kind of screen you use: a \
desktop or a phone.
"""

[[item]]
id = "move-to-tree-memory"
since = "0.48.2"
title = "Tree memory is ready to try"
summary = "Keep Classic or switch to Tree in Settings."
only_when = "on-classic-memory"
body = """
A new workspace now asks which memory module to use. Yours stays on Classic, \
which is almost free.

Tree gives every turn a layered summary of the whole workspace and of the \
thread. The agent can open any line down to the exact message. In our tests it \
scored as well as Classic or better. It costs money: a compactor model writes \
the summaries after each turn, so the cost grows with use and depends on the \
model.

To try it, open [Settings > System > Memory](settings:memory). Lucidos first \
shows what the one-time summary of your workspace costs, and how long it takes. \
Until it is done, turns stay on Classic.
"""

[[item]]
id = "workspace-database-handle"
since = "0.48.2"
title = "Scripts reach the workspace database through LUCIDOS_DATABASE_URL"
summary = "Check for scripts that still depend on the old database settings."
body = """
Lucidos no longer gives scripts, triggers and coding agents its database \
login through the `PGHOST`, `PGUSER` and `DATABASE_URL` variables. A bare \
`psql`, or a connection string left empty by mistake, used to land on your \
workspace database. Now it reaches nothing.

Scripts get `LUCIDOS_DATABASE_URL` instead, and it opens read-only. Use \
`psql "$LUCIDOS_DATABASE_URL"`. A deliberate write starts with \
`BEGIN READ WRITE`.

A script or trigger that ran bare `psql` stops working until it names the \
variable. An audit finds each one and says how to fix it.
"""
action = "Audit my workspace for drift."

[[item]]
id = "two-dashboards"
since = "0.49.2"
title = "The Home board is now two dashboards"
summary = "Check your apps for old dashboard names."
body = """
The Home board is now called the dashboard, and your phone and your desktop \
each have their own. Each starts with the tiles it showed before. A tile you \
hid on one kind of screen is not on that screen's dashboard.

Add to dashboard, in a widget's menu, puts the widget on the dashboard of the \
screen you tap it on. Remove from dashboard takes it off that one only. Edit \
still moves and resizes tiles, and a tile no longer hides.

A widget that checks whether it sits on the board now reads `dashboard` \
where it read `home`, and the `home-board` page is now `dashboard`. Most \
apps never use either. The button checks your apps for the old names only, \
and swaps in the new ones.
"""
checks = ["apps: dashboard rename"]
action = "Fix the dashboard rename findings."

[[item]]
id = "intents-run-in-the-thread"
since = "0.49.2"
title = "Intents now run in the thread that asks for them"
summary = "Check your recipes and scripts for old intent calls."
only_when = "has-intents"
body = """
An intent used to run in a separate step of its own, on the default model. Now \
the thread that asks for it loads the intent's steps and does them itself, on \
the thread's own model. A trigger fire works the same way.

A child thread now follows its parent's model, effort and provider too, unless \
you pin one for it.

Knowhow or a trigger may still tell Lucidos to call `execute_intent`. That \
call now fails with a hint. The button finds each place and rewrites it.
"""
checks = ["cross-cutting: retired-tools"]
action = "Fix the retired-tools findings."

[[item]]
id = "widgets-pin-to-thread-removed"
since = "0.55.2"
title = "Pinned widgets are gone: add them to a dashboard"
summary = "Add any widgets you still use to a dashboard."
body = """
A widget no longer pins to a thread, and the chips under a thread's title are \
gone. To keep a widget in view, tap **+ Dashboard** on its card. It joins the \
dashboard of the screen you tap it on, at the card's size.

A widget in a thread now shows exactly as its dashboard tile does, at small, \
medium or large. The pill on its card picks the size. A widget built to grow \
with its content may now cut off in its card, as it already did on a \
dashboard. Ask Lucidos to redraw it for each size.
"""

[[item]]
id = "triggers-need-the-coding-agent-grant"
since = "0.56.1"
title = "Triggers that start coding agents need your grant"
summary = "Check which triggers need your coding-agent grant."
only_when = "has-ungranted-coding-agent-trigger"
body = """
A coding agent now gets the same permissions however it started. In return, a \
trigger may start one only when you grant it. Open the trigger and tick \
**Allow coding agents**.

At least one of your triggers has started a coding agent and has no grant yet. \
Its next such run is refused, and you get a notification naming the trigger.

Grant only a trigger you trust with your coding agents' permissions. Watch for \
one that reads outside content, such as email, chat messages or web pages: \
that content steers the coding agent too. The button lists each trigger, what \
it reads, and a link to grant it.
"""
checks = ["triggers: coding-agent grant"]

[[item]]
id = "command-guard-on-by-default"
since = "0.57.2"
title = "The command guard is now on"
summary = "Check whether your triggers or MCP servers need your approval."
only_when = "command-guard-turns-on"
body = """
The command guard now checks every command the Lucidos Agent runs, unless you \
turned it off yourself. A risky command asks you first, and an irreversible \
one in a trigger runs only within that trigger's allowed side-effects.

Three things in your workspace may notice:

- **Triggers.** A run that sends email, posts to an API or changes a cloud \
service now fails unless you ticked that side-effect in the trigger's settings. \
You get a notification naming the trigger.
- **MCP servers.** A server whose start command nobody approved does not start \
until you press Start under Settings > MCP Servers.
- **The judge model.** The guard asks a small, measured model about commands \
its lists do not settle. If none of your providers serves one, every turn \
stops with an error until you pick one or turn the judge off.

Your choices, each one tap away:

- **The guard itself.** Keep it on, or turn it off in \
[Command safety](settings:permissions#command-safety). The judge switch lives \
there too.
- **The judge model.** Pick the model that places unclear commands in \
[Command judge](settings:models#command-judge).
- **Coding agents.** The guard never answers Claude Code or Codex for you. \
[Auto-answer coding-agent cards](settings:permissions#coding-agent-auto-answer) \
does, and stays as you had it.

The button lists each trigger and server that needs you. It changes nothing.
"""
checks = ["triggers: side effect outside its grant", "mcp-servers: command guard"]

[[item]]
id = "agents-run-in-the-sandbox"
since = "0.59.0"
title = "Agents now run in a sandbox"
summary = "Open Read more if an older workspace loses database access or agents stop running."
body = """
Every command an agent starts now runs in an OS sandbox. The sandbox hides \
your secrets and keeps Lucidos state read-only. Scripts keep their \
`LUCIDOS_DATABASE_URL` database handle.

The bundled database now always requires a password. If an older running \
workspace loses database access, use **Switch to new version** for that \
workspace. Lucidos does not restart it automatically.

Sandboxed commands using a Unix database require the gateway-managed bundled \
database. External Unix databases require an explicit sandbox opt-out. Older \
engines missing the gateway handoff also need **Switch to new version**.

Codex now asks before commands and file changes. You can let Lucidos answer
these cards in [Auto-answer coding-agent cards](settings:permissions#coding-agent-auto-answer).

If Lucidos cannot apply the sandbox, a banner explains why agents cannot run.
[Agent sandbox](settings:permissions#agent-sandbox:unsandboxed) controls
whether they can run without that protection.
"""

[[item]]
id = "trigger-program-grants"
since = "0.59.0"
title = "Trigger grants now allow programs"
summary = "Review the programs your triggers need."
only_when = "has-legacy-trigger-grants"
superseded_by = "trigger-category-grants-ended"
body = "Category grants ended. Review programs from your triggers' earlier runs."

[[item]]
id = "trigger-category-grants-ended"
since = "0.59.0"
title = "Trigger category grants ended"
summary = "Review which programs your triggers can run."
action = "Help me review my trigger grants."
only_when = "has-legacy-trigger-grants"
body = """
**Check my workspace** starts a Lucidos Agent thread to review programs from
earlier runs. Each card names one trigger and lists the grants it would save.
You can ask questions between cards.

If a later run needs a program grant, open its permission notification to
review the program and let the trigger continue.

The sandbox lets triggers write in the workspace, OS temp folders and folders
you grant. If Lucidos can identify a folder where a write was refused, it
offers a folder grant. You can review or revoke folder grants in trigger details.

Linux needs Landlock ABI 3 or later to enforce write restrictions. Where the
kernel supports read-only mounts, they also block permission and timestamp
changes outside allowed folders. Settings → Permissions shows any limitation.
"""

[[item]]
id = "agent-database-writes-closed"
since = "0.59.0"
title = "Scripts no longer write the workspace database by SQL"
summary = "Check for scripts and recipes that still write to the workspace database."
checks = ["scripts: SQL write", "knowhow: SQL write", "cross-cutting: sandbox probes", "triggers: sandbox records", "knowhow: sandboxed write"]
action = "Fix the SQL write, sandbox probe, sandbox record and sandboxed write findings."
body = """
A script, trigger or agent could write seven tables through \
`LUCIDOS_DATABASE_URL`, such as `preferences` and `pinned_apps`. Such a write \
told nothing else it had happened, so open pages kept showing old data. \
Those writes are now refused with `permission denied`. Reading still works.

A script that batches statements may hide a write failure. **Check my workspace**
looks for affected scripts and knowhow and switches them to supported commands
such as `lucidos preferences set`. It also checks recipes and triggers that
depend on earlier sandbox behavior.
"""
