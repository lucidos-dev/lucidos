# Clean-machine smoke test for the one-click installer.
#
# Drives install.sh exactly as a stranger would on a fresh box, then verifies
# the app actually came up — not just that the script exited 0. The installer's
# launch() runs the dev server in the FOREGROUND and never returns, so we run it
# in the background and verify via the engine's own /health endpoint.
#
# Runs in the PUBLIC mirror (lucidos-dev/lucidos). Public repos get UNLIMITED
# free GitHub-hosted Actions minutes on every runner, including macOS — no 10x
# multiplier, no monthly cap — so we run the full macOS + Ubuntu matrix freely.
#
# Release-candidate gate model: push the RC to a branch in lucidos-dev, let this
# workflow verify a clean-machine install AND the signed DMG on fresh runners,
# and only tag/publish the real release once both are green. The gate is split
# across two triggers because the two artifacts become testable at different
# times in Phase A:
#
#   * SOURCE INSTALL (job: smoke) — needs only the RC branch tree, so it auto-runs
#     on `push` to rc/**. Checkout-based (fetch_repo reuses the checked-out tree,
#     no clone) clean-machine install on macOS + Ubuntu. Gates BEFORE any tag.
#
#   * DMG VERIFY (job: dmg-verify) — needs the built+signed+notarized DMG, which
#     Phase A produces LOCALLY (signing identity never leaves the Mac) and then
#     uploads to an `rc-<ver>` DRAFT release in lucidos-dev. A draft is never
#     listed on the public releases page, and it also fires no webhook, so Phase
#     A DISPATCHES this workflow with `dmg_tag=rc-<ver>` (ADR 0036). This job
#     downloads the rc DMG asset onto a FRESH macOS runner (one that has never
#     trusted your cert) and runs spctl + stapler validate + codesign, then
#     launches the app and asserts it BECOMES READY (its gateway answers health
#     as the expected build, and the frontend is served). That is the real "does
#     a stranger's Mac accept this DMG, and does the thing then work" check, and
#     it is what replaces mounting every release DMG by hand. Gates BEFORE the
#     real tag.
#
#   * SAFETY NET (job: smoke, on `release: published`) — the only trigger that
#     exercises the REAL stranger path (curl|sh -> git clone lucidos-dev), because
#     the published tag must exist first. Post-publish; reports fast, can't gate.
#
# Testing the ORIGIN rather than a tree:
#
#   * FRONT DOOR (job: front-door) — the advertised `curl -fsSL
#     <origin>/install.sh | sh`, on a fresh ubuntu:22.04. Every job above tests
#     a TREE (this checkout, or an artifact built from it); this one tests what
#     the deployed site is actually serving right now, which is a separate thing
#     that can break on its own. It runs in one of two MODES:
#
#       - full    (dispatch + the daily cron, default origin https://lucidos.dev)
#                 all eight rungs: a real install on a bare box, then the
#                 advertised UNINSTALL paths (--list through both front doors, a
#                 data-safe removal, and --all --purge), each asserted.
#       - payload (push to rc/**, origin https://rc.lucidos.dev; also selectable
#                 on a dispatch) rung 1 ONLY — fetch the served installer, parse
#                 its helper-lib list + lib base out of it, fetch those AND the
#                 served uninstaller, and assert every payload is shell rather
#                 than the soft-404 landing page. Then STOP GREEN. See the job
#                 for why it must not install.
#
#     The full mode is deliberately NOT on the rc/** push: it would gate an RC on
#     the state of production, which the RC has not shipped to yet. The payload
#     mode is the opposite — it gates the RC's OWN copy of the installer at
#     rc.lucidos.dev, before anything reaches the real path.
#
#   * ROUTE PARITY (job: front-door-parity) the only job that looks at BOTH
#     origins in one run. Every job above, this file's front-door ones included,
#     sees exactly ONE origin, so none of them can notice that production and
#     the release candidate serve DIFFERENT route sets. Daily cron + dispatch,
#     never the rc/** push. See the job for the severity rules.
#
# NOTE: only effective once lucidos-dev is public. Before the public flip this
# repo is still private, so runs bill against the private free tier (~2000
# min/month, macOS 10x) — the first launch relies on the manual DMG verify plus,
# if desired, a single on-demand run.
#
# Verification ladder (see "Verify" step):
#   1. installer bootstraps deps + clones + starts the build
#   2. engine answers /api/v1/health with status: ok   (real readiness, polled)
#   3. /health JSON sane: engine_version == repo VERSION, llm_configured present
#   4. frontend (Vite) serves HTTP 200 on the port the installer wrote
#
# First run compiles the Rust engine from source (10-20+ min), so the health
# poll allows a generous timeout.

name: install-smoke

on:
  # Gate: dispatch on the RC ref, or auto-run on every push to an rc/** branch,
  # and wait for green before tagging/publishing the release.
  workflow_dispatch:
    inputs:
      os:
        description: 'Which runners to use'
        type: choice
        default: 'both'
        options: [both, ubuntu-only, macos-only]
      # front-door only. The Pages deploy does NOT run in CI — it runs on the
      # maintainer's machine off a workspace trigger chain (LucidosReleased ->
      # DMG-link bump -> SitePublishRequested -> publisher -> SitePublished), so
      # GitHub's `release: published` webhook fires while the deploy is still in
      # flight and would verify the OLD origin: a pass for the wrong reason.
      # The post-publish hook is therefore a dispatch fired BY the publisher
      # once SitePublished lands, which is what these two inputs serve.
      origin:
        description: 'front-door: origin to test (https:// only, no trailing slash)'
        type: string
        default: 'https://lucidos.dev'
      mode:
        description: 'front-door: full = install too; payload = fetch+sniff only (use for an RC origin — no v<ver> tag exists yet)'
        type: choice
        default: 'full'
        options: [full, payload]
      # front-door only. WHICH RELEASE this dispatch was fired to verify, so the
      # job stops trusting whichever Cloudflare POP happens to answer first.
      #
      # The post-publish dispatch arrives seconds after the site publisher
      # deploys, i.e. squarely inside the window where POPs are mid propagation
      # and two fetches of the same URL legitimately return two different
      # releases. Rung 1 reads install.sh once and the install step reads it
      # again, so without this input those two reads can be different releases
      # and the asset preflight between them guarantees nothing (the 2026-08-03
      # v0.20.1 run: both macOS legs verified 0.20.0's assets and then installed
      # 0.20.1, whose tarball was not attached yet). Set it, and rung 1 waits for
      # this runner's POP to actually serve that release before anything else
      # runs.
      #
      # Empty is the default and stays a first-class case: the daily cron and a
      # bare manual dispatch behave exactly as before, one read and no polling.
      # A bare release number, as install.sh bakes it, NOT a v<ver> tag.
      expect_version:
        description: 'front-door: the release this dispatch verifies, e.g. 0.20.1 (empty = accept whatever the origin serves)'
        type: string
        default: ''
      # dmg-verify only, and now BOTH of that job's real triggers arrive here.
      #
      #   * the RC gate. Phase A puts the staged DMG on an rc-<ver> DRAFT release
      #     so it is never listed publicly, and a draft fires no webhook at all
      #     (GitHub: "Workflows are not triggered for the created, edited, or
      #     deleted activity types for draft releases"), so release.sh dispatches
      #     this input with dmg_tag=rc-<ver>. See ADR 0036.
      #   * the DEFERRED release. It publishes before Apple's notarization
      #     verdict, so Phase A armed no gate at all (an unstapled DMG cannot pass
      #     a stapled-ticket assertion). When release.sh --attach-notarized later
      #     staples and swaps the asset, it dispatches dmg_tag=v<ver> so
      #     verification FOLLOWS the artifact to the GA tag.
      #
      # Setting it runs dmg-verify and NOTHING else. Every other job guards on it
      # being empty, or a few minutes of asset checking would drag a 40-minute
      # source install and a 90-minute tarball build along with it.
      dmg_tag:
        description: 'dmg-verify: verify the DMG on this tag, either an rc-<ver> draft or a published v<ver>. Runs dmg-verify only.'
        type: string
        default: ''
  push:
    branches: ['rc/**']        # release candidates -> auto clean-machine gate
  # release events drive two different jobs:
  #   prereleased/released (prerelease==true) -> a NON-draft rc-<ver>, made by
  #     hand or by a release.sh older than ADR 0036: gate the signed DMG
  #     (dmg-verify). BOTH actions are accepted because creating an rc via
  #     `gh release create --prerelease` can surface `released` instead of
  #     `prereleased`; the prerelease==true guard keeps the GA out. Phase A no
  #     longer takes this path (it dispatches dmg_tag at a DRAFT instead), but
  #     the arm is kept so a hand-made rc still gates.
  #   published (prerelease==false) -> real tag exists: post-publish curl|sh +
  #     clone safety net (smoke).
  #
  # `created` is deliberately NOT in this list, and adding it does not make a
  # draft rc fire. GitHub does not trigger workflows for the created / edited /
  # deleted activity types on DRAFT releases, so the draft Phase A makes emits
  # nothing here; `created` would only add a duplicate dmg-verify run for the
  # non-draft rc above, which already matches prereleased. See ADR 0036.
  release:
    types: [prereleased, released, published]
  # Two crons, and each job picks EXACTLY ONE via `github.event.schedule` (the
  # cron string that fired). A schedule trigger is workflow-wide, so without that
  # guard the daily front-door cron would also drag the 40-min source install and
  # the 90-min tarball build in with it, seven times a week instead of once.
  schedule:
    - cron: '0 4 * * 1'        # weekly Mon 04:00 UTC — catch toolchain drift (smoke, tarball-smoke)
    - cron: '0 6 * * *'        # daily 06:00 UTC — the live lucidos.dev front door (front-door)

# install.sh defaults LUCIDOS_HOME=$HOME/lucidos and clones from GitHub. In CI
# we already have the repo checked out, so point it at the checkout and skip the
# network clone — we want to test THIS commit's installer + sources.
env:
  LUCIDOS_HOME: ${{ github.workspace }}
  LUCIDOS_WORKSPACE: ${{ github.workspace }}/.smoke-ws
  HEALTH_TIMEOUT_SECS: '2400'   # 40 min: first-run source build is slow
  # dmg-verify's readiness deadline. Nothing compiles there (the DMG is already
  # built), but a FIRST launch on a clean runner still pays Gatekeeper's
  # first-launch verification of a several-hundred-megabyte notarized bundle,
  # LaunchServices registration, the launchd bootstrap of the service agent, and
  # the gateway's own boot. The 30 s the old liveness check allowed was only ever
  # enough to watch a process appear. 10 minutes is generous for all of the above
  # and still leaves two thirds of that job's `timeout-minutes: 30` for the
  # download, spctl, stapler, codesign and teardown around it.
  DMG_READY_TIMEOUT_SECS: '600'

jobs:
  smoke:
    name: install-smoke (${{ matrix.os }})
    # ONLY runs in the public mirror — this file also lives in the private source
    # repo (a personal account, so macOS bills at 10x); the repo guard keeps
    # it inert there. On a release event the source smoke is the post-publish safety
    # net for the REAL GA only, so it runs solely on `published` with
    # prerelease==false. An rc-<ver> prerelease upload (which ALSO fires `published`,
    # prerelease==true) is the DMG-verify trigger, not a source-install one — skip it
    # here so the source smoke (already run on push to rc/**) doesn't double-run.
    # The schedule clause keeps this job on its WEEKLY cron only — the daily cron
    # exists for front-door, and a schedule trigger fires the whole workflow.
    if: >-
      github.repository == 'lucidos-dev/lucidos'
      && (github.event_name != 'release'
          || github.event.release.prerelease == false)
      && (github.event_name != 'schedule'
          || github.event.schedule == '0 4 * * 1')
      && inputs.dmg_tag == ''
    strategy:
      fail-fast: false
      matrix:
        # Source-install smoke runs on Ubuntu only (see note below); the macOS
        # artifact is gated by dmg-verify. Manual dispatch's 'os' input is kept
        # for API compatibility but always resolves to ubuntu-latest here.
        # macOS source-install is intentionally NOT run here: GitHub's hosted
        # Apple-Silicon macOS runners are themselves VMs with no nested
        # virtualization, so Colima/Docker (which install.sh needs for Postgres
        # on the from-source dev path) cannot start. That exclusion is narrow:
        # the signed DMG is gated by dmg-verify, and the advertised
        # `curl ... | sh` DOWNLOAD path on macOS is gated by front-door-macos,
        # on both aarch64-apple-darwin and x86_64-apple-darwin. That job runs on
        # a hosted runner precisely because downloading needs no Docker, no
        # Colima and no nested virtualization: it curls a prebuilt tarball and
        # runs it. What stays uncovered on macOS is ONLY the --dev SOURCE
        # install, which is what this exclusion is about. It does not mean
        # "macOS can't be tested in CI", and is never a reason to delete
        # front-door-macos.
        os: ${{ fromJSON(
          (github.event_name == 'workflow_dispatch' && inputs.os == 'macos-only') && '["ubuntu-latest"]'
          || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macOS GitHub runners cannot run Docker Desktop. install.sh needs a
      # Docker daemon for Postgres, so provide one via Colima. (Ubuntu runners
      # ship Docker natively — no setup needed there.)
      #
      # macos-latest is Apple Silicon (arm64); two failure modes to dodge:
      #   * The default QEMU VM driver needs nested hardware virtualization the
      #     hosted runner doesn't expose (HV_UNSUPPORTED), so use Apple's
      #     Virtualization.framework driver instead (--vm-type vz).
      #   * Lima >=1.0 dropped qemu as a dependency, so `qemu-img` — still needed
      #     to convert the qcow2 base image to the raw disk the vz driver uses —
      #     is missing on a fresh box. That is the observed "error at 'creating
      #     and starting'" failure; `brew install qemu` puts qemu-img back on PATH.
      - name: Start Docker daemon (macOS via Colima)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install colima docker qemu

          start_colima() {
            colima start --vm-type vz --cpu 3 --memory 6 --disk 30 --mount-type virtiofs
          }

          # A cold VM boot occasionally flakes on a busy runner; retry once from a
          # clean slate, and dump colima/lima logs if it still won't come up.
          if ! start_colima; then
            echo "::warning::colima start failed — resetting and retrying once"
            colima delete --force >/dev/null 2>&1 || true
            sleep 5
            if ! start_colima; then
              echo "::error::colima failed to start; dumping diagnostics"
              colima status 2>&1 || true
              cat "$HOME/.colima/_lima/colima/ha.stderr.log" 2>/dev/null || true
              cat "$HOME"/.colima/_lima/colima/serial*.log 2>/dev/null || true
              ls -la "$HOME/.colima" 2>/dev/null || true
              exit 1
            fi
          fi

          docker info

      - name: Run install.sh (background — launch() never returns)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LUCIDOS_WORKSPACE"
          # Run the actual installer from this checkout in SOURCE mode (--dev):
          # this job is the from-source clean-machine gate (it points LUCIDOS_HOME
          # at the checkout and polls for the dev ports file). Since step 3 the
          # DEFAULT path downloads a prebuilt tarball (which 404s until a release
          # is published), so the source gate must opt in with --dev. It detects
          # the existing checkout (fetch_repo) and uses it instead of cloning;
          # mock mode (no provider creds) is the credential-less first-run path.
          nohup bash ./install.sh --dev > "$RUNNER_TEMP/install.log" 2>&1 &
          echo "INSTALL_PID=$!" >> "$GITHUB_ENV"
          echo "Installer started (pid $!). Log: $RUNNER_TEMP/install.log"

      - name: Verify the app actually came up
        shell: bash
        run: |
          set -uo pipefail
          ports_file="$LUCIDOS_WORKSPACE/.lucidos/ports"

          # --- wait for the installer to write the ports file (stack starting) ---
          echo "Waiting for ports file: $ports_file"
          for i in $(seq 1 600); do            # up to 10 min just to START serving
            [ -f "$ports_file" ] && break
            if ! kill -0 "${INSTALL_PID:-0}" 2>/dev/null; then
              echo "::error::installer exited before writing a ports file"
              tail -n 150 "$RUNNER_TEMP/install.log" || true
              exit 1
            fi
            sleep 1
          done
          [ -f "$ports_file" ] || { echo "::error::no ports file after 10m"; tail -n 200 "$RUNNER_TEMP/install.log"; exit 1; }

          # The ports file records ONE user-facing engine port: API_PORT == VITE_PORT.
          # The engine serves both /api/v1/health AND the built frontend (dist/) on it.
          # shellcheck disable=SC1090
          source "$ports_file"
          port="${API_PORT:-${VITE_PORT:?ports file has no API_PORT/VITE_PORT}}"
          echo "User-facing engine port: $port"

          # health_get PORT  → echoes the /health body on the right scheme, or empty.
          # Mirrors scripts/status.sh:_engine_health_json — try https first (PROTO
          # may be TLS and isn't always written to the ports file), then http.
          health_get() {
            local p="$1" out
            out="$(curl -sk --connect-timeout 2 --max-time 5 "https://localhost:$p/api/v1/health" 2>/dev/null)" && [ -n "$out" ] && { printf '%s' "$out"; return 0; }
            out="$(curl -s  --connect-timeout 2 --max-time 5 "http://localhost:$p/api/v1/health"  2>/dev/null)" && [ -n "$out" ] && { printf '%s' "$out"; return 0; }
            return 1
          }

          # --- rung 2: engine /health == ok (allow the long first-run build) ---
          echo "Polling /api/v1/health on port $port (timeout ${HEALTH_TIMEOUT_SECS}s)…"
          deadline=$(( $(date +%s) + HEALTH_TIMEOUT_SECS ))
          body=""
          until [ "$(date +%s)" -ge "$deadline" ]; do
            body="$(health_get "$port" || true)"
            if echo "$body" | grep -q '"status":"ok"'; then echo "Engine healthy."; break; fi
            if ! kill -0 "${INSTALL_PID:-0}" 2>/dev/null; then
              echo "::error::installer process died during build/launch"
              tail -n 150 "$RUNNER_TEMP/install.log"; exit 1
            fi
            sleep 10
          done
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::/health never reported ok within ${HEALTH_TIMEOUT_SECS}s"; tail -n 200 "$RUNNER_TEMP/install.log"; exit 1; }
          echo "health: $body"

          # --- rung 3: built the right version + clean mock-mode boot ---
          # The repo version lives in the RELEASE file and surfaces in /health as
          # the "release" field; "engine_version" is an independent build calver.
          repo_version="$(tr -d ' \t\r\n' < RELEASE)"
          echo "$body" | grep -q "\"release\":\"$repo_version\"" \
            || { echo "::error::health release != RELEASE ($repo_version) — stale or wrong build"; exit 1; }
          echo "$body" | grep -q '"llm_configured"' \
            || { echo "::error::/health missing llm_configured — unexpected health shape"; exit 1; }
          echo "Version matches ($repo_version) and health shape is sane."

          # --- rung 4: frontend is reachable (engine serves dist/ on the same port) ---
          # Determine scheme from whichever one /health answered on.
          scheme="http"; curl -sk --max-time 5 "https://localhost:$port/api/v1/health" >/dev/null 2>&1 && scheme="https"
          fe_url="$scheme://localhost:$port/"
          code="$(curl -k -s -o /dev/null -w '%{http_code}' "$fe_url" || echo 000)"
          [ "$code" = "200" ] || { echo "::error::frontend $fe_url returned HTTP $code"; exit 1; }
          echo "Frontend serving 200 at $fe_url"

          echo "OK — clean-machine smoke test passed on ${{ matrix.os }}"

      - name: Tear down
        if: always()
        shell: bash
        run: |
          ./scripts/stop.sh -w "$LUCIDOS_WORKSPACE" || true
          kill "${INSTALL_PID:-0}" 2>/dev/null || true

      - name: Upload installer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-${{ matrix.os }}
          path: ${{ runner.temp }}/install.log
          if-no-files-found: ignore
          retention-days: 7

  # ── DMG VERIFY ───────────────────────────────────────────────────────────────
  # Gates the signed/notarized DMG. THREE ways in, because the artifact does not
  # always arrive at the same time as the release:
  #   • the normal path (dispatch, `dmg_tag=rc-<ver>`): Phase A uploads the DMG to
  #     an rc-<ver> DRAFT release so it is never publicly listed, and since a
  #     draft fires no event, release.sh dispatches this job at it. Gates BEFORE
  #     the real release. See ADR 0036.
  #   • the deferred path (dispatch, `dmg_tag=v<ver>`): a release published while
  #     Apple's notary verdict was outstanding armed no gate at all (an unstapled
  #     DMG cannot pass the stapled-ticket assertion below). `release.sh
  #     --attach-notarized` staples the DMG, swaps the published asset, then
  #     dispatches this job so verification follows the artifact to the GA tag.
  #   • the legacy path (release event): a NON-draft rc-<ver> prerelease made by
  #     hand or by an older release.sh (`prereleased` OR `released`, guarded on
  #     prerelease==true; see the release-types note above).
  # Either way it downloads the DMG asset onto a CLEAN macOS runner (one that has
  # never trusted your Developer ID cert and has no prior state) and confirms
  # Gatekeeper accepts it, the notarization ticket is stapled, and the app
  # actually BECOMES READY. This is strictly stronger than verifying on your dev
  # box (which already trusts the cert). Signing stays local; CI only CONSUMES the
  # artifact.
  #
  # Verification ladder:
  #   1. spctl accepts the DMG as a Notarized Developer ID
  #   2. the notarization ticket is stapled (`stapler validate`)
  #   3. the mounted .app passes `codesign --verify --deep --strict`
  #   4. launched, its gateway answers `/~/api/v1/health` with status: ok and
  #      role: gateway  (real readiness, polled, sigil namespace: see the step)
  #   5. that health payload's `release` == the version the TAG names, so the
  #      artifact on this tag is the build this tag is for
  #   6. the packaged frontend serves HTTP 200 on the gateway root
  #
  # Rungs 4-6 replaced a `pgrep` on 2026-08-12. THE PROCESS-EXISTS CHECK IS NOT
  # COMING BACK, and the reason is not that it was weak but that it could not
  # fail: an engine that never spawns, a frontend bundle that 404s and a
  # first-run path that throws all leave a live process. It is the only reason a
  # human still mounted every release DMG by hand, and rungs 4-6 are what let
  # that manual gate go.
  dmg-verify:
    name: dmg-verify (macOS, clean)
    # Public mirror only (see the smoke job's repo guard) — never bill the private
    # source repo's 10x macOS minutes. The dispatch arm is the live one (both the
    # rc draft and the deferred GA tag arrive that way). The release arm is kept
    # for a NON-draft rc: accept both `prereleased` and `released` (rc creation
    # can surface either action) and guard on prerelease==true so the real GA
    # publish never triggers it.
    if: >-
      github.repository == 'lucidos-dev/lucidos'
      && ((github.event_name == 'release'
           && github.event.release.prerelease == true)
          || (github.event_name == 'workflow_dispatch' && inputs.dmg_tag != ''))
    # `contents: write` is what makes a DRAFT release readable, and it is the only
    # reason this job needs write at all: it downloads and verifies, it never
    # pushes. GitHub only lists draft releases to callers with push access, and
    # this repo's default_workflow_permissions is `read`, so an inherited token
    # 404s on the rc draft. Do NOT tighten this to `contents: read`, and do NOT
    # copy front-door's `permissions: {}` here: either one silently breaks the
    # gate. The token stays scoped to the download step's env below, so the DMG
    # this job mounts and launches never sees it. See ADR 0036.
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # The port the packaged app's gateway comes up on, pinned so the readiness
      # probe below and the app itself cannot disagree about where to look.
      # `resolve_engine_port` (crates/lucidos-app/src/desktop.rs) takes
      # LUCIDOS_ENGINE_PORT first, then `<app-data>/config/engine-port`, then
      # DEFAULT_ENGINE_PORT, so 5252 IS what an unconfigured run resolves to:
      # pinning it removes the ambiguity rather than changing the behaviour.
      #
      # JOB-scoped, deliberately not workflow-scoped. `smoke` reads its port out
      # of the installer's ports file and `tarball-smoke` pins its own GW_PORT,
      # and neither must inherit this one. Nothing else in the tree reads this
      # variable (the gateway takes LUCIDOS_API_PORT, which the service derives
      # from the resolved value), so exporting it cannot move any other process.
      LUCIDOS_ENGINE_PORT: '5252'
    steps:
      - name: Download the DMG from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.dmg_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dmg"
          echo "Fetching DMG asset(s) from $TAG"
          # A failure here is most likely the rc DRAFT being invisible to this
          # token rather than a missing asset, and a bare 404 does not say so.
          # GitHub lists drafts only to callers with push access, which is what
          # the job-level `contents: write` buys. Distinguish the two cases and
          # name the escape hatch. See ADR 0036.
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --pattern '*.dmg' --dir "$RUNNER_TEMP/dmg"; then
            echo "::error::could not download a .dmg from $TAG on $GITHUB_REPOSITORY"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::the release resolves, so its .dmg asset is missing or misnamed"
            else
              echo "::error::the release does not resolve at all. If $TAG is a draft, this token cannot see it:"
              echo "::error::confirm the dmg-verify job still declares permissions.contents: write."
              echo "::error::escape hatch: gh release edit $TAG --repo $GITHUB_REPOSITORY --draft=false (publishes it, so it becomes publicly listed)"
            fi
            exit 1
          fi
          DMG="$(ls "$RUNNER_TEMP/dmg"/*.dmg | head -1)"
          [ -f "$DMG" ] || { echo "::error::no .dmg asset on $TAG"; exit 1; }
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "Downloaded: $DMG ($(du -h "$DMG" | cut -f1))"

          # WHICH BUILD this run is verifying, for the readiness probe's version
          # assertion. Derived from the TAG, deliberately NOT from the DMG
          # filename, and the difference is the whole value of the assertion.
          # `Lucidos_<version>_aarch64.dmg` is stamped by the same build that
          # produced the bytes inside it, so checking health against the filename
          # only asserts that the DMG agrees with itself: a DMG from some other
          # build, uploaded to this tag, carries a self-consistent name and sails
          # through. The tag is the INDEPENDENT fact. It is what release.sh armed
          # the gate at, so comparing the running gateway's baked release against
          # it is what catches the wrong artifact on the right tag.
          #
          # $TAG rather than inputs.dmg_tag because all three ways into this job
          # have to work: the rc-<ver> draft dispatch, the deferred v<ver>
          # dispatch, and the legacy non-draft rc RELEASE EVENT, on which
          # inputs.dmg_tag is empty and only github.event.release.tag_name is set.
          EXPECTED_VERSION="${TAG#rc-}"
          EXPECTED_VERSION="${EXPECTED_VERSION#v}"
          # Fail closed on anything that is not a bare dotted release number. The
          # value is written to $GITHUB_ENV and is derived from a dispatch input,
          # so the character-class guard runs first: it rejects a newline, which
          # a later `x.y.z` glob would happily match through.
          case "$EXPECTED_VERSION" in
            ""|*[!0-9.]*)
              echo "::error::tag '$TAG' does not yield a bare release number (got '$EXPECTED_VERSION'); expected rc-<x.y.z> or v<x.y.z>"
              exit 1 ;;
          esac
          case "$EXPECTED_VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::tag '$TAG' does not yield an <x.y.z> release number (got '$EXPECTED_VERSION')"
              exit 1 ;;
          esac
          echo "EXPECTED_VERSION=$EXPECTED_VERSION" >> "$GITHUB_ENV"
          echo "Verifying release version: $EXPECTED_VERSION"

      - name: Gatekeeper accepts it (notarized Developer ID)
        run: |
          set -euo pipefail
          echo "spctl assessment:"
          spctl -a -t open --context context:primary-signature -vv "$DMG" 2>&1 | tee /tmp/spctl.out
          grep -q 'source=Notarized Developer ID' /tmp/spctl.out \
            || { echo "::error::DMG not accepted as Notarized Developer ID"; exit 1; }

      - name: Notarization ticket is stapled
        run: |
          set -euo pipefail
          xcrun stapler validate "$DMG" || { echo "::error::stapler validate failed — ticket not stapled"; exit 1; }

      - name: App mounts and the bundle is signed
        run: |
          set -euo pipefail
          MNT="$(mktemp -d)"
          # Resolve to the PHYSICAL path before anything else uses it. `/var` is a
          # symlink to `/private/var` on macOS and `mktemp -d` hands back the
          # symlinked form, while a process launched out of the bundle reports the
          # resolved one, so an unresolved $APP silently matches no process at all
          # in the teardown below.
          MNT="$(cd "$MNT" && pwd -P)"
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
          # Handed forward IMMEDIATELY, and before the .app lookup below, because
          # the teardown is now its own `if: always()` step and can only detach a
          # mount it can see. Every line from here on can abort the step under
          # `set -e` (a DMG that attaches but carries no .app does exactly that),
          # and each one of those aborts would otherwise leave the volume mounted.
          echo "MNT=$MNT" >> "$GITHUB_ENV"
          APP="$(ls -d "$MNT"/*.app | head -1)"
          echo "Mounted app: $APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          # Verify the .app itself is signed + accepted.
          codesign --verify --deep --strict --verbose=2 "$APP" \
            || { echo "::error::app bundle failed codesign --verify"; exit 1; }

      # ── READINESS, not liveness ──────────────────────────────────────────────
      # This step used to `open -g` the bundle and `pgrep -f` for it. That asks
      # only whether a PROCESS EXISTS, which it cannot fail to find: an engine
      # that never spawns, a frontend bundle that 404s and a first-run path that
      # throws all leave a live process behind and all passed. That gap is why a
      # human still mounted every release DMG by hand. So this asks the packaged
      # client's own gateway the same three questions the `smoke` job asks of the
      # source install: does it answer health, is it the RIGHT build, and is the
      # frontend actually served.
      #
      # TWO TRAPS ARE ENCODED BELOW, AND BOTH LOOK LIKE NOISE TO SIMPLIFY AWAY:
      #
      #  1. THE SIGIL NAMESPACE. The packaged gateway serves health at
      #     `/~/api/v1/health` (ADR 0014), never at a bare `/api/v1/health`. That
      #     is not a near-miss path: the gateway resolves the FIRST path segment
      #     as a WORKSPACE SLUG, so `/api/v1/health` reads as a request for a
      #     workspace called `api` and never answers. A probe written the obvious
      #     way therefore fails for a reason that has nothing to do with the DMG.
      #     `wait_for_health` in crates/lucidos-app/src/desktop.rs is the
      #     reference, and it carries the same warning.
      #  2. `open` DOES NOT INHERIT THIS SHELL'S ENVIRONMENT. LaunchServices
      #     starts the app from launchd's environment, so the job's exported
      #     LUCIDOS_ENGINE_PORT reaches the probe and nothing else.
      #     `launchctl setenv` is what puts it where `resolve_engine_port` reads
      #     it. A failure there is only a warning: the next two rungs of that
      #     resolution are `<app-data>/config/engine-port` and then
      #     DEFAULT_ENGINE_PORT, and on a clean runner both land on the same 5252.
      #
      # Plain http on loopback with no https fallback, unlike the `smoke` job's
      # `health_get`: a packaged window is pointed at `gateway_url`, which builds
      # `http://localhost:<port>` unconditionally, and a packaged gateway binds
      # loopback-only with no TLS opt-in.
      #
      # `scripts/e2e-packaged.sh` runs a longer version of this same ladder
      # locally, and the two are NOT redundant, so do not delete either for the
      # other. That script runs the bundle's headless `--service` role directly
      # under a temp HOME (ADR 0016: WKWebView exposes no WebDriver, so the
      # packaged window cannot be automated), which means it never touches
      # `open`, LaunchServices, launchd or the GUI client. This job is the only
      # thing that exercises the path a person actually takes, and the only one
      # that does it on a machine that has never seen the certificate.
      - name: App launches and the gateway becomes READY
        run: |
          set -uo pipefail
          base="http://127.0.0.1:$LUCIDOS_ENGINE_PORT"
          app_data="$HOME/Library/Application Support/com.lucidos.app"

          # Everything the runner can still say about a start that did not
          # finish. A bare "did not become ready" is what makes a red release
          # gate useless at 03:00, and this is the only place these files are
          # reachable: the service agent's plist redirects its stdout/stderr to
          # `<app-data>/logs/engine-service.{out,err}.log`, and the gateway is
          # spawned as its child with those descriptors inherited, so the service
          # log IS the gateway log.
          diagnostics() {
            echo "----- launchd agents on disk -----"
            ls -la "$HOME/Library/LaunchAgents" 2>/dev/null || echo "(no ~/Library/LaunchAgents)"
            echo "----- service agent in the launchd domain -----"
            launchctl print "gui/$(id -u)/com.lucidos.engine" 2>&1 | head -40 || true
            echo "----- lucidos processes -----"
            ps -Ao pid=,command= | grep -i lucidos | grep -v grep || echo "(none)"
            for logfile in engine-service.err.log engine-service.out.log client-login.err.log; do
              echo "----- $logfile (tail) -----"
              tail -n 120 "$app_data/logs/$logfile" 2>/dev/null || echo "(absent)"
            done
            echo "----------------------------------"
          }

          launchctl setenv LUCIDOS_ENGINE_PORT "$LUCIDOS_ENGINE_PORT" \
            || echo "::warning::launchctl setenv failed; the app falls back to <app-data>/config/engine-port and then DEFAULT_ENGINE_PORT, both $LUCIDOS_ENGINE_PORT on a clean runner"

          open -g "$APP" || { echo "::error::open failed"; diagnostics; exit 1; }
          echo "Launched $APP; polling $base/~/api/v1/health (timeout ${DMG_READY_TIMEOUT_SECS}s)…"

          # ── rung 1: the gateway answers health with status: ok ───────────────
          # First launch installs the LaunchAgent, launchd starts the service,
          # the service spawns the gateway, and only then does anything bind, so
          # the early attempts legitimately fail to connect.
          deadline=$(( $(date +%s) + DMG_READY_TIMEOUT_SECS ))
          body=""
          until [ "$(date +%s)" -ge "$deadline" ]; do
            body="$(curl -fsS --max-time 5 "$base/~/api/v1/health" 2>/dev/null || true)"
            if echo "$body" | grep -q '"status":"ok"'; then echo "Gateway healthy."; break; fi
            sleep 2
          done
          # The last response is quoted, and that is not padding: it is the one
          # fact separating "nothing was ever listening" from "it answered and
          # said it was unwell", and the two send a reader to different places.
          echo "$body" | grep -q '"status":"ok"' || {
            echo "::error::the packaged app never reported healthy at $base/~/api/v1/health within ${DMG_READY_TIMEOUT_SECS}s (last response: '$body'). A live process is not a working app, and this rung exists to say so."
            diagnostics
            exit 1
          }
          echo "health: $body"

          # role=gateway is what proves the answer came from OUR gateway rather
          # than from whatever else might be holding the port on the runner. A
          # status-only check would accept any local server that says "ok".
          echo "$body" | grep -q '"role":"gateway"' || {
            echo "::error::whatever answered $base/~/api/v1/health is not the Lucidos gateway (no role=gateway): $body"
            diagnostics
            exit 1
          }

          # ── rung 2: it is the RIGHT build ────────────────────────────────────
          # The GATEWAY's health payload is not the engine's, so do not copy the
          # `smoke` job's assertions verbatim: `gateway_health` in
          # crates/lucidos-gateway/src/server.rs emits
          # {status, role, release, workspaces, pending_binds}, with no
          # engine_version and no llm_configured to check. `release` is
          # LUCIDOS_RELEASE, baked from the repo's RELEASE file at compile time
          # (crates/lucidos-gateway/src/main.rs), so it names the build these
          # bytes came from and is exactly the field to compare against the tag.
          echo "$body" | grep -q "\"release\":\"$EXPECTED_VERSION\"" || {
            echo "::error::the DMG on this tag reports a release other than $EXPECTED_VERSION, so the wrong build is attached to it: $body"
            diagnostics
            exit 1
          }
          echo "Version matches ($EXPECTED_VERSION)."

          # ── rung 3: the frontend is served ───────────────────────────────────
          # 200 rather than a redirect is the correct expectation on a clean
          # runner: the smart root redirects into the sole workspace only when
          # there is exactly one, and a first run registers none, so `/` serves
          # the picker itself out of the bundle's Resources/frontend.
          code="$(curl -s -o /dev/null -w '%{http_code}' "$base/" || echo 000)"
          [ "$code" = "200" ] || {
            echo "::error::gateway root $base/ returned HTTP $code, so the packaged frontend is not being served"
            diagnostics
            exit 1
          }
          echo "Frontend serving 200 at $base/"

          echo "OK: DMG accepted, stapled, mounts, and its app BECOMES READY on a clean macOS runner."

      # ── TEARDOWN: bootout BEFORE detach ──────────────────────────────────────
      # `if: always()` so a failed probe still leaves the runner clean. It cannot
      # mask that probe either: every command here is best-effort and this step
      # always exits 0, so a red probe stays red and a green one cannot be turned
      # red by a wedged unmount on a machine that is about to be destroyed.
      #
      # THE ORDER IS LOAD-BEARING, top to bottom:
      #
      #  1. The LOGIN agent (`com.lucidos.client`) goes first. Its entire job is
      #     to `open` the client again, and nothing else may do that while the
      #     rest is being torn down.
      #  2. The CLIENT process next, and only the client. It is not a launchd job
      #     once running, so bootout does not reach it, and while it is alive its
      #     start-and-navigate loop re-bootstraps a service it finds missing:
      #     boot the service out first and a client still waiting on health (i.e.
      #     the failure path, the one case where teardown matters most) puts it
      #     straight back. The launchd-owned service is deliberately skipped here
      #     because killing it directly only earns a KeepAlive respawn.
      #  3. The SERVICE agent (`com.lucidos.engine`), whose stop handler tears
      #     down the gateway, then the workspace engines, then the embedded
      #     Postgres cluster (`GatewayService::shutdown`). Those all run straight
      #     out of the MOUNTED bundle, which is why this has to happen before the
      #     detach: unmount first and hdiutil fights a live engine holding files
      #     on the volume, leaving the runner with both a mount and a launchd job.
      #  4. Only now, the detach.
      #
      # And the WAIT in step 3 is not optional. `launchctl bootout` returns 0 when
      # launchd ACCEPTS the request, not when the job is gone, and the gateway
      # ignores SIGTERM (crates/lucidos-gateway/src/server.rs) so launchd has to
      # wait out ExitTimeOut and then SIGKILL it. Deciding on the exit code
      # instead has already shipped two bugs in the installer's own launchd
      # wrappers; scripts/lib/service.sh decides by observing the domain, and so
      # does this.
      - name: Tear down the launched app and unmount
        if: always()
        run: |
          set -uo pipefail
          uid="$(id -u)"

          bootout_and_wait() {
            local target="gui/$uid/$1"
            launchctl print "$target" >/dev/null 2>&1 || { echo "$1: not loaded"; return 0; }
            launchctl bootout "$target" 2>&1 || true
            for _ in $(seq 1 60); do   # launchd's own ExitTimeOut is 20s; allow headroom
              launchctl print "$target" >/dev/null 2>&1 || { echo "$1: left the launchd domain"; return 0; }
              sleep 1
            done
            echo "::warning::$1 was still in the launchd domain 60s after bootout"
          }

          # Every process running out of the mounted bundle EXCEPT the launchd
          # service, which carries `--service` in its argv (see
          # `desired_service_plist`). See point 2 of the ordering note above.
          #
          # SELECTION IS ON argv[0], NEVER ON THE WHOLE COMMAND LINE, because
          # this function's output is fed to `kill -9`. A process belongs to the
          # bundle if the BINARY IT RUNS is inside it; what its arguments happen
          # to mention is irrelevant, and a substring test over `ps -o command=`
          # cannot tell those apart. That is the rule in
          # `.claude/rules/dev-runtime.md` (ADR 0025), written after the same
          # shape SIGKILLed two coding-agent sessions on 2026-08-03, and the
          # login agent here is exactly the process it protects: its argv is
          # `/bin/sh -c … /usr/bin/open -g -a <bundle> …`, so it MENTIONS the
          # bundle while running none of it. The `--service` discriminator is
          # the one thing that must read the full line, and it only ever
          # SUBTRACTS from an already-selected set.
          #
          # The marker is `<bundle>/Contents/MacOS/` rather than the absolute
          # $APP, so the two path forms macOS uses for one file cannot make this
          # quietly match nothing. On a clean runner the mounted DMG is the only
          # place that bundle name exists.
          client_pids() {
            [ -n "${APP:-}" ] || return 0
            local marker
            marker="/$(basename "$APP")/Contents/MacOS/"
            ps -Ao pid=,command= | while read -r pid cmd; do
              # argv[0] is everything up to the first space, so a bundle name
              # containing one would silently select nothing. Warned about
              # rather than worked around: the productName has never had one,
              # and a guard that quietly stops guarding is the failure mode ADR
              # 0025 is about.
              case "${cmd%% *}" in
                *"$marker"*) ;;
                *) continue ;;
              esac
              case "$cmd" in
                *--service*) ;;          # launchd's: `bootout` stops it, not us
                *) echo "$pid" ;;
              esac
            done
          }

          case "${APP:-}" in
            *\ *) echo "::warning::the bundle path contains a space, so the argv[0] match in client_pids may select nothing and the teardown may leave the client running: ${APP}" ;;
          esac

          bootout_and_wait com.lucidos.client

          for pid in $(client_pids); do kill "$pid" 2>/dev/null || true; done
          for _ in $(seq 1 10); do
            if [ -z "$(client_pids)" ]; then break; fi
            sleep 1
          done
          for pid in $(client_pids); do kill -9 "$pid" 2>/dev/null || true; done

          bootout_and_wait com.lucidos.engine

          launchctl unsetenv LUCIDOS_ENGINE_PORT 2>/dev/null || true

          if [ -n "${MNT:-}" ]; then
            for _ in $(seq 1 15); do
              if hdiutil detach "$MNT" -quiet 2>/dev/null; then MNT=""; break; fi
              sleep 2
            done
            if [ -n "$MNT" ]; then
              echo "::warning::$MNT was still busy 30s after the graceful teardown; forcing the detach"
              hdiutil detach "$MNT" -force -quiet 2>/dev/null || true
            fi
          fi
          echo "Teardown complete."

  # ── TARBALL + SERVICE SMOKE ───────────────────────────────────────────────────
  # End-to-end smoke for the NEW DEFAULT installer path (download a prebuilt headless
  # tarball → verify its sha256 → extract → run) AND the always-on user-service
  # registration — the two surfaces every `curl … | sh` user actually hits, but which
  # today are covered ONLY by offline unit tests (scripts/lib/install_test.sh,
  # scripts/lib/service_test.sh) and never exercised on a real machine in CI.
  #
  # ARTIFACT SOURCE — build in-job, drive the DEFAULT path over a file:// base URL.
  # We deliberately do NOT `gh release download` the tarball. Most of this job's
  # triggers (a push to rc/**, a dispatch, the weekly cron) have NO matching Release
  # at all; and on `release: published` this job starts CONCURRENTLY with
  # release-tarballs.yml, which only finishes attaching the assets ~30 min later — so
  # a release-asset download would 404 or race on every run. Instead we build the
  # Linux x86_64 tarball with scripts/build-headless.sh (exactly as release-tarballs.yml
  # does) and point LUCIDOS_RELEASE_BASE_URL at the local dist/headless over file://.
  # install.sh's default path then runs its REAL codepath against it: resolve the host
  # triple → curl lucidos-<ver>-<triple>.tar.gz + .sha256 → MANDATORY fail-closed
  # checksum verify → extract → register the systemd --user service. (Same file://
  # technique install_test.sh uses offline; strictly higher-value than --from-tarball,
  # whose checksum is only optional.) What this job does NOT cover is the PUBLISHED
  # asset itself — that needs a run after release-tarballs.yml has attached it, which
  # is the `front-door` job's territory (it installs from the live origin).
  #
  # systemd --user ON ubuntu-latest: the hosted runner has no interactive login, so the
  # per-user systemd instance isn't running by default. `loginctl enable-linger` starts
  # user@<uid>.service + creates /run/user/<uid>; exporting XDG_RUNTIME_DIR +
  # DBUS_SESSION_BUS_ADDRESS makes `systemctl --user` connect. install.sh's
  # service_detect_manager probes exactly this — if it didn't work install.sh would
  # degrade to a foreground launch that never returns, so the setup step ASSERTS the
  # session is up and fails loud (rather than silently degrading).
  #
  # Verification ladder (the rungs this job adds on top of the offline tests):
  #   1. the systemd --user service is registered + active (lucidos-gateway-<slug>)
  #   2. gateway /~/api/v1/health → status:ok, role:gateway, release == RELEASE (the
  #      sigil namespace — a bare /api/v1/health resolves as a workspace slug and 404s)
  #   3. the ENGINE answers /api/v1/health: create a workspace → poll it healthy →
  #      /<slug>/api/v1/health → status:ok, release == RELEASE (embedded Postgres, no
  #      Docker — mirrors scripts/e2e-packaged.sh)
  #   4. uninstall.sh (data-safe, no --purge) removes the service (unit gone) — doubling
  #      as uninstall coverage
  #
  # Triggers: the same gate events as `smoke` (push to rc/**, workflow_dispatch, the
  # weekly schedule, and release: published with prerelease==false). Public mirror only
  # + Ubuntu only (free), same repo + release guards as the other jobs.
  tarball-smoke:
    name: tarball-smoke (ubuntu)
    # Weekly cron only (see the smoke job's schedule clause) — the daily cron is
    # front-door's.
    if: >-
      github.repository == 'lucidos-dev/lucidos'
      && (github.event_name != 'release'
          || github.event.release.prerelease == false)
      && (github.event_name != 'schedule'
          || github.event.schedule == '0 4 * * 1')
      && inputs.dmg_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LUCIDOS_PREFIX: ${{ github.workspace }}/.tarball-smoke-prefix
      SLUG: smoke
      GW_PORT: '5252'
      TRIPLE: x86_64-unknown-linux-gnu
      WS_HEALTH_TIMEOUT_SECS: '600'   # cold engine boot warms the embedding model
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mirror release-tarballs.yml's build setup: pgvector compiles via PGXS (make +
      # a C toolchain), the engine statically vendors OpenSSL (perl + cc), and the
      # frontend build needs Node. Install explicitly so a runner-image change can't
      # silently break the build.
      - name: Install Linux build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential perl pkg-config curl

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # install.sh requires Node 18+; 20 is the current LTS

      - name: Build the prebuilt headless tarball (the download artifact)
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d ' \t\r\n' < RELEASE)"
          ./scripts/build-headless.sh --triple "$TRIPLE" --version "$version" --out-dir dist/headless
          echo "--- artifacts:"; ls -la dist/headless
          echo "--- checksum self-verify:"; ( cd dist/headless && shasum -a 256 -c ./*.tar.gz.sha256 )

      # systemd --user must work BEFORE install.sh runs (else install.sh degrades to a
      # foreground launch that never returns). Persist XDG_RUNTIME_DIR +
      # DBUS_SESSION_BUS_ADDRESS to $GITHUB_ENV so install/verify/teardown inherit them.
      # Fail loud (not silently degrade) if the user session won't come up.
      - name: Enable the systemd --user session
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          xdg="/run/user/$uid"
          echo "XDG_RUNTIME_DIR=$xdg" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$xdg/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$xdg" DBUS_SESSION_BUS_ADDRESS="unix:path=$xdg/bus"
          ok=0
          for _ in $(seq 1 30); do
            systemctl --user show-environment >/dev/null 2>&1 && { ok=1; break; }
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::systemctl --user is unavailable after enabling linger (cannot test the service path)"
            loginctl show-user "$USER" 2>&1 | head -20 || true
            exit 1
          fi
          echo "systemd --user session is up."

      # DEFAULT mode (no --dev / --from-tarball): install.sh downloads the tarball +
      # .sha256 from LUCIDOS_RELEASE_BASE_URL, verifies the checksum (mandatory, fail
      # closed), extracts, and registers the systemd --user service. file:// points at
      # the just-built dist/headless so the real default codepath runs offline. In
      # service mode install.sh registers the BACKGROUND service and RETURNS (only the
      # --no-service foreground path blocks), so no `nohup … &` is needed.
      - name: Install via the default download path + register the service
        shell: bash
        run: |
          set -euo pipefail
          export LUCIDOS_VERSION="$(tr -d ' \t\r\n' < RELEASE)"
          export LUCIDOS_RELEASE_BASE_URL="file://$GITHUB_WORKSPACE/dist/headless"
          mkdir -p "$LUCIDOS_PREFIX"
          echo "base url: $LUCIDOS_RELEASE_BASE_URL"
          bash ./install.sh \
            --prefix "$LUCIDOS_PREFIX" --name "$SLUG" --port "$GW_PORT" \
            > "$RUNNER_TEMP/install.log" 2>&1
          echo "--- install.sh log tail:"; tail -n 40 "$RUNNER_TEMP/install.log"
          grep -qi "checksum verified" "$RUNNER_TEMP/install.log" \
            || { echo "::error::install log has no 'Checksum verified' line — the default download path did not run"; exit 1; }

      - name: Verify service + gateway + engine health
        shell: bash
        run: |
          set -uo pipefail
          unit="lucidos-gateway-${SLUG}.service"   # == service_systemd_unit_name "$SLUG"
          repo_version="$(tr -d ' \t\r\n' < RELEASE)"
          base="http://localhost:$GW_PORT"

          # ── rung 1: the always-on user service is registered + running ───────────
          if ! systemctl --user is-active --quiet "$unit"; then
            echo "::error::$unit is not active"
            systemctl --user status "$unit" --no-pager 2>&1 | head -40 || true
            exit 1
          fi
          unit_path="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/$unit"   # == service_systemd_unit_path
          if [ ! -f "$unit_path" ]; then echo "::error::unit file missing at $unit_path"; exit 1; fi
          echo "rung 1 OK — $unit active, unit file at $unit_path"

          # ── rung 2: gateway health (binds before embedded PG, so it comes up fast).
          # Assert status:ok, role:gateway, and release == RELEASE. ─────────────────
          gw=""
          for _ in $(seq 1 60); do
            gw="$(curl -fsS --max-time 5 "$base/~/api/v1/health" 2>/dev/null || true)"
            echo "$gw" | grep -q '"status":"ok"' && break
            sleep 1
          done
          echo "$gw" | grep -q '"status":"ok"'   || { echo "::error::gateway /~/api/v1/health not ok: $gw"; exit 1; }
          echo "$gw" | grep -q '"role":"gateway"' || { echo "::error::gateway health missing role=gateway: $gw"; exit 1; }
          echo "$gw" | grep -q "\"release\":\"$repo_version\"" \
            || { echo "::error::gateway release != RELEASE ($repo_version) — stale or wrong build: $gw"; exit 1; }
          echo "rung 2 OK — gateway healthy, release matches: $gw"

          # ── rung 3: the ENGINE answers /api/v1/health. It is reachable only behind a
          # workspace, so create one, poll it healthy, then hit it through the gateway
          # proxy. Embedded Postgres (no Docker); first boot warms the embedding model,
          # so allow a generous window. Mirrors scripts/e2e-packaged.sh. ─────────────
          create="$(curl -s --max-time 30 -X POST "$base/~/api/v1/control/workspaces" \
            -H 'Content-Type: application/json' -d '{"name":"smoke-ws"}' 2>/dev/null || true)"
          ws="$(printf '%s' "$create" | python3 -c 'import sys,json; print(json.load(sys.stdin)["workspace"]["id"])' 2>/dev/null || true)"
          [ -n "$ws" ] || { echo "::error::could not create workspace (response: $create)"; exit 1; }
          echo "created workspace slug: $ws"

          echo "polling workspace '$ws' to healthy (timeout ${WS_HEALTH_TIMEOUT_SECS}s)…"
          deadline=$(( $(date +%s) + WS_HEALTH_TIMEOUT_SECS ))
          health=""
          until [ "$(date +%s)" -ge "$deadline" ]; do
            list="$(curl -fsS --max-time 5 "$base/~/api/v1/control/workspaces" 2>/dev/null || true)"
            health="$(printf '%s' "$list" | WS="$ws" python3 -c 'import sys,json,os; s=os.environ["WS"]; d=json.load(sys.stdin); print(next((w.get("health","") for w in d.get("workspaces",[]) if w.get("id")==s), ""))' 2>/dev/null || true)"
            [ "$health" = "healthy" ] && break
            [ "$health" = "unhealthy" ] && { echo "::error::workspace '$ws' became unhealthy"; exit 1; }
            sleep 5
          done
          [ "$health" = "healthy" ] || { echo "::error::workspace '$ws' never became healthy within ${WS_HEALTH_TIMEOUT_SECS}s"; exit 1; }

          body="$(curl -fsS --max-time 10 "$base/$ws/api/v1/health" 2>/dev/null || true)"
          echo "$body" | grep -q '"status":"ok"'      || { echo "::error::engine /$ws/api/v1/health not ok: $body"; exit 1; }
          echo "$body" | grep -q "\"release\":\"$repo_version\"" || { echo "::error::engine release != RELEASE ($repo_version): $body"; exit 1; }
          echo "$body" | grep -q '"engine_version"'   || { echo "::error::engine health missing engine_version: $body"; exit 1; }
          echo "$body" | grep -q '"llm_configured"'   || { echo "::error::engine health missing llm_configured: $body"; exit 1; }
          echo "rung 3 OK — engine healthy through the gateway: $body"

          echo "OK — tarball download + always-on service smoke passed on ubuntu-latest"

      # Capture the gateway/engine journal BEFORE teardown (always), for diagnostics —
      # the systemd --user unit logs to the journal, not a file.
      - name: Capture the service journal
        if: always()
        shell: bash
        run: |
          journalctl --user -u "lucidos-gateway-${SLUG}.service" --no-pager \
            > "$RUNNER_TEMP/journal.log" 2>&1 || true
          echo "--- journal tail:"; tail -n 60 "$RUNNER_TEMP/journal.log" 2>/dev/null || true

      # Teardown doubles as UNINSTALL coverage: a data-safe uninstall (no --purge) must
      # stop + remove the service. Assert the unit is gone afterwards.
      - name: Uninstall (data-safe) and assert the service is gone
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          unit="lucidos-gateway-${SLUG}.service"
          bash ./uninstall.sh --prefix "$LUCIDOS_PREFIX" --name "$SLUG" \
            > "$RUNNER_TEMP/uninstall.log" 2>&1 || true
          echo "--- uninstall.sh log tail:"; tail -n 30 "$RUNNER_TEMP/uninstall.log" 2>/dev/null || true
          if systemctl --user is-active --quiet "$unit"; then
            echo "::error::$unit is still active after uninstall"; exit 1
          fi
          unit_path="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/$unit"   # == service_systemd_unit_path
          if [ -f "$unit_path" ]; then echo "::error::unit file still present after uninstall: $unit_path"; exit 1; fi
          echo "uninstall removed the service ($unit gone)"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarball-smoke-logs
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/uninstall.log
            ${{ runner.temp }}/journal.log
          if-no-files-found: ignore
          retention-days: 7

  # ── FRONT DOOR (the LIVE lucidos.dev origin) ─────────────────────────────────
  # WHY THIS EXISTS — do not delete it as "redundant with smoke".
  #
  # Every other job in this file tests a TREE: `smoke` installs from this
  # checkout, `tarball-smoke` builds the artifact in-job and serves it over
  # file://, `dmg-verify` consumes a release asset. In all three, install.sh's
  # helper libs (scripts/lib/*.sh) are present by construction — they are right
  # there on disk, or on GitHub. So none of them can see what the DEPLOYED origin
  # is serving, and on 2026-07-29 that blind spot shipped:
  #
  #   * The Cloudflare Pages deploy published /install.sh but NOT the
  #     scripts/lib/*.sh helpers a PIPED install sources (`curl … | sh` has no
  #     checkout, so _source_libs fetches them from ${INSTALL_URL%/install.sh}/scripts/lib).
  #   * Pages answers an unknown path with the landing-page HTML at status **200**
  #     (SPA fallback), so `curl -fsSL` SUCCEEDED and wrote HTML to the lib file.
  #   * The installer then sourced it as shell:
  #         stage_runtime.sh: line 1: syntax error near unexpected token `newline'
  #         stage_runtime.sh: line 1: `<!DOCTYPE html>'
  #
  # A green `smoke` cannot catch that; only a run against the real origin can.
  # This job is that net — it takes the exact path a Show HN reader takes.
  #
  # The two OTHER halves of the fix live elsewhere and are not duplicated here:
  # the Pages publisher uploads + post-deploy-verifies the helper libs, and
  # install.sh fails closed on an HTML payload. This job is the CI net that
  # notices when the deployed origin regresses regardless of either.
  #
  # ubuntu:22.04 CONTAINER, not the bare runner: the container's /bin/sh is dash,
  # so `| sh` takes install.sh's dash re-exec branch — it re-fetches itself and
  # then fetches the helper libs over the network, which is the exact code path
  # that broke. On the runner image /bin/sh is dash too, but a container also
  # gives us a machine with only curl + ca-certificates on it, like a real one.
  #
  # Verification ladder (all eight in full mode; rung 1 alone in payload mode):
  #   1. BEFORE installing: every payload the advertised commands fetch resolves
  #      to SHELL rather than HTML, meaning install.sh, every helper lib it
  #      declares, and uninstall.sh. The lib names and both URLs are PARSED out
  #      of the fetched install.sh (never hardcoded, or the list rots the day a
  #      lib is added, and a hardcoded origin could check one place while the
  #      installer fetches another). This is the rung that would have caught the
  #      2026-07-29 bug outright, and because it touches nothing but payloads it
  #      is the only one an RC can run.
  #   2. the install runs with no DOCTYPE / shell syntax error in its log
  #   3. the gateway answers /~/api/v1/health with status: ok (polled)
  #   4. the frontend serves HTTP 200
  #   5. `install.sh | sh -s -- --list` lists the instance (the DELEGATION path:
  #      install.sh fetches uninstall.sh from this origin and execs the payload)
  #   6. `uninstall.sh | sh -s -- --list` lists it too (the DIRECT piped path)
  #   7. a data-safe removal (`--uninstall --all`, no --purge) unregisters the
  #      service and KEEPS the data, which is what uninstall.sh --help promises
  #   8. `--all --purge` really removes the instance data AND the shared runtime
  #
  # TWO MODES, because two different callers need these rungs pointed at two
  # different origins (FD_MODE, resolved below):
  #
  #   * full    — all four rungs. workflow_dispatch (default origin
  #               https://lucidos.dev) + the DAILY cron, so a broken front door
  #               is caught within a day even when nobody publishes. The
  #               post-publish caller is a dispatch too: the Pages deploy runs
  #               OUTSIDE CI (a workspace trigger chain on the maintainer's
  #               machine), so `release: published` fires mid-deploy and would
  #               verify the previous origin. The publisher fires this dispatch
  #               itself once SitePublished lands.
  #   * payload — rung 1 only, then stop green. Auto-runs on every push to rc/**
  #               against https://rc.lucidos.dev, where the RC copy of the
  #               installer is published (libs at /scripts/lib/ on that host), so the
  #               soft-404 class is caught BEFORE anything reaches the real path.
  #               Rung 1 covers the UNINSTALLER too, so an RC is gated on both
  #               halves of the advertised experience being real shell.
  #
  # WHY PAYLOAD MODE MUST NOT INSTALL — do not "fix" this by re-enabling rungs
  # 2-4 for the RC. An RC install.sh bakes LUCIDOS_DEFAULT_VERSION=<rc version>
  # and resolves its tarball to
  # https://github.com/lucidos-dev/lucidos/releases/download/v<ver>/… . During an
  # RC that tag DOES NOT EXIST: Phase A publishes only an `rc-<ver>` PRERELEASE
  # carrying the DMG + updater .sig, and headless tarballs live solely on real
  # `v*` releases. A full `curl | sh` against the RC origin's /install.sh would therefore 404
  # at the download step every single time and this job would be permanently red.
  # Nothing is lost: the bug class the RC gate exists to catch (the 2026-07-29
  # soft-404 — the origin answers a script path with the landing page at status
  # 200, piped into a shell) is caught entirely by rung 1, which only fetches and
  # sniffs payloads. Rung 2 cannot help here — it is an assertion over the LOG of
  # a real install run, so it needs the tarball rung 1 deliberately never wants.
  front-door:
    name: front-door (${{ github.event_name == 'push' && 'rc, payload only' || 'live origin' }}, ubuntu:22.04)
    # Public mirror only (see the smoke job's repo guard). Dispatch, the daily
    # cron, and the rc/** push — never the release events this workflow also
    # listens for, and never the weekly cron (that one is smoke/tarball-smoke's).
    # The rc/** arm is spelled out rather than left implicit in `push`: the only
    # push trigger on this workflow is rc/** today, and an added branch must not
    # silently inherit the front-door gate.
    if: >-
      github.repository == 'lucidos-dev/lucidos'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push'
              && startsWith(github.ref, 'refs/heads/rc/'))
          || (github.event_name == 'schedule'
              && github.event.schedule == '0 6 * * *'))
      && inputs.dmg_tag == ''
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    # The ceiling must always exceed the budgets it contains, and
    # front_door_gate_test.sh does that arithmetic from the literals in this
    # file, over all THREE waits: FD_EXPECT_VERSION_WAIT_SECS (600, and it can
    # stack on the next one) + FD_ASSET_WAIT_SECS (300) +
    # GW_HEALTH_TIMEOUT_SECS (900) leaves 2700 s of 75 minutes for the install
    # itself, the four uninstall rungs and the runner setup. It went 30 -> 75
    # when the asset preflight arrived, 75 -> 105 when that preflight's budget
    # was raised to an hour to cover the attach window, and back to 75 now that
    # the attach window is gone: the release is a DRAFT until it is complete, so
    # nothing here waits for a build. A job timeout is a hard kill with no
    # diagnosis, which is exactly the burying this file's guards exist to
    # prevent.
    timeout-minutes: 75
    # This job pipes remote code into a shell by design, so give it a token with
    # no scopes at all — it reads nothing from the repo and writes nothing back.
    permissions: {}
    env:
      # Which rungs run. A push to rc/** is always payload-only (the tarball for
      # an RC does not exist — see the block above); anything else takes the
      # dispatch input, which defaults to full. The input exists so a human CAN
      # point a dispatch at the RC origin without the job being structurally red.
      FD_MODE: ${{ (github.event_name == 'push' && 'payload') || inputs.mode || 'full' }}
      # The RAW origin — possibly attacker-influenced (a dispatch input), so it is
      # deliberately NOT named FRONT_DOOR and is never consumed directly. The
      # first step validates + normalises it and exports the real FRONT_DOOR via
      # $GITHUB_ENV; every later step reads THAT, under `set -u`, so a validation
      # step that never ran leaves nothing usable behind.
      FRONT_DOOR_INPUT: ${{ (github.event_name == 'push' && 'https://rc.lucidos.dev') || inputs.origin || 'https://lucidos.dev' }}
      # The release this run was dispatched to verify, or empty. Only a dispatch
      # can carry it: on the cron and on the rc/** push there is no `inputs`
      # object at all, so this resolves to '' and rung 1 keeps its single-read
      # behaviour. See the input's own comment for what it buys.
      FD_EXPECT_VERSION: ${{ inputs.expect_version || '' }}
      # The RC origin sits behind Cloudflare Access. Every fetch of it must
      # present the `lucidos-ci-front-door` service token or the gate answers
      # 302 to a login page — which the payload sniff would correctly report as
      # "not shell", but for the wrong reason. Empty for the production origin,
      # which is public; the curl wrapper only adds the headers when both are set.
      RC_ACCESS_CLIENT_ID: ${{ secrets.RC_ACCESS_CLIENT_ID }}
      RC_ACCESS_CLIENT_SECRET: ${{ secrets.RC_ACCESS_CLIENT_SECRET }}
      GW_DEFAULT_PORT: '5252'          # install.sh's default; it auto-picks upward if taken
      GW_HEALTH_TIMEOUT_SECS: '900'    # download + extract + embedded-PG first boot
      # ── the release-asset backstop (full mode) ───────────────────────────────
      # THIS NO LONGER WAITS FOR A BUILD, and that is the whole change of
      # 2026-08-04. A GitHub Release is now created as a DRAFT and published
      # only once release-tarballs.yml has attached all four per-platform
      # tarballs, so by the time any release is visible, its assets are on it.
      # This preflight therefore stopped being the thing that decides anything:
      # it is a backstop against a hung origin or an asset that vanished, not a
      # wait for a build that is still running.
      #
      # THE BUDGET WAS SIZED FOR THE OLD ORDERING and is deliberately not kept.
      # It had to cover cut-to-attached for the slowest triple (v0.19.0 25m48s,
      # v0.20.0 30m07s, v0.21.0 34m43s, v0.20.1 44m52s), which is why it was
      # raised 1800 -> 3600 s on 2026-08-04 after v0.21.0's Intel tarball landed
      # 3m33s past the old ceiling. That raise was a band-aid on the ordering,
      # and the ordering is what got fixed. 300 s now covers the only thing left
      # to absorb: GitHub's own asset propagation, seconds, plus slack.
      #
      # A LONGER BUDGET WOULD BE ACTIVELY WORSE. Under the new ordering a
      # missing asset means something is genuinely wrong (a release published
      # with --allow-missing-tarballs, or an asset deleted afterwards), and no
      # amount of waiting fixes either. Waiting an hour to say so just buries
      # the verdict. scripts/lib/front_door_gate_test.sh caps this at 900 s so
      # re-inflating it reds a test rather than a release.
      FD_ASSET_WAIT_SECS: '300'        # 5 min: CDN propagation, not a build
      FD_ASSET_POLL_SECS: '30'
      # ── the RC version-convergence budget (payload mode, rung 1) ─────────────
      # How long rung 1 will keep re-reading the served installer's baked version
      # with cache-busting before it calls an rc/** mismatch real. The full
      # reasoning is at the check itself; the short version is that the arming
      # wait in release.sh polls from ONE Cloudflare POP and a GitHub runner
      # resolves to another, so a single fetch is a sample rather than a verdict.
      #
      # BOUNDED, and additive ONLY on the failing path: a correctly-propagated
      # POP matches on the very first fetch and spends none of this. It is also
      # mutually exclusive with FD_ASSET_WAIT_SECS (that budget is full mode, this
      # one only ever runs in payload mode), so it cannot stack with the
      # preflight, and 240 s sits far inside the 75-minute ceiling either way.
      FD_RC_VERSION_WAIT_SECS: '240'   # 4 min of propagation slack, then it is real
      FD_RC_VERSION_POLL_SECS: '30'    # so roughly 8 re-reads after the first fetch
      # ── the expect_version convergence budget (rung 1, dispatch only) ────────
      # ITS OWN BUDGET, deliberately not a reuse of the rc pair above. The two
      # loops answer different questions against different origins (this one
      # polls the PLAIN production URL, that one polls a nonced RC URL) and they
      # wait out different phenomena, so tuning one must never silently retune
      # the other. Generous at 10 minutes because the caller fires this dispatch
      # within seconds of the deploy, which is the widest part of the
      # propagation window; the same coarse 30 s poll, because these are plain
      # cached GETs of a small file and not something to hammer.
      #
      # It CAN stack with FD_ASSET_WAIT_SECS (a POP that lags is exactly a POP
      # whose release is new enough for the tarballs to still be attaching), so
      # check the ceiling: 600 + 1800 + 900 health + 900 slack is 4200 s, inside
      # the 75-minute (4500 s) job timeout. Nothing is spent on the settled path:
      # a POP already serving the expected release matches on the first read.
      FD_EXPECT_VERSION_WAIT_SECS: '600'   # 10 min of post-publish propagation slack
      FD_EXPECT_VERSION_POLL_SECS: '30'    # so roughly 20 plain re-reads after the first
      # A stranger's shell has no LUCIDOS_* set, but this workflow's top-level env
      # block exports two for the --dev smoke job — and install.sh treats every
      # LUCIDOS_* as a flag. Blank them so this job reproduces a bare machine
      # (install.sh resolves each with `${VAR:-default}`, so empty == unset).
      LUCIDOS_HOME: ''
      LUCIDOS_WORKSPACE: ''
    steps:
      # ── validate the origin BEFORE anything touches it ────────────────────────
      # The origin can come from a workflow_dispatch input, and this job pipes
      # whatever it fetches straight into a shell — so treat it as hostile input.
      # Accept ONLY https:// over a strict character allowlist: the later steps
      # embed it in a command line, and a value carrying ';', '$(…)', backticks,
      # quotes or whitespace would be shell, not a URL. (`https://` also keeps a
      # dispatch off plain http and off file:// — no downgrade, no local read.)
      #
      # This is a floor, not a leash: a dispatch is already write-access-gated,
      # so the point is that a mistyped or copy-pasted value fails LOUDLY here
      # rather than turning into an arbitrary command three steps later.
      - name: Resolve and validate the origin under test
        shell: bash
        run: |
          set -euo pipefail

          case "$FD_MODE" in
            full|payload) ;;
            *) echo "::error::FD_MODE must be 'full' or 'payload' (got '$FD_MODE')"; exit 1 ;;
          esac

          # Be forgiving about a pasted trailing slash — every use site appends
          # "/install.sh", and "…//install.sh" would soft-404 into a confusing
          # HTML diagnosis rather than an obvious "you typed a trailing slash".
          origin="$FRONT_DOOR_INPUT"
          while [ "${origin%/}" != "$origin" ]; do origin="${origin%/}"; done

          if ! [[ "$origin" =~ ^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?(/[A-Za-z0-9._~-]+)*$ ]]; then
            echo "::error::refusing origin '$FRONT_DOOR_INPUT' — it must be an https:// URL of the form https://host[:port][/path] using only [A-Za-z0-9._~-] in its path. This job pipes what the origin serves into a shell, so anything that is not plainly a URL is rejected."
            exit 1
          fi

          # ── an RC origin is REFUSED unless this is the rc/** push ─────────────
          # A HARD REFUSE, decided deliberately on 2026-07-31 (see
          # docs/plans/2026-07-31-front-door-asset-preflight-and-rc-dispatch.md).
          # Do NOT soften it back into "downgrade to payload and carry on".
          #
          # The RC leg of this workflow is owned by the `push: rc/**` arm, which
          # points itself at https://rc.lucidos.dev in payload mode on every
          # release candidate. A DISPATCH naming the RC origin is therefore not a
          # mode question, it is a caller sending an origin it was never supposed
          # to send. That used to happen for a known reason: the workspace
          # trigger verify-front-door-after-publish filtered the RC origin by a
          # `/rc` path suffix, which stopped matching when the RC front door
          # moved to its own host on 2026-07-30. THAT FILTER HAS BEEN FIXED, so
          # an RC origin arriving here now means something regressed again.
          # Downgrading the run would silently absorb the evidence of exactly the
          # regression this job exists to surface. A refusal is a real signal.
          #
          # Refused HERE, in the first step, before anything is fetched: running
          # the payload rungs green and only then failing is slower and reads as
          # an origin problem rather than the caller problem it is.
          case "$origin" in
            https://rc.*|*/rc) fd_is_rc=1 ;;   # the host form, and the legacy path form
            *)                 fd_is_rc=0 ;;
          esac

          if [ "$fd_is_rc" -eq 1 ] && [ "${GITHUB_EVENT_NAME:-}" != "push" ]; then
            echo "::error::refusing origin '$origin' on a '${GITHUB_EVENT_NAME:-unknown}' event. The RC front door is verified by THIS workflow's 'push: rc/**' arm, payload-only, on every release candidate; a dispatcher is not supposed to send this origin at all. Check the CALLER: the workspace trigger verify-front-door-after-publish dispatches this job after a publish and must send the production origin only."
            exit 1
          fi

          # Fail-closed companion, covering the one path that legitimately
          # reaches the RC origin. The rc/** push pins FD_MODE to 'payload' in
          # the job env, so this cannot fire today; it is here so that an edit to
          # that expression reds in the validate step instead of driving a real
          # install against an origin with no v<version> tag and therefore no
          # headless tarball (see the long note at the top of this job).
          if [ "$fd_is_rc" -eq 1 ] && [ "$FD_MODE" != "payload" ]; then
            echo "::error::the RC origin '$origin' is payload-only, but FD_MODE is '$FD_MODE'. An RC has no v<version> release tag and therefore no headless tarball, so a full install here would 404 at the download step on every single run."
            exit 1
          fi

          # Export under a DIFFERENT name than the raw input, so a later step can
          # never accidentally read the unvalidated value, and so a skipped or
          # failed validation leaves FRONT_DOOR unset (every consumer runs under
          # `set -u`, i.e. fail closed) instead of silently usable. Writing to
          # $GITHUB_ENV is only safe AFTER the allowlist: the file is parsed
          # line-by-line, so a value carrying a newline could otherwise define a
          # second, arbitrary variable for every later step.
          echo "FRONT_DOOR=$origin" >> "$GITHUB_ENV"

          # ── the expected release, if the caller named one ─────────────────────
          # Checked for SHAPE here rather than at the point of use, because a
          # value of the wrong shape can never equal the served
          # LUCIDOS_DEFAULT_VERSION and would therefore cost the entire
          # convergence budget and then red for a reason that has nothing to do
          # with the origin. A bare release number is what install.sh bakes and
          # what the caller reads off the SitePublished payload, so a leading
          # 'v' (the mistake a hand-typed dispatch actually makes) is refused by
          # name. No normalisation: guessing what the caller meant is how a run
          # ends up verifying a release nobody asked for.
          if [ -n "${FD_EXPECT_VERSION:-}" ] && ! [[ "$FD_EXPECT_VERSION" =~ ^[0-9][A-Za-z0-9.+-]*$ ]]; then
            echo "::error::refusing expect_version '$FD_EXPECT_VERSION'. It must be a bare release number exactly as install.sh bakes it (for example 0.20.1), not a tag (v0.20.1) and not a URL. Rung 1 compares it to the served LUCIDOS_DEFAULT_VERSION, so any other shape can never match and would only fail after the whole ${FD_EXPECT_VERSION_WAIT_SECS}s convergence budget."
            exit 1
          fi

          echo "origin: $origin"
          echo "mode:   $FD_MODE"
          echo "expect: ${FD_EXPECT_VERSION:-(none: rung 1 accepts whatever this origin serves)}"
          if [ "$FD_MODE" = "full" ]; then
            echo "rungs:  1 (payload sniff), 2 (no HTML sourced), 3 (gateway health), 4 (frontend 200)"
          else
            echo "rungs:  1 (payload sniff) ONLY — no install, no tarball, no gateway"
          fi

      # A bare machine, not a CI image: only what a fresh server actually has.
      # NO checkout — this job must know nothing about the tree it lives in; its
      # entire input is what the origin under test serves.
      - name: Bare-machine deps (curl + ca-certificates only)
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates
          echo "/bin/sh -> $(readlink -f /bin/sh)"   # must be dash: that is the point

      # ── rung 1 ────────────────────────────────────────────────────────────────
      # The assertion that would have caught the 2026-07-29 failure outright, and
      # the reason this job is worth its minutes. `curl -fsSL` is NOT enough on a
      # soft-404 origin: -f only fails on an HTTP error status, and Pages' SPA
      # fallback returns the landing page at 200. So check the PAYLOAD.
      - name: Every helper lib the installer needs resolves to shell, not HTML
        shell: bash
        run: |
          set -uo pipefail
          # A STABLE directory, not `mktemp -d`: the asset preflight below reuses
          # the payloads this rung already fetched (the served install.sh, and
          # the served install_common.sh + headless_tarball.sh it derives the
          # download URL from) rather than fetching the origin a second time and
          # risking a second, differing answer. Each step is its own shell, so a
          # random path would not survive to the next one.
          tmp="$RUNNER_TEMP/front-door-payloads"
          rm -rf "$tmp"
          mkdir -p "$tmp"

          # ── Cloudflare Access headers for the gated RC origin ────────────────
          # rc.lucidos.dev is behind an Access app; the service token is the only
          # non-interactive way past it. Production is public and gets no headers,
          # so FD_HDR stays empty there and every curl below is unchanged.
          #
          # An unset FD_HDR would abort the step under `set -u`, so it is always
          # declared. Bash 4.4+ (ubuntu:22.04 has 5.1) expands "${FD_HDR[@]}" of
          # an empty array to nothing rather than an empty string.
          #
          # THE ORIGIN IS TESTED FIRST, and the order is load-bearing. The two
          # secrets are set at JOB level, so they are present on a production run
          # too; keying only on "are the secrets set?" attached the RC service
          # token to every https://lucidos.dev fetch, disclosing a credential to
          # a host that has no use for it. `curl -L` also forwards custom headers
          # across a cross-host redirect, so the exposure was not bounded by the
          # origin we typed. Gated origin decides; the secrets only decide
          # whether that origin can be reached at all.
          FD_HDR=()
          if [ "$FRONT_DOOR" != "${FRONT_DOOR#https://rc.}" ]; then
            if [ -n "${RC_ACCESS_CLIENT_ID:-}" ] && [ -n "${RC_ACCESS_CLIENT_SECRET:-}" ]; then
              FD_HDR=(-H "CF-Access-Client-Id: $RC_ACCESS_CLIENT_ID"
                      -H "CF-Access-Client-Secret: $RC_ACCESS_CLIENT_SECRET")
              echo "==> Cloudflare Access service token present (gated origin)"
            else
              # Named explicitly rather than left to fail as "returned HTML": a
              # missing secret and a broken deploy look identical in the payload
              # sniff, and only one of them is an origin regression.
              echo "::error::$FRONT_DOOR is behind Cloudflare Access but RC_ACCESS_CLIENT_ID/SECRET are not set. Every fetch will get the 302 login page and be reported as 'not shell'. Add both repo secrets (Cloudflare -> Access -> Service Tokens -> lucidos-ci-front-door)."
              exit 1
            fi
          fi

          # assert_shell_file <file> <url> — the payload must be a shell script.
          # Two distinct failures, because they mean different things: a body
          # starting with '<' is the soft-404 HTML (the origin is misconfigured),
          # while a missing shebang is "something else entirely is at this URL".
          assert_shell_file() {
            local f="$1" url="$2" first_line
            if [ ! -s "$f" ]; then
              echo "::error::$url returned an EMPTY body"
              return 1
            fi
            if [ "$(head -c 1 "$f")" = "<" ]; then
              # A Cloudflare Access login page is an AUTH failure, NOT a soft
              # 404, and conflating the two is what sent the 2026-07-31 dispatch
              # chasing a Pages misconfiguration that did not exist. Access
              # answers an unauthorized fetch with a 302, `curl -L` follows it,
              # and the login page arrives at 200 as HTML, which this
              # first-byte test cannot tell apart from the SPA fallback. Where
              # the fetch LANDED can, and it was recorded at the installer fetch
              # below. On the gated origin the unset-token case is refused
              # earlier in this step, so reaching here with THAT origin means a
              # token was sent and Access rejected it; the message covers the
              # other origin too rather than asserting a token nobody sent.
              case "${FD_EFFECTIVE_URL:-}" in
                *cloudflareaccess.com*)
                  echo "::error::$url served no payload: the fetch was redirected to the Cloudflare Access login page at ${FD_EFFECTIVE_URL}. That is an AUTH failure, not the Pages soft 404, and it says nothing about what $FRONT_DOOR actually serves. If this is the gated RC origin, a service token was sent (an unset one is refused earlier in this step) and Access REJECTED it: check that RC_ACCESS_CLIENT_ID / RC_ACCESS_CLIENT_SECRET are current and still authorized for this Access application. If it is not, then an Access application has started covering a host that is supposed to be public, which is an origin change rather than a CI one."
                  echo "    first 3 lines:"; head -n 3 "$f" | sed 's/^/      /'
                  return 1
                  ;;
              esac
              echo "::error::$url returned HTML, not shell — the origin answered a script path with the landing page at status 200 (soft 404). A piped install sources this AS SHELL."
              echo "    first 3 lines:"; head -n 3 "$f" | sed 's/^/      /'
              # In payload mode the whole origin is a subpath the site publisher
              # creates, so "HTML at 200" has a second, much likelier cause than
              # a regressed deploy: the route simply does not exist yet. Say so —
              # an RC gate that reds with a bare "returned HTML" reads as a
              # production incident when it is really "nothing published here".
              if [ "${FD_MODE:-full}" = "payload" ]; then
                echo "    NOTE: this is the RC front door. Every path under $FRONT_DOOR/ answers with the landing page at 200 when the RC copy of the installer has not been published there — check that the site publisher uploaded install.sh + scripts/lib/*.sh under $FRONT_DOOR/ for THIS release candidate before treating this as an origin regression."
              fi
              return 1
            fi
            first_line="$(head -n 1 "$f")"
            case "$first_line" in
              '#!'*) ;;
              *)
                echo "::error::$url has no '#!' shebang on line 1 — it is not a shell script"
                echo "    first 3 lines:"; head -n 3 "$f" | sed 's/^/      /'
                return 1
                ;;
            esac
            printf '    OK  %-58s %8s bytes  %s\n' "$url" "$(wc -c < "$f" | tr -d ' ')" "$first_line"
            return 0
          }

          # The EFFECTIVE URL is recorded, not only the body. Cloudflare Access
          # answers an unauthorized fetch with a 302 to a login page that arrives
          # at 200 as HTML, so the payload sniff alone reports it as a soft 404;
          # where the fetch landed is what tells the two apart, and
          # assert_shell_file consults this.
          echo "==> Fetching the advertised installer"
          FD_EFFECTIVE_URL="$(curl -fsSL "${FD_HDR[@]}" "$FRONT_DOOR/install.sh" -o "$tmp/install.sh" -w '%{url_effective}')" \
            || { echo "::error::could not fetch $FRONT_DOOR/install.sh"; exit 1; }
          assert_shell_file "$tmp/install.sh" "$FRONT_DOOR/install.sh" || exit 1

          # ── the version the SERVED installer will resolve ─────────────────────
          # Parsed on every event, not only the rc/** push, because the asset
          # preflight needs the same number: a piped run has no checkout and
          # therefore no adjacent RELEASE file, so this baked constant is exactly
          # what install.sh downloads. Exported for the preflight step, and
          # parsed ONCE here so the rc check below and the preflight can never
          # disagree about which version this origin serves.
          #
          # Fails closed. A parser that finds nothing must never be read as "the
          # version is fine": the rc check would vacuously pass and the preflight
          # would probe a URL no installer would ever request.
          served_version="$(sed -n 's/^LUCIDOS_DEFAULT_VERSION="\([^"]*\)".*/\1/p' "$tmp/install.sh" | head -n 1)"
          if [ -z "$served_version" ]; then
            echo "::error::could not parse LUCIDOS_DEFAULT_VERSION out of the served $FRONT_DOOR/install.sh. This check must never silently pass, so it fails closed."
            grep -n '^LUCIDOS_DEFAULT_VERSION=' "$tmp/install.sh" || true
            exit 1
          fi
          echo "    served version: $served_version"

          # ── the RC origin must be serving THIS release candidate ──────────────
          # Only on an rc/** push, where the branch name pins the version we are
          # gating (release.sh force-pushes the stripped tree to rc/<version>).
          # Without this, the previous RC's copy, still sitting at the same URL,
          # satisfies every payload check and the gate goes green having verified
          # last release's installer. That is the "passes for the wrong reason"
          # failure this whole job exists to avoid, so it is fatal, not a warning.
          #
          # The baked constant parsed above is what a piped install actually
          # resolves, and release.sh rewrites it in the same step that bumps
          # RELEASE, so it pins the candidate exactly.
          #
          # A MISMATCH IS RE-READ BEFORE IT IS BELIEVED, and this is the one part
          # of the check that is not a plain assertion. release.sh arms this gate
          # by publishing /rc and then blocking until the origin serves the
          # candidate (scripts/lib/release_rc_front_door.sh), but that wait polls
          # from the maintainer's Mac and therefore observes exactly ONE
          # Cloudflare POP. A GitHub runner resolves to a different one, whose
          # edge cache can still be holding the PREVIOUS release's copy. Twice
          # now the arming wait reported the new version while a runner read the
          # old one: v0.18.3, and v0.18.5 on 2026-07-31 where ONLY the
          # macos-latest leg reddened while macos-15-intel and ubuntu read the
          # correct version off the same origin. That is the signature of a
          # per-POP cache, not an origin regression, and both went green on a
          # bare `gh run rerun --failed`. A single fetch is a SAMPLE from one POP
          # at one instant, and treating it as a verdict is what reddened them.
          #
          # So the mismatch case, and ONLY the mismatch case on the rc/** push
          # arm, polls to a bounded deadline (FD_RC_VERSION_WAIT_SECS, every
          # FD_RC_VERSION_POLL_SECS). Every other verdict in this step is
          # unchanged and still immediate: an unparseable version above still
          # fails closed on the first read, HTML and a Cloudflare Access login
          # page still fail with their own messages (the retry re-runs
          # assert_shell_file, so a retry that lands on HTML is reported as HTML
          # rather than swallowed as another mismatch), and a non-push event
          # asserts no version at all.
          #
          # Each retry MUST defeat the edge cache or it just re-reads the same
          # stale POP copy for four minutes and only makes the red slower. Two
          # mechanisms together: a per-attempt nonce in the query string, which
          # Cloudflare includes in its cache key so a fresh one forces a MISS and
          # a pull from the Pages origin, and the no-cache request headers.
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            case "${GITHUB_REF_NAME:-}" in
              rc/?*) rc_version="${GITHUB_REF_NAME#rc/}" ;;
              *) echo "::error::this job only runs on a push for an rc/<version> branch, got '${GITHUB_REF_NAME:-}'"; exit 1 ;;
            esac
            rc_started="$(date +%s)"
            rc_deadline=$(( rc_started + FD_RC_VERSION_WAIT_SECS ))
            rc_attempt=0
            while [ "$served_version" != "$rc_version" ]; do
              if [ "$(date +%s)" -ge "$rc_deadline" ]; then
                echo "::error::$FRONT_DOOR/install.sh bakes version $served_version, but this push is $GITHUB_REF_NAME (expected $rc_version): the RC front door is serving a DIFFERENT release candidate. This is not a first-read verdict. The baked version was re-read with a cache-busting query nonce and no-cache headers $rc_attempt time(s) across the full ${FD_RC_VERSION_WAIT_SECS}s budget and never converged, so Cloudflare POP propagation lag no longer explains it. Either the site publisher has not published this RC's installer yet, or it published another one; gating against it would verify the wrong tree. Last read: $served_version. Expected: $rc_version."
                exit 1
              fi
              sleep "$FD_RC_VERSION_POLL_SECS"
              rc_attempt=$(( rc_attempt + 1 ))
              # The nonce is per attempt AND carries the clock, so no two fetches
              # in a run (or across reruns) can share a cache key.
              rc_url="$FRONT_DOOR/install.sh?cb=$(date +%s)-$rc_attempt"
              FD_EFFECTIVE_URL="$(curl -fsSL "${FD_HDR[@]}" -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$rc_url" -o "$tmp/install.sh" -w '%{url_effective}')" \
                || { echo "::error::could not re-fetch $rc_url while waiting for this runner's Cloudflare POP to serve $rc_version"; exit 1; }
              # The whole payload is re-validated, not just the version: the
              # retried copy is the one every later step reads out of $tmp.
              assert_shell_file "$tmp/install.sh" "$rc_url" || exit 1
              served_version="$(sed -n 's/^LUCIDOS_DEFAULT_VERSION="\([^"]*\)".*/\1/p' "$tmp/install.sh" | head -n 1)"
              if [ -z "$served_version" ]; then
                echo "::error::could not parse LUCIDOS_DEFAULT_VERSION out of the re-fetched $rc_url. This check must never silently pass, so it fails closed."
                grep -n '^LUCIDOS_DEFAULT_VERSION=' "$tmp/install.sh" || true
                exit 1
              fi
              echo "    re-read $rc_attempt at $(( $(date +%s) - rc_started ))s: this POP now serves $served_version (want $rc_version)"
            done
            if [ "$rc_attempt" -gt 0 ]; then
              echo "::warning::the RC front door needed $rc_attempt cache-busting re-read(s) over $(( $(date +%s) - rc_started ))s before this runner's Cloudflare POP served $rc_version. The origin is fine: this is Cloudflare POP propagation lag on the RC origin, which release.sh's arming wait cannot see because it polls from a single vantage point. Recorded here so the run does not read as a clean first-try pass."
            fi
            echo "    OK  the RC front door serves $served_version, matching $GITHUB_REF_NAME"
          fi

          # ── this POP must serve the release we were dispatched to verify ──────
          # WHY: rung 1 fetches install.sh ONCE, and the "Run the advertised
          # command" step below fetches it AGAIN, independently, seconds or
          # minutes later. Nothing pins those two fetches to the same release,
          # and in the window right after a publish they legitimately disagree:
          # Cloudflare POPs are mid propagation, so one read answers with the new
          # release and the next with the old one. Everything in between, the
          # asset preflight included, is then verifying a release the install
          # will not download.
          #
          # That is not hypothetical. On 2026-08-03 the post-publish dispatch for
          # v0.20.1 fired 28 s after the release published. The ubuntu leg read
          # 0.20.1 here, its preflight waited out the ~14 min tarball attach
          # window and it went green. Both macOS legs read 0.20.0 from a
          # different POP, so their preflight passed on attempt 1 against the
          # PREVIOUS release's assets, and then the install step re-fetched
          # install.sh from a POP that had since flipped, resolved 0.20.1, and
          # died on a tarball release-tarballs.yml had not attached yet. Nothing
          # was broken in the shipped tree: the preflight verified one release
          # and the install downloaded another.
          #
          # So when the caller tells us which release it dispatched us to verify,
          # converge on it before exporting anything. An EMPTY input is the
          # unchanged path and must stay one: the daily cron runs long after the
          # assets have settled and must not gain a new way to red, and a manual
          # dispatch with no input keeps its single read.
          #
          # THIS LOOP DELIBERATELY DOES NOT CACHE-BUST, and the contrast with the
          # rc loop above is the load-bearing detail. Up there the nonce is
          # right: payload mode STOPS after rung 1, so the nonced fetch is the
          # last word, and forcing a cache MISS is the fastest route to the
          # truth. Here it would be actively wrong. A '?cb=' query string is a
          # DIFFERENT Cloudflare cache key, so converging on the nonced URL would
          # prove nothing about the plain one, which is the URL the install step
          # below actually fetches, and the drift this loop exists to close would
          # stay wide open. What has to be asserted is the stranger-visible
          # truth: this POP serves the expected release at $FRONT_DOOR/install.sh
          # to a plain unadorned curl. So poll exactly that: no nonce, no
          # Cache-Control, no Pragma. Do not "fix" this back into a nonce.
          if [ -n "${FD_EXPECT_VERSION:-}" ]; then
            ev_started="$(date +%s)"
            ev_deadline=$(( ev_started + FD_EXPECT_VERSION_WAIT_SECS ))
            ev_attempt=0
            while [ "$served_version" != "$FD_EXPECT_VERSION" ]; do
              if [ "$(date +%s)" -ge "$ev_deadline" ]; then
                echo "::error::$FRONT_DOOR/install.sh still bakes $served_version after the full ${FD_EXPECT_VERSION_WAIT_SECS}s budget, but this run was dispatched to verify $FD_EXPECT_VERSION. The plain (deliberately un-nonced) URL was re-read $ev_attempt time(s) and never agreed. TWO CAUSES, and only the second is transient: either the site publisher has not deployed $FD_EXPECT_VERSION's installer to this origin at all (that deploy runs on the maintainer's machine off the SitePublished chain, not in CI, so no change in this repository can turn it green), or this runner's Cloudflare POP is still lagging after the whole budget, in which case a rerun lands on a POP that has caught up. Last read: $served_version. Expected: $FD_EXPECT_VERSION."
                exit 1
              fi
              sleep "$FD_EXPECT_VERSION_POLL_SECS"
              ev_attempt=$(( ev_attempt + 1 ))
              # The PLAIN url, byte for byte what the install step will request.
              FD_EFFECTIVE_URL="$(curl -fsSL "${FD_HDR[@]}" "$FRONT_DOOR/install.sh" -o "$tmp/install.sh" -w '%{url_effective}')" \
                || { echo "::error::could not re-read $FRONT_DOOR/install.sh while waiting for this runner's Cloudflare POP to serve $FD_EXPECT_VERSION"; exit 1; }
              # The whole payload is re-validated, exactly as in the rc loop: the
              # re-read copy is the one every later step reads out of $tmp, and a
              # re-read that lands on the soft-404 landing page must be reported
              # as HTML rather than swallowed as one more version mismatch.
              assert_shell_file "$tmp/install.sh" "$FRONT_DOOR/install.sh" || exit 1
              served_version="$(sed -n 's/^LUCIDOS_DEFAULT_VERSION="\([^"]*\)".*/\1/p' "$tmp/install.sh" | head -n 1)"
              if [ -z "$served_version" ]; then
                echo "::error::could not parse LUCIDOS_DEFAULT_VERSION out of the re-read $FRONT_DOOR/install.sh. This check must never silently pass, so it fails closed."
                grep -n '^LUCIDOS_DEFAULT_VERSION=' "$tmp/install.sh" || true
                exit 1
              fi
              echo "    re-read $ev_attempt at $(( $(date +%s) - ev_started ))s: this POP now serves $served_version (want $FD_EXPECT_VERSION)"
            done
            if [ "$ev_attempt" -gt 0 ]; then
              echo "::warning::$FRONT_DOOR needed $ev_attempt plain re-read(s) over $(( $(date +%s) - ev_started ))s before this runner's Cloudflare POP served $FD_EXPECT_VERSION. The origin is fine: this is post-publish POP propagation, which is exactly the window the install step used to fall into unnoticed. Recorded here so the run does not read as a clean first-try pass."
            fi
            echo "    OK  $FRONT_DOOR serves $FD_EXPECT_VERSION to a plain unadorned fetch, which is what the install step will get too"
          fi

          # Exported only NOW, after BOTH convergence loops, and exactly once. A
          # write before them would pin the FIRST read, so every later consumer
          # (the asset preflight, the LUCIDOS_INSTALL_URL parse) would see the
          # stale version a re-read had already replaced.
          echo "FD_SERVED_VERSION=$served_version" >> "$GITHUB_ENV"

          # Which libs, from where — both READ OUT of the installer we just
          # fetched, so this stays correct when the set changes.
          #
          # Names: install.sh declares them in two places — `LUCIDOS_LIBS=` (the
          # download path) and the `_source_libs` call inside source_service_lib
          # (the launch/register path). Scrape *.sh tokens off exactly those
          # lines rather than pinning a list here.
          libs="$(grep -E '^LUCIDOS_LIBS=|_source_libs ' "$tmp/install.sh" \
                  | grep -oE '[A-Za-z0-9_]+\.sh' | sort -u)"
          lib_count="$(printf '%s\n' "$libs" | grep -c . || true)"
          # Fail closed on a broken scrape: a parser that silently finds nothing
          # would make this whole job report green against a dead front door.
          # A floor, not a pinned list — install.sh sources 4 libs today.
          if [ "${lib_count:-0}" -lt 2 ]; then
            echo "::error::parsed only ${lib_count:-0} helper lib name(s) from install.sh — its lib declaration changed shape and this parser needs updating (it must never silently check nothing)"
            grep -nE '^LUCIDOS_LIBS=|_source_libs ' "$tmp/install.sh" || true
            exit 1
          fi

          # Base URL: the same expression _source_libs uses —
          # ${LUCIDOS_INSTALL_URL%/install.sh}/scripts/lib — resolved from the
          # baked LUCIDOS_INSTALL_URL in the copy we were just served. Reading it
          # instead of assuming keeps rung 1 pointed at the URLs a piped install
          # will REALLY hit; hardcoding the origin here could check one place
          # while the installer fetches from another.
          install_url="$(grep -m1 '^LUCIDOS_INSTALL_URL=' "$tmp/install.sh" | sed -e 's/.*:-//' -e 's/}"$//')"
          case "$install_url" in
            http*://*/install.sh) ;;
            *) echo "::error::could not parse LUCIDOS_INSTALL_URL out of the served install.sh (got '$install_url')"; exit 1 ;;
          esac
          lib_base="${install_url%/install.sh}/scripts/lib"

          echo "==> Helper libs the installer will fetch when piped"
          echo "    lib base: $lib_base"
          echo "    libs:     $(echo "$libs" | tr '\n' ' ')"

          # Everything from here on accumulates into ONE verdict instead of
          # exiting at the first problem. A run that reports "the libs are HTML"
          # and stops, when the uninstaller is ALSO missing, costs a second round
          # trip to learn the second half.
          fail=0

          # pin_mismatch <message>: a served script that points its own fetches
          # somewhere other than this origin. The publisher is supposed to
          # rewrite every baked URL to the origin it publishes to; if it did not,
          # the fetch resolves to GitHub (which always has the file) and the rung
          # passes without having tested the front door at all. That hollow pass
          # must never read as coverage.
          #
          # FATAL in payload mode, loud in full mode, and the asymmetry is the
          # point rather than an oversight. In full mode rungs 2-8 still drive a
          # real install AND a real uninstall against this origin, so the run has
          # other teeth and a warning is proportionate. In payload mode rung 1 is
          # the ONLY rung: a pin pointing somewhere else means the job verified
          # nothing about the origin it was asked to gate.
          #
          # One helper for all three pin checks below, so their severity and
          # their wording cannot drift apart.
          pin_mismatch() {
            if [ "$FD_MODE" = "payload" ]; then
              echo "::error::$1, and payload mode has no other rung to fall back on. Refusing to report green on a check that never touched $FRONT_DOOR."
              fail=1
            else
              echo "::warning::$1"
            fi
          }

          # EQUALITY, not a prefix match. `"$FRONT_DOOR"/*` was vacuous the moment
          # a second origin existed under the same apex: with FRONT_DOOR set to
          # https://lucidos.dev, an installer wrongly pinned to the RC copy gives
          # lib_base=https://rc.lucidos.dev/scripts/lib, which prefix-matches and
          # passes silently while rung 1 checks the RC's libs instead of
          # production's. Both real origins produce exactly "<origin>/scripts/lib",
          # so demand exactly that.
          expected_lib_base="$FRONT_DOOR/scripts/lib"
          if [ "$lib_base" != "$expected_lib_base" ]; then
            pin_mismatch "the served install.sh points its helper-lib fetch at $lib_base, NOT $expected_lib_base, so rung 1 is not exercising this origin's script paths"
          fi

          lib_fail=0
          for name in $libs; do
            url="$lib_base/$name"
            if ! curl -fsSL "${FD_HDR[@]}" "$url" -o "$tmp/$name"; then
              echo "::error::could not fetch $url (HTTP error)"
              lib_fail=1
              continue
            fi
            assert_shell_file "$tmp/$name" "$url" || lib_fail=1
          done
          if [ "$lib_fail" -ne 0 ]; then
            echo "::error::at least one helper lib does not resolve to a shell script — 'curl -fsSL $FRONT_DOOR/install.sh | sh' would source that payload as shell and die on a fresh machine"
            fail=1
          fi

          # ── the advertised UNINSTALLER is part of the front door too ──────────
          # Both advertised uninstall paths EXECUTE what this URL serves:
          #
          #   curl -fsSL <origin>/install.sh | sh -s -- --uninstall
          #       install.sh's dispatch_uninstall fetches
          #       ${LUCIDOS_INSTALL_URL%/install.sh}/uninstall.sh and runs
          #       `exec bash -c "$payload"` on it.
          #   curl -fsSL <origin>/uninstall.sh | sh
          #       the same payload, piped straight into a shell.
          #
          # So a soft-404 here is not "the uninstaller is missing", it is "the
          # landing page runs as shell": the exact 2026-07-29 class, on a path
          # that reaches `exec` rather than `source`. Checked in BOTH modes, so
          # an RC is gated on its uninstaller being real shell and not only on
          # its installer.
          #
          # The URL is DERIVED from the served installer the same way the code
          # derives it, so it follows the pin instead of assuming the apex.
          uninstall_url="${install_url%/install.sh}/uninstall.sh"
          echo "==> The advertised uninstaller"
          echo "    $uninstall_url"
          if ! curl -fsSL "${FD_HDR[@]}" "$uninstall_url" -o "$tmp/uninstall.sh"; then
            echo "::error::could not fetch $uninstall_url (HTTP error)"
            fail=1
          elif ! assert_shell_file "$tmp/uninstall.sh" "$uninstall_url"; then
            echo "::error::$uninstall_url does not serve a shell script, so BOTH advertised uninstall paths would RUN that payload: 'curl -fsSL $FRONT_DOOR/install.sh | sh -s -- --uninstall' execs it via dispatch_uninstall, and 'curl -fsSL $uninstall_url | sh' pipes it into a shell directly."
            echo "::error::FIX: the site publisher must publish the /uninstall.sh route beside /install.sh. That deploy runs on the maintainer's machine off the SitePublished trigger chain, NOT in CI, so no change in this repository can turn this green."
            fail=1
          else
            # The served uninstaller must PIN ITSELF at this origin, for exactly
            # the reason the lib base must, and it carries TWO pins:
            #
            #   * LUCIDOS_UNINSTALL_SELF_URL, where a PIPED run re-fetches itself
            #     to get under bash. `curl … | sh` leaves no readable $0 to
            #     re-exec, so on Linux (where /bin/sh is dash) uninstall.sh
            #     re-downloads itself from this URL. Left on the GitHub default,
            #     `curl <origin>/uninstall.sh | sh` silently runs main's
            #     uninstaller and this rung proves nothing about the origin.
            #   * LUCIDOS_INSTALL_URL, what its own scripts/lib/service.sh fetch
            #     derives from. install.sh does NOT export its copy before
            #     `exec bash -c "$payload"`, so even the DELEGATED uninstaller
            #     re-resolves this default: an unpinned copy sources service.sh
            #     from GitHub main although the uninstaller itself came from here.
            #
            # Both parses fail closed. A parser that finds nothing must never be
            # read as "the pin is fine".
            u_self="$(grep -m1 '^LUCIDOS_UNINSTALL_SELF_URL=' "$tmp/uninstall.sh" | sed -e 's/.*:-//' -e 's/}"$//')"
            case "$u_self" in
              http*://*/uninstall.sh) ;;
              *)
                echo "::error::could not parse LUCIDOS_UNINSTALL_SELF_URL out of the served $uninstall_url (got '$u_self'). This check must never silently pass, so it fails closed."
                grep -n '^LUCIDOS_UNINSTALL_SELF_URL=' "$tmp/uninstall.sh" || true
                fail=1
                u_self=""
                ;;
            esac
            if [ -n "$u_self" ] && [ "$u_self" != "$FRONT_DOOR/uninstall.sh" ]; then
              pin_mismatch "the served uninstall.sh re-execs itself from $u_self, NOT $FRONT_DOOR/uninstall.sh, so a piped 'curl -fsSL $uninstall_url | sh' would run THAT copy instead of this origin's"
            fi

            u_install_url="$(grep -m1 '^LUCIDOS_INSTALL_URL=' "$tmp/uninstall.sh" | sed -e 's/.*:-//' -e 's/}"$//')"
            case "$u_install_url" in
              http*://*/install.sh) ;;
              *)
                echo "::error::could not parse LUCIDOS_INSTALL_URL out of the served $uninstall_url (got '$u_install_url'). This check must never silently pass, so it fails closed."
                grep -n '^LUCIDOS_INSTALL_URL=' "$tmp/uninstall.sh" || true
                fail=1
                u_install_url=""
                ;;
            esac
            if [ -n "$u_install_url" ] && [ "${u_install_url%/install.sh}/scripts/lib" != "$expected_lib_base" ]; then
              pin_mismatch "the served uninstall.sh points its service.sh fetch at ${u_install_url%/install.sh}/scripts/lib, NOT $expected_lib_base, so an uninstall run from this origin would source its helper lib from somewhere else"
            fi
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "rung 1 OK: the installer, all $lib_count helper libs at $lib_base, and the uninstaller at $uninstall_url all resolve to shell"

          # Be explicit about where a payload-mode run stops and what that green
          # does NOT mean, so nobody reads it as "the RC installs cleanly".
          if [ "$FD_MODE" = "payload" ]; then
            echo
            echo "PAYLOAD MODE — stopping here, green."
            echo "  verified:     $FRONT_DOOR serves an installer, an uninstaller, and all $lib_count helper libs the installer declares, every one of them as SHELL rather than the landing page (the 2026-07-29 soft-404 class)."
            echo "  NOT verified: that the install completes. It cannot be: an RC installer resolves its tarball to"
            echo "                https://github.com/lucidos-dev/lucidos/releases/download/v<version>/… and that tag does not"
            echo "                exist during an RC (Phase A publishes only an rc-<version> prerelease, DMG + .sig, no tarballs)."
            echo "                Wiring the install here would 404 every single run. The full ladder runs against the real"
            echo "                origin post-publish (dispatch) and daily (cron)."
          fi

      # ── the release assets must EXIST before the install starts ───────────────
      # FULL MODE ONLY, and ordered BEFORE the launch step deliberately.
      #
      # WHY: on 2026-07-31 all three v0.18.0 front-door legs died the same way.
      # The post-publish dispatch fired at 05:58, install.sh printed its own
      # "Download failed:" for the headless tarball, and each leg then burned the
      # entire 900 s gateway poll waiting for a gateway that could never come up
      # before reporting "the gateway never reported healthy within 900s". The
      # release was fine: release-tarballs.yml did not finish attaching the
      # per-triple assets until 06:21, 23 minutes later. Three separate faults in
      # one shape, and this step fixes the first two: the job did not wait for an
      # artifact it knows it needs, and it spent 15 minutes per leg finding out.
      # (The third, the misattribution to health, is the poll's own guard below.)
      #
      # It is a WAIT, not a retry of the install: a download that fails after
      # this step went green is a real failure and stays one.
      - name: Wait for the release assets this install will download
        if: env.FD_MODE == 'full'
        shell: bash
        run: |
          set -uo pipefail
          payloads="$RUNNER_TEMP/front-door-payloads"

          # ── the triple, resolved with install.sh's own uname map ──────────────
          # stage_runtime_theseus_os / stage_runtime_arch, reproduced rather than
          # sourced (this job has no checkout by design). Unknown values fail
          # closed: install.sh would refuse the platform too, and a preflight
          # that guessed a triple would wait out its budget on a URL no installer
          # ever requests.
          case "$(uname -s)" in
            Linux)  fd_os='unknown-linux-gnu' ;;
            Darwin) fd_os='apple-darwin' ;;
            *) echo "::error::unsupported OS '$(uname -s)': install.sh maps only Darwin and Linux to a target triple, so there is no asset URL to probe."; exit 1 ;;
          esac
          case "$(uname -m)" in
            arm64|aarch64) fd_arch='aarch64' ;;
            x86_64|amd64)  fd_arch='x86_64' ;;
            *) echo "::error::unsupported arch '$(uname -m)': install.sh maps only arm64/aarch64 and x86_64/amd64, so there is no asset URL to probe."; exit 1 ;;
          esac
          triple="$fd_arch-$fd_os"

          # ── the version, from the SERVED installer ────────────────────────────
          # Exported by rung 1 out of the baked LUCIDOS_DEFAULT_VERSION, which is
          # what a piped run resolves (no checkout means no adjacent RELEASE).
          version="${FD_SERVED_VERSION:-}"
          if [ -z "$version" ]; then
            echo "::error::FD_SERVED_VERSION is empty. Rung 1 parses the served installer's baked version and exports it; without it this step would have to guess which release to probe, so it fails closed instead."
            exit 1
          fi

          # ── the base URL, DERIVED from the served install_common.sh ───────────
          # Not hardcoded here. install.sh resolves its download base through
          # install_default_base_url in that lib, and rung 1 already fetched the
          # copy THIS origin serves, so deriving from it keeps the preflight and
          # the install pointed at the same place even if the base moves. The
          # shape is validated: anything that is not a single '%s' at the end of
          # an https:// string fails closed rather than being substituted blind.
          lib="$payloads/install_common.sh"
          if [ ! -s "$lib" ]; then
            echo "::error::rung 1 left no served install_common.sh at $lib, so the download URL cannot be derived from what this origin serves. Fail closed rather than assume the GitHub default."
            exit 1
          fi
          base_fmt="$(sed -n '/^install_default_base_url()/,/^}/p' "$lib" \
                      | sed -n "s/.*printf '\([^']*\)'.*/\1/p" | head -n 1)"
          case "$base_fmt" in
            https://*%s) ;;
            *)
              echo "::error::could not derive the release base URL from the served install_common.sh: install_default_base_url prints '$base_fmt', which is not the expected 'https://...%s' shape. Update this step to match the lib rather than probing a URL install.sh would never request."
              exit 1
              ;;
          esac
          base_prefix="${base_fmt%'%s'}"
          case "$base_prefix" in
            *%*)
              echo "::error::the served install_default_base_url format '$base_fmt' carries more than one printf directive, and this preflight only knows how to substitute the version. Fail closed."
              exit 1
              ;;
          esac
          base_url="$base_prefix$version"

          # ── the artifact stem, drift-guarded against the served lib ───────────
          # headless_tarball_stem takes its two arguments positionally, so its
          # format string cannot be substituted safely from the outside; the
          # shape is pinned instead, and a change to it reds HERE with the fix
          # named rather than silently probing the wrong asset.
          stem_lib="$payloads/headless_tarball.sh"
          if [ ! -s "$stem_lib" ]; then
            echo "::error::rung 1 left no served headless_tarball.sh at $stem_lib, so the artifact name cannot be checked against what this origin serves. Fail closed."
            exit 1
          fi
          stem_fmt="$(sed -n '/^headless_tarball_stem()/,/^}/p' "$stem_lib" \
                      | sed -n "s/.*printf '\([^']*\)'.*/\1/p" | head -n 1)"
          if [ "$stem_fmt" != 'lucidos-%s-%s' ]; then
            echo "::error::the served headless_tarball_stem builds '$stem_fmt', not the 'lucidos-%s-%s' this preflight constructs. The artifact name changed shape, so update this step to match it."
            exit 1
          fi
          stem="lucidos-$version-$triple"

          tarball_url="$base_url/$stem.tar.gz"
          checksum_url="$tarball_url.sha256"
          echo "==> The install will download, and both must exist first:"
          echo "    $tarball_url"
          echo "    $checksum_url"
          echo "    (the .sha256 too: install.sh's checksum step is mandatory and fails closed)"

          # A RANGE request for one byte, not a download: enough to prove the
          # asset resolves, and GitHub answers 206 to it. Deliberately NOT
          # `curl -f`, because the status code is the thing being read.
          fd_code=''
          probe() {
            fd_code="$(curl -sS -L -r 0-0 -o /dev/null -w '%{http_code}' --max-time 30 "$1" 2>/dev/null || echo 000)"
            case "$fd_code" in 200|206) return 0 ;; *) return 1 ;; esac
          }

          deadline=$(( $(date +%s) + FD_ASSET_WAIT_SECS ))
          attempt=0
          tar_code='000'
          sha_code='000'
          while : ; do
            attempt=$(( attempt + 1 ))
            if probe "$tarball_url"; then
              tar_code="$fd_code"
              if probe "$checksum_url"; then
                sha_code="$fd_code"
                echo "preflight OK on attempt $attempt: the tarball answered $tar_code and its .sha256 answered $sha_code."
                break
              fi
              sha_code="$fd_code"
            else
              tar_code="$fd_code"
              sha_code='not probed'
            fi
            now="$(date +%s)"
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::the release assets this install needs are MISSING after ${FD_ASSET_WAIT_SECS}s: $tarball_url answered $tar_code and $checksum_url answered $sha_code. This is an ASSET AVAILABILITY failure. It is not a broken front door and not a gateway health failure, and the install is deliberately NOT being started: it would 404 at the download step and then burn the ${GW_HEALTH_TIMEOUT_SECS}s gateway poll before reporting the wrong cause. DO NOT read this as 'the tarballs are still attaching, wait longer'. Since 2026-08-04 a release is created as a DRAFT and published only once release-tarballs.yml has attached all four per-platform tarballs, so a PUBLISHED v$version missing one is a real fault rather than a race: either it was published deliberately incomplete (release.sh --allow-missing-tarballs), or the asset was removed afterwards, or this POP is serving an install.sh for a release that was never published. Look at the v$version release page for $stem.tar.gz + .sha256, then at the release-tarballs run that was supposed to attach them."
              exit 1
            fi
            echo "    attempt $attempt: tarball $tar_code, sidecar $sha_code; $(( deadline - now ))s of the ${FD_ASSET_WAIT_SECS}s budget left, retrying in ${FD_ASSET_POLL_SECS}s"
            sleep "$FD_ASSET_POLL_SECS"
          done

      # ── rungs 2-4: FULL MODE ONLY ─────────────────────────────────────────────
      # Everything below drives a REAL install, which downloads the headless
      # tarball from the v<version> release. That tag does not exist during an RC,
      # so these steps are gated OFF in payload mode — see the long note on the
      # job. Removing the guard makes the rc/** gate permanently red; it does not
      # make it stronger.
      #
      # The advertised command, verbatim. With no service manager in a container
      # install.sh degrades to a FOREGROUND launch (by design) and never returns,
      # so background it and poll — same shape as the smoke job.
      - name: Run the advertised command (background — the gateway holds the foreground)
        if: env.FD_MODE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          # The origin is passed as an ARGUMENT, not spliced into the `sh -c`
          # string: it can originate in a dispatch input, and a string-interpolated
          # value would be parsed as shell by the very command we are constructing.
          # The validation step already rejects anything that is not plainly a URL;
          # this is the second lock on the same door.
          echo "==> curl -fsSL $FRONT_DOOR/install.sh | sh"
          # The single quotes are load-bearing: "$0" must reach the inner shell
          # UNEXPANDED so it resolves to the argument below, which is the whole
          # point of not interpolating the origin.
          # shellcheck disable=SC2016
          nohup sh -c 'curl -fsSL "$0/install.sh" | sh' "$FRONT_DOOR" \
            > "$RUNNER_TEMP/install.log" 2>&1 &
          echo "INSTALL_PID=$!" >> "$GITHUB_ENV"
          echo "Installer started (pid $!). Log: $RUNNER_TEMP/install.log"

      - name: Verify the front door installed a working Lucidos
        if: env.FD_MODE == 'full'
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/install.log"
          dump() { echo "--- installer log (tail 200) ---"; tail -n 200 "$log" 2>/dev/null || true; }

          # ── rung 2: the installer must never source a NON-SHELL payload ───────
          # The 2026-07-29 failure surfaces exactly here — '<!DOCTYPE html>' echoed
          # by the shell plus a syntax error from the sourced lib. Terminal the
          # moment it appears; there is nothing to wait for after it.
          #
          # The pattern is the SHELL-PARSE signature, not a bare 'syntax error':
          # this log also carries the gateway's entire foreground stdout (it execs
          # into this same fd), so a plain substring would red a perfectly healthy
          # install the first time embedded Postgres logs "syntax error at or
          # near". Both shells that can parse the payload are covered — bash says
          # "syntax error near unexpected token", dash says "Syntax error: <what>
          # unexpected" — and neither matches Postgres's wording.
          HTML_PAYLOAD_RE='DOCTYPE|syntax error near|syntax error:'
          assert_no_html_payload() {
            grep -qiE "$HTML_PAYLOAD_RE" "$log" 2>/dev/null || return 0
            echo "::error::the installer sourced a NON-SHELL payload — the origin answered a script path with HTML (soft 404)"
            grep -inE "$HTML_PAYLOAD_RE" "$log" | head -n 10 | sed 's/^/      /'
            dump
            exit 1
          }

          # ── the residual download failure, named as itself ────────────────────
          # The preflight step proved these assets existed before the install
          # started, so reaching this is a DIFFERENT failure: the asset went
          # away, github.com was blocked, or the mandatory sidecar could not be
          # fetched. None of those are the gateway's fault, and until 2026-07-31
          # every one of them was reported as one. The v0.18.0 legs printed
          # install.sh's own "Download failed:" and then burned the whole health
          # budget before concluding "the gateway never reported healthy within
          # 900s", which names the wrong subsystem and hides the real cause.
          # Terminal on sight instead, with the right name.
          #
          # BOTH of install.sh's asset-fetch aborts are matched: the tarball
          # (download_failed) and the mandatory .sha256 sidecar, which dies with
          # its own wording. NOT the checksum MISMATCH, which means a corrupt or
          # tampered download and is a different verdict.
          #
          # AND ONE OF THESE IS NOT A DOWNLOAD FAILURE AT ALL. If the URL the
          # installer died on names a DIFFERENT version than the one rung 1
          # verified, the two independent fetches of install.sh landed on two
          # different releases: rung 1 read one, the install step re-fetched and
          # got the other, and the preflight in between certified assets nobody
          # then downloaded. That is the front-door version-drift race, with its
          # own cause (a Cloudflare POP flipping mid run) and its own fix (rung
          # 1's expect_version convergence, which is what prevents it). Reporting
          # it as a flat download failure is what sent the 2026-08-03 v0.20.1
          # macOS legs to release-tarballs.yml over an asset the run had never
          # verified, so name the real cause instead. The version comes out of
          # the failing URL itself, and a URL it cannot be parsed from simply
          # falls through to the plain verdict below: this branch is here to
          # rename a failure, never to invent one.
          DOWNLOAD_FAIL_RE='Download failed:|could NOT fetch its checksum sidecar'
          assert_no_download_failure() {
            grep -qE "$DOWNLOAD_FAIL_RE" "$log" 2>/dev/null || return 0
            # `-A 1` because the two aborts print their URL differently: the
            # tarball one puts it on the same line as "Download failed:", the
            # sidecar one on the line below its own wording.
            local failed_version
            failed_version="$(grep -A 1 -E "$DOWNLOAD_FAIL_RE" "$log" 2>/dev/null \
                              | sed -n 's#.*/releases/download/v\([^/[:space:]]*\)/.*#\1#p' | head -n 1)"
            if [ -n "$failed_version" ] && [ -n "${FD_SERVED_VERSION:-}" ] \
               && [ "$failed_version" != "$FD_SERVED_VERSION" ]; then
              echo "::error::FRONT-DOOR VERSION DRIFT, not a plain download failure. Rung 1 read $FD_SERVED_VERSION from $FRONT_DOOR/install.sh and the asset preflight verified THAT release's tarball, but the install step re-fetched the same URL and resolved $failed_version. The two fetches landed on different releases, so the preflight's guarantee never covered what was actually downloaded. This is the post-publish Cloudflare POP race: dispatch this workflow with expect_version set to the release being verified, and rung 1 waits for this runner's POP to serve it before the preflight or the install run."
              grep -nE "$DOWNLOAD_FAIL_RE" "$log" | head -n 5 | sed 's/^/      /'
              dump
              exit 1
            fi
            echo "::error::the installer could not fetch the release asset, AFTER the preflight found it published. This is a DOWNLOAD failure, not a gateway health failure: the gateway was never going to start."
            grep -nE "$DOWNLOAD_FAIL_RE" "$log" | head -n 5 | sed 's/^/      /'
            dump
            exit 1
          }

          # ── rung 3: the gateway answers /health (polled) ──────────────────────
          # The gateway lives in the sigil namespace: a bare /api/v1/health would
          # resolve as a workspace slug and 404. The port comes from the launch
          # banner — install.sh auto-picks the first free port from its default
          # upward, so read what it chose instead of assuming.
          echo "Polling the gateway (timeout ${GW_HEALTH_TIMEOUT_SECS}s)…"
          deadline=$(( $(date +%s) + GW_HEALTH_TIMEOUT_SECS ))
          port="$GW_DEFAULT_PORT"
          body=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            assert_no_html_payload
            assert_no_download_failure
            banner_port="$(sed -n 's|.*http://localhost:\([0-9][0-9]*\)/.*|\1|p' "$log" 2>/dev/null | head -n 1)"
            [ -n "$banner_port" ] && port="$banner_port"
            body="$(curl -fsS --max-time 5 "http://localhost:$port/~/api/v1/health" 2>/dev/null || true)"
            echo "$body" | grep -q '"status":"ok"' && break
            # Unquoted-default deliberately absent: `kill -0 0` targets the whole
            # process group and ALWAYS succeeds, so a `${INSTALL_PID:-0}` fallback
            # would silently disable this fast-fail. `set -u` is the right failure
            # here — the launch step always exports it or the job never got here.
            if ! kill -0 "$INSTALL_PID" 2>/dev/null; then
              echo "::error::the installer exited before the gateway became healthy"
              assert_no_html_payload      # names the cause when it is the HTML one
              assert_no_download_failure  # or the download one
              dump
              exit 1
            fi
            sleep 5
          done
          assert_no_html_payload
          assert_no_download_failure
          echo "$body" | grep -q '"status":"ok"' \
            || { echo "::error::the gateway never reported healthy within ${GW_HEALTH_TIMEOUT_SECS}s"; dump; exit 1; }
          echo "$body" | grep -q '"role":"gateway"' \
            || { echo "::error::/~/api/v1/health did not answer as the gateway: $body"; dump; exit 1; }
          echo "rung 2 + 3 OK — installed cleanly, gateway healthy on port $port: $body"

          # ── rung 4: the frontend is served ────────────────────────────────────
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://localhost:$port/" || echo 000)"
          [ "$code" = "200" ] \
            || { echo "::error::frontend http://localhost:$port/ returned HTTP $code"; dump; exit 1; }
          echo "rung 4 OK — frontend serves 200 at http://localhost:$port/"

          echo "OK — 'curl -fsSL $FRONT_DOOR/install.sh | sh' works on a fresh ubuntu:22.04 box."

      # ── rungs 5-8: the advertised UNINSTALL paths (FULL MODE ONLY) ────────────
      # Uninstall is half of the advertised experience and was tested nowhere
      # until 2026-07-30. These rungs ASSERT, and they can red the job. They are
      # not a teardown: the teardown steps below still exist, and are cleanup.
      #
      # Four rungs, alternating the two advertised entry points so each is
      # exercised for both a listing and a mutation:
      #
      #   5  curl … /install.sh   | sh -s -- --list              delegation, read-only
      #   6  curl … /uninstall.sh | sh -s -- --list              direct pipe, read-only
      #   7  curl … /install.sh   | sh -s -- --uninstall --all    data-safe removal
      #   8  curl … /uninstall.sh | sh -s -- --all --purge        purge
      #
      # ORDER MATTERS AND SAVES A REINSTALL. A data-safe rung 7 keeps the data
      # dir AND its port marker, so rung 8 still has a target to purge. Running
      # the read-only rungs first also means they observe the installed state.
      #
      # WHAT THIS CONTAINER CANNOT COVER, so it is not asserted: there is no
      # launchd and no systemd here, so install.sh registered no service, and
      # uninstall.sh's remove_instance stops the embedded runtime only when it
      # actually unregistered one. The gateway this job launched in the
      # foreground therefore keeps running across the uninstall, by design. The
      # macOS job covers the service half, where launchd exists.
      - name: Verify the front door can uninstall what it installed
        if: env.FD_MODE == 'full'
        shell: bash
        run: |
          set -uo pipefail

          # install.sh's defaults: this job passes no --prefix and no --name, so
          # the slug is `default` and everything hangs off $HOME/.lucidos. Derived
          # exactly as service_instance_data_dir / service_runtime_root do, and as
          # uninstall.sh's own --all --purge shared-runtime branch does.
          prefix="$HOME/.lucidos"
          slug="default"
          data="$prefix/$slug"
          runtime="$prefix/runtime"
          marker="$data/port"

          fail=0
          # The SHELL-PARSE signature, same pattern rung 2 uses: an HTML payload
          # fed to a shell says DOCTYPE plus a bash/dash syntax error, and neither
          # wording collides with Postgres's "syntax error at or near".
          HTML_PAYLOAD_RE='DOCTYPE|syntax error near|syntax error:'

          # marker_diagnosis: the ONE root cause that makes an instance invisible
          # to --list and unremovable by --all --purge, named explicitly because
          # from the outside it looks exactly like an origin regression.
          # service_list_instance_names lists only <prefix>/<slug>/ dirs carrying
          # a `port` marker. Until 2026-07-30 install.sh wrote that marker solely
          # in register_service, so the FOREGROUND launch this container forces
          # (no service manager) left none: --list said "(none)", resolve_targets
          # found no targets, and run_uninstall returned before purging anything.
          # The fix is record_instance_port, called from BOTH launch shapes.
          marker_diagnosis() {
            if [ -f "$marker" ]; then
              echo "    (the port marker $marker exists, so this is NOT the known marker gap)"
              return 0
            fi
            echo "::error::ROOT CAUSE: the port marker $marker does not exist. service_list_instance_names keys on it, so this instance is invisible to --list, resolve_targets resolves no targets, and run_uninstall returns before purging. install.sh must record it on BOTH launch shapes (record_instance_port, called from register_service AND launch_runtime); this container has no launchd or systemd, so it always takes the foreground shape. That is an INSTALLER defect, not an origin regression."
          }

          # assert_uninstaller_ran <label> <log> <status>: the floor every
          # uninstall rung shares. `curl -f` cannot see a soft-404, so check the
          # OUTPUT rather than the status alone: uninstall.sh's own banner must be
          # present, no HTML or shell-parse cascade may be, and the command must
          # exit 0.
          assert_uninstaller_ran() {
            local label="$1" log="$2" st="$3" bad=0
            if grep -qiE "$HTML_PAYLOAD_RE" "$log" 2>/dev/null; then
              echo "::error::$label executed a NON-SHELL payload: the origin answered a script path with HTML at status 200 (soft 404) and the shell tried to run it."
              grep -inE "$HTML_PAYLOAD_RE" "$log" | head -n 5 | sed 's/^/      /'
              bad=1
            fi
            if ! grep -q 'Lucidos uninstaller' "$log" 2>/dev/null; then
              echo "::error::$label never reached uninstall.sh: its 'Lucidos uninstaller' banner is absent from the output, so nothing about the advertised uninstall path was exercised."
              bad=1
            fi
            if [ "$st" != "0" ]; then
              echo "::error::$label exited $st"
              bad=1
            fi
            if [ "$bad" -ne 0 ]; then
              echo "--- $label output (tail 40) ---"
              tail -n 40 "$log" 2>/dev/null || true
              return 1
            fi
            return 0
          }

          # assert_listed <label> <log>: do_list prints "<slug>  port <n>  <status>"
          # per instance, or "(none)" when it finds nothing.
          assert_listed() {
            local label="$1" log="$2"
            if grep -qE "(^|[[:space:]])${slug}[[:space:]]+port[[:space:]]+[0-9]+" "$log"; then
              echo "    OK  $label lists instance '$slug'"
              return 0
            fi
            echo "::error::$label ran the uninstaller but did not list the instance this job just installed ('$slug' under $prefix)."
            marker_diagnosis
            echo "--- $label output (tail 20) ---"
            tail -n 20 "$log" 2>/dev/null || true
            return 1
          }

          # Every command below passes the origin as an ARGUMENT rather than
          # splicing it into the `sh -c` string: it can originate in a dispatch
          # input, and a string-interpolated value would be parsed as shell by the
          # very command being constructed. The single quotes are load-bearing so
          # "$0" reaches the inner shell unexpanded. Same shape as the launch step.

          # ── rung 5: --list through the DELEGATION front door ──────────────────
          # install.sh --list is a thin front door for uninstall.sh: with no
          # checkout, dispatch_uninstall fetches
          # ${LUCIDOS_INSTALL_URL%/install.sh}/uninstall.sh and execs the payload.
          log5="$RUNNER_TEMP/uninstall-rung5.log"
          echo "==> rung 5: curl -fsSL $FRONT_DOOR/install.sh | sh -s -- --list"
          # shellcheck disable=SC2016
          sh -c 'curl -fsSL "$0/install.sh" | sh -s -- --list' "$FRONT_DOOR" > "$log5" 2>&1
          st5=$?
          if assert_uninstaller_ran "rung 5 (install.sh --list)" "$log5" "$st5"; then
            # dispatch_uninstall prints the URL it fetched, so the delegation
            # following the pin is directly observable rather than inferred.
            if grep -qF "$FRONT_DOOR/uninstall.sh" "$log5"; then
              echo "    OK  the delegation fetched $FRONT_DOOR/uninstall.sh"
            else
              echo "::error::rung 5: install.sh did not fetch the uninstaller from $FRONT_DOOR. Its baked LUCIDOS_INSTALL_URL points somewhere else, so a user's --uninstall would run another origin's uninstaller."
              grep -i 'uninstall' "$log5" | head -n 5 | sed 's/^/      /'
              fail=1
            fi
            assert_listed "rung 5 (install.sh --list)" "$log5" || fail=1
          else
            fail=1
          fi

          # ── rung 6: --list through the DIRECT piped uninstaller ───────────────
          # On Linux /bin/sh is dash, so this also exercises uninstall.sh's own
          # re-exec guard: with no readable $0 it re-downloads itself from
          # LUCIDOS_UNINSTALL_SELF_URL to get under bash.
          log6="$RUNNER_TEMP/uninstall-rung6.log"
          echo "==> rung 6: curl -fsSL $FRONT_DOOR/uninstall.sh | sh -s -- --list"
          # shellcheck disable=SC2016
          sh -c 'curl -fsSL "$0/uninstall.sh" | sh -s -- --list' "$FRONT_DOOR" > "$log6" 2>&1
          st6=$?
          if assert_uninstaller_ran "rung 6 (uninstall.sh --list)" "$log6" "$st6"; then
            assert_listed "rung 6 (uninstall.sh --list)" "$log6" || fail=1
          else
            fail=1
          fi

          # ── rung 7: DATA-SAFE removal (no --purge) ────────────────────────────
          # The promise under test is uninstall.sh --help's: it "leaves your data
          # on disk". A data-safe run that deletes anything is data loss, so that
          # is the assertion here.
          log7="$RUNNER_TEMP/uninstall-rung7.log"
          echo "==> rung 7: curl -fsSL $FRONT_DOOR/install.sh | sh -s -- --uninstall --all   (no --purge)"
          # shellcheck disable=SC2016
          sh -c 'curl -fsSL "$0/install.sh" | sh -s -- --uninstall --all' "$FRONT_DOOR" > "$log7" 2>&1
          st7=$?
          if assert_uninstaller_ran "rung 7 (install.sh --uninstall --all)" "$log7" "$st7"; then
            if [ -d "$data" ]; then
              echo "    OK  rung 7 kept the instance data at $data"
            else
              echo "::error::rung 7: a data-safe uninstall (no --purge) DELETED $data. uninstall.sh --help promises it leaves your data on disk, so purging without --purge is data loss."
              fail=1
            fi
            echo "    n/a rung 7: no service manager in this container, so there is no launchd/systemd artifact to assert removed, and remove_instance does not stop a foreground gateway (removed=0). The macOS job covers that half."
          else
            fail=1
          fi

          # ── rung 8: --all --purge ─────────────────────────────────────────────
          # The instance data dir AND the shared runtime must actually be gone.
          # The runtime is the multi-hundred-megabyte half, and it is deleted only
          # by the --all --purge branch, so nothing else in this file covers it.
          #
          # THE GATEWAY IS STILL RUNNING while this purge happens, and that is
          # faithful rather than sloppy: with no service manager the uninstall
          # cannot stop it (see rung 7), so a real user on such a host purges
          # from a second terminal exactly like this. Unlinking open files is
          # fine on Linux. The one way it could mislead is a supervised engine
          # re-creating a directory under $data in the moment after the rm, so
          # the failure path below also reports whether the uninstaller SAID it
          # deleted the path. Claimed-and-present means recreated; not-claimed
          # means the purge genuinely did not run. Diagnosis only: neither
          # weakens the assertion, because the promise is that the path is gone.
          log8="$RUNNER_TEMP/uninstall-rung8.log"
          echo "==> rung 8: curl -fsSL $FRONT_DOOR/uninstall.sh | sh -s -- --all --purge"
          # shellcheck disable=SC2016
          sh -c 'curl -fsSL "$0/uninstall.sh" | sh -s -- --all --purge' "$FRONT_DOOR" > "$log8" 2>&1
          st8=$?
          if assert_uninstaller_ran "rung 8 (uninstall.sh --all --purge)" "$log8" "$st8"; then
            # claimed <path>: did the uninstaller report deleting this path? Match
            # a line carrying BOTH the path and "Deleted", not the literal string
            # "Deleted <path>". The two purge messages are worded differently
            # ("Deleted <data>" for an instance, "Deleted the shared runtime
            # <runtime>"), so a literal prefix match would answer "never reported"
            # for the runtime every time, which is exactly the wrong diagnosis.
            claimed() { grep -F -- "$1" "$log8" 2>/dev/null | grep -q 'Deleted' && echo "the uninstaller DID report deleting it, so something re-created it" || echo "the uninstaller never reported deleting it"; }
            left=0
            if [ -e "$data" ]; then
              echo "::error::rung 8: --all --purge left the instance data behind at $data ($(claimed "$data"))"
              left=1
            fi
            if [ -e "$runtime" ]; then
              echo "::error::rung 8: --all --purge left the shared runtime behind at $runtime ($(claimed "$runtime"))"
              left=1
            fi
            if [ "$left" -ne 0 ]; then
              marker_diagnosis
              echo "--- rung 8 output (tail 40) ---"
              tail -n 40 "$log8" 2>/dev/null || true
              fail=1
            else
              echo "    OK  rung 8 removed both $data and $runtime"
            fi
          else
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::the advertised uninstall paths do not work against $FRONT_DOOR (see the per-rung errors above)"
            exit 1
          fi
          echo "rungs 5-8 OK: --list through both front doors, a data-safe removal that kept $data, and --all --purge that removed the data and the shared runtime."

      # The cause is always in this log; make it readable in the Actions output
      # rather than only in an artifact (this job has no checkout and uploads none).
      # Full mode only: payload mode never launches an installer, so there is no
      # log — and an unconditional dump would answer a rung-1 failure with a
      # misleading "(no installer log — it never started)".
      - name: Dump the installer log
        if: failure() && env.FD_MODE == 'full'
        shell: bash
        run: |
          echo "=== full installer log ==="
          cat "$RUNNER_TEMP/install.log" 2>/dev/null || echo "(no installer log — it never started)"

      # `if: always()` means this also runs when an EARLIER rung failed and the
      # installer never launched. Guard on a non-empty pid: a bare `kill 0`
      # (which `${INSTALL_PID:-0}` would expand to) signals this shell's entire
      # process group, killing the teardown step itself and burying the real
      # failure under a spurious one.
      - name: Stop the gateway
        if: always()
        shell: bash
        run: |
          if [ -n "${INSTALL_PID:-}" ]; then
            kill "$INSTALL_PID" 2>/dev/null || true
          fi

  # ── FRONT DOOR — macOS (the SAME live origin, on a real Mac) ─────────────────
  # WHY THIS IS A SEPARATE JOB, AND WHY IT IS NOT "the smoke job's macOS leg
  # sneaking back in". Read this before consolidating it away.
  #
  # The landing page shows "Download for Mac" (an Apple-Silicon DMG) directly
  # above `curl -fsSL https://lucidos.dev/install.sh | sh`, and it now routes
  # INTEL Mac users to the one-liner explicitly — the DMG is aarch64-only, so the
  # shell installer is the ONLY advertised path for an Intel Mac. Yet until this
  # job, install.sh's macOS path was gated by nothing at all: `dmg-verify` covers
  # the DMG (a different artifact), `smoke` is ubuntu-only by design, and
  # `tarball-smoke` + `front-door` are both Linux. The advertised one-liner had
  # never been run on a Mac in CI.
  #
  # THE DISTINCTION FROM `smoke`'s macOS EXCLUSION — this is the part that gets
  # pattern-matched away by someone reading only the matrix comment up top.
  # `smoke` skips macOS because it installs FROM SOURCE (--dev), which needs a
  # Docker daemon for Postgres, which on a hosted macOS runner needs Colima,
  # which needs nested hardware virtualization that a runner (itself a VM) does
  # not expose. NONE of that applies here, because this job tests the DOWNLOAD
  # path: it curls a prebuilt tarball carrying its own relocatable PostgreSQL and
  # runs it. No Docker, no Colima, no nested virtualization, no toolchain, no
  # compile. That is exactly why it CAN run on a hosted macOS runner where the
  # source install cannot. The two exclusions are not the same exclusion, and
  # deleting this job because "macOS can't run install.sh in CI" would remove the
  # only coverage the advertised Mac install has.
  #
  # Everything else is the `front-door` job's: the eight rungs, the two modes,
  # the hostile-origin validation, the RC payload-only rule, the Cloudflare
  # Access service token. The long block above THAT job is the canonical
  # explanation of all of it and is not repeated here; only what genuinely
  # DIFFERS on macOS is commented again below.
  #
  # THE ONE REAL DIFFERENCE — THE LAUNCH SHAPE (see the launch + verify steps):
  # in the Linux job install.sh runs in a container with no service manager, so
  # it degrades to a FOREGROUND launch that never returns, and "the installer
  # exited" is therefore always a failure there. On a macOS runner `launchctl`
  # exists, so install.sh registers a launchd job and EXITS 0 with the gateway
  # still running detached. Both shapes are accepted here; only a missed health
  # deadline fails.
  front-door-macos:
    name: front-door (${{ github.event_name == 'push' && 'rc, payload only' || 'live origin' }}, ${{ matrix.runner }})
    # Identical guards to `front-door` — public mirror only (see the smoke job's
    # repo guard), dispatch + the DAILY cron + the rc/** push, never the release
    # events and never the weekly cron. Kept spelled out rather than factored
    # into a `needs:` on front-door: this job must report independently of the
    # Linux one, and a shared gate would make a Linux-only outage hide the Mac
    # result (and vice versa).
    if: >-
      github.repository == 'lucidos-dev/lucidos'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push'
              && startsWith(github.ref, 'refs/heads/rc/'))
          || (github.event_name == 'schedule'
              && github.event.schedule == '0 6 * * *'))
      && inputs.dmg_tag == ''
    strategy:
      # Both legs test the SAME origin and differ only in the host architecture,
      # which is the whole point: install.sh resolves a DIFFERENT tarball per
      # triple, so a green Apple-Silicon leg says nothing about the Intel one.
      # fail-fast: false because each leg is an independent verdict about an
      # independently-published artifact — cancelling the survivor would throw
      # away the answer we came for.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon. Resolves aarch64-apple-darwin — the same machines the
          # DMG targets, taking the other advertised route onto them.
          #
          # `macos-latest`, NOT the `macos-15` that release-tarballs.yml pins
          # for this same triple, and the difference is intentional both ways.
          # That job pins because it BUILDS: the theseus-rs relocatable PG 18
          # arm64 binary references a newer libSystem than macos-14 has, so
          # staging aborts on an older image. This job only RUNS a prebuilt
          # tarball, so a newer OS is never the hazard — and a front-door test
          # should follow where users actually are, which is the current macOS.
          # Do not "reconcile" the two: pinning here would freeze the test on a
          # retiring image, and loosening release-tarballs.yml would bring the
          # staging break back.
          - { runner: macos-latest,   triple: aarch64-apple-darwin }
          # Intel. Resolves x86_64-apple-darwin — the exact path the landing page
          # now sends Intel Mac users down, since the DMG cannot serve them.
          #
          # KNOWN END DATE, not a surprise: per GitHub's runner deprecation
          # notice `macos-15-intel` is the LAST Intel macOS image, planned to
          # retire together with macos-15 in Fall 2027. When it goes, this leg
          # goes with it — and so does CI coverage for Intel Macs, which is the
          # decision to make consciously at that point (drop Intel from the
          # landing page's one-liner routing, or self-host). Do not silently swap
          # the label for another macos-* image: that would leave two legs
          # testing the same triple while claiming to test two.
          - { runner: macos-15-intel, triple: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    # Same arithmetic as `front-door`, asserted by front_door_gate_test.sh:
    # FD_EXPECT_VERSION_WAIT_SECS + FD_ASSET_WAIT_SECS + GW_HEALTH_TIMEOUT_SECS
    # + 900 s of slack must fit. Back to 75 now that the asset backstop is 300 s
    # rather than the hour the old attach window needed.
    timeout-minutes: 75
    # Same reasoning as `front-door`: this job pipes remote code into a shell by
    # design, so it gets a token with no scopes at all.
    permissions: {}
    env:
      # ── identical to `front-door` (see that job for the full reasoning) ──────
      FD_MODE: ${{ (github.event_name == 'push' && 'payload') || inputs.mode || 'full' }}
      FRONT_DOOR_INPUT: ${{ (github.event_name == 'push' && 'https://rc.lucidos.dev') || inputs.origin || 'https://lucidos.dev' }}
      # The release this run was dispatched to verify, or empty on the cron and
      # the rc/** push. Identical to `front-door`; the canonical note is on the
      # input itself, and this job is where the drift it closes actually bit.
      FD_EXPECT_VERSION: ${{ inputs.expect_version || '' }}
      RC_ACCESS_CLIENT_ID: ${{ secrets.RC_ACCESS_CLIENT_ID }}
      RC_ACCESS_CLIENT_SECRET: ${{ secrets.RC_ACCESS_CLIENT_SECRET }}
      GW_DEFAULT_PORT: '5252'          # install.sh's default; it auto-picks upward if taken
      GW_HEALTH_TIMEOUT_SECS: '900'    # download + extract + embedded-PG first boot
      # The asset backstop, identical to `front-door` (see that job for why it
      # stopped being a wait for a build at all, and for the budget's history).
      # This job is where the old wait actually bit: the Intel leg downloads
      # x86_64-apple-darwin, consistently the last of the four tarballs to be
      # attached, so every expiry so far has been here while macos-latest went
      # green in seconds off the same origin. Under the new ordering neither leg
      # waits for that build, because the release is not public until it is
      # finished. A missing asset still costs more here than on Linux (this job
      # has no installer-exited fast-fail), which is a reason to fail FAST, not
      # a reason to wait longer.
      FD_ASSET_WAIT_SECS: '300'        # 5 min: CDN propagation, not a build
      FD_ASSET_POLL_SECS: '30'
      # The RC version-convergence budget, identical to `front-door` (see that
      # job, and the check itself, for why a single fetch is a sample rather than
      # a verdict). It matters MOST here: on v0.18.5 the macos-latest leg was the
      # only one whose Cloudflare POP still held the previous release's copy.
      # Additive only on the failing path, and payload-mode only, so it never
      # stacks with FD_ASSET_WAIT_SECS.
      FD_RC_VERSION_WAIT_SECS: '240'   # 4 min of propagation slack, then it is real
      FD_RC_VERSION_POLL_SECS: '30'    # so roughly 8 re-reads after the first fetch
      # The expect_version convergence budget, identical to `front-door` (see
      # that job for why it is its own pair rather than a reuse of the rc one,
      # and for the ceiling arithmetic). This job is where the drift it closes
      # actually bit: on v0.20.1 both macOS legs read the PREVIOUS release here
      # while ubuntu read the new one off the same origin.
      FD_EXPECT_VERSION_WAIT_SECS: '600'   # 10 min of post-publish propagation slack
      FD_EXPECT_VERSION_POLL_SECS: '30'    # so roughly 20 plain re-reads after the first
      # A stranger's Mac has no LUCIDOS_* set, but this workflow's top-level env
      # block exports two for the --dev smoke job — and install.sh treats every
      # LUCIDOS_* as a flag. Blank them so this job reproduces a bare machine
      # (install.sh resolves each with `${VAR:-default}`, so empty == unset).
      LUCIDOS_HOME: ''
      LUCIDOS_WORKSPACE: ''
      # ── macOS-specific ───────────────────────────────────────────────────────
      TRIPLE: ${{ matrix.triple }}
      # The launchd label install.sh registers. The install below passes no
      # --name, so the instance slug is `default` and the label is
      # service_launchd_label(default) == com.lucidos.gateway.default. Teardown
      # needs it to prove nothing was left bootstrapped on the runner.
      GW_LAUNCHD_LABEL: 'com.lucidos.gateway.default'
      # The bounded wait rungs 5-8 open with, in this file's usual
      # <thing>_WAIT_SECS / <thing>_POLL_SECS shape. macOS-ONLY, and that is the
      # point: only the launchd path can be answering health while the instance
      # is not yet discoverable (the long note on the wait itself explains why,
      # and why the Linux job needs no twin). 60s is headroom over a window
      # measured in seconds, and it stacks with nothing, since it runs after the
      # health poll has already returned, so it disappears into the 900s of
      # slack the timeout arithmetic on this job already carries.
      FD_MARKER_WAIT_SECS: '60'
      FD_MARKER_POLL_SECS: '2'
    steps:
      # ── validate the origin BEFORE anything touches it ────────────────────────
      # Verbatim from `front-door`, deliberately NOT weakened for this job: the
      # origin can come from a workflow_dispatch input and this job pipes what it
      # fetches straight into a shell, so it is hostile input here for exactly
      # the same reasons. Accept ONLY https:// over a strict character allowlist,
      # and export the validated value under a DIFFERENT name so a skipped or
      # failed validation leaves FRONT_DOOR unset (every consumer runs under
      # `set -u`, i.e. fail closed) rather than silently usable.
      - name: Resolve and validate the origin under test
        shell: bash
        run: |
          set -euo pipefail

          case "$FD_MODE" in
            full|payload) ;;
            *) echo "::error::FD_MODE must be 'full' or 'payload' (got '$FD_MODE')"; exit 1 ;;
          esac

          # Be forgiving about a pasted trailing slash — every use site appends
          # "/install.sh", and "…//install.sh" would soft-404 into a confusing
          # HTML diagnosis rather than an obvious "you typed a trailing slash".
          origin="$FRONT_DOOR_INPUT"
          while [ "${origin%/}" != "$origin" ]; do origin="${origin%/}"; done

          if ! [[ "$origin" =~ ^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?(/[A-Za-z0-9._~-]+)*$ ]]; then
            echo "::error::refusing origin '$FRONT_DOOR_INPUT' — it must be an https:// URL of the form https://host[:port][/path] using only [A-Za-z0-9._~-] in its path. This job pipes what the origin serves into a shell, so anything that is not plainly a URL is rejected."
            exit 1
          fi

          # ── an RC origin is REFUSED unless this is the rc/** push ─────────────
          # Verbatim from `front-door`, including the reasoning: this is a HARD
          # REFUSE decided on 2026-07-31, not a downgrade, and the workspace
          # trigger that used to send the RC origin by mistake has been fixed, so
          # an RC origin on a dispatch now means something regressed again. The
          # canonical comment is on the Linux job.
          case "$origin" in
            https://rc.*|*/rc) fd_is_rc=1 ;;   # the host form, and the legacy path form
            *)                 fd_is_rc=0 ;;
          esac

          if [ "$fd_is_rc" -eq 1 ] && [ "${GITHUB_EVENT_NAME:-}" != "push" ]; then
            echo "::error::refusing origin '$origin' on a '${GITHUB_EVENT_NAME:-unknown}' event. The RC front door is verified by THIS workflow's 'push: rc/**' arm, payload-only, on every release candidate; a dispatcher is not supposed to send this origin at all. Check the CALLER: the workspace trigger verify-front-door-after-publish dispatches this job after a publish and must send the production origin only."
            exit 1
          fi

          if [ "$fd_is_rc" -eq 1 ] && [ "$FD_MODE" != "payload" ]; then
            echo "::error::the RC origin '$origin' is payload-only, but FD_MODE is '$FD_MODE'. An RC has no v<version> release tag and therefore no headless tarball, so a full install here would 404 at the download step on every single run."
            exit 1
          fi

          # Writing to $GITHUB_ENV is only safe AFTER the allowlist: the file is
          # parsed line-by-line, so a value carrying a newline could otherwise
          # define a second, arbitrary variable for every later step.
          echo "FRONT_DOOR=$origin" >> "$GITHUB_ENV"

          # ── the expected release, if the caller named one ─────────────────────
          # Shape-checked here rather than at the point of use, verbatim from
          # `front-door`: a value of the wrong shape can never equal the served
          # LUCIDOS_DEFAULT_VERSION, so it would burn the entire convergence
          # budget and then red for a reason that has nothing to do with the
          # origin. No normalisation of a 'v' prefix, deliberately.
          if [ -n "${FD_EXPECT_VERSION:-}" ] && ! [[ "$FD_EXPECT_VERSION" =~ ^[0-9][A-Za-z0-9.+-]*$ ]]; then
            echo "::error::refusing expect_version '$FD_EXPECT_VERSION'. It must be a bare release number exactly as install.sh bakes it (for example 0.20.1), not a tag (v0.20.1) and not a URL. Rung 1 compares it to the served LUCIDOS_DEFAULT_VERSION, so any other shape can never match and would only fail after the whole ${FD_EXPECT_VERSION_WAIT_SECS}s convergence budget."
            exit 1
          fi

          echo "origin: $origin"
          echo "mode:   $FD_MODE"
          echo "expect: ${FD_EXPECT_VERSION:-(none: rung 1 accepts whatever this origin serves)}"
          echo "triple: $TRIPLE"
          if [ "$FD_MODE" = "full" ]; then
            echo "rungs:  1 (payload sniff), 2 (no HTML sourced), 3 (gateway health), 4 (frontend 200)"
          else
            echo "rungs:  1 (payload sniff) ONLY — no install, no tarball, no gateway"
          fi

      # macOS ships curl + a CA store, so unlike the Linux job there is nothing
      # to install and no container to build a bare machine out of — the runner
      # image already has more on it than a stranger's Mac, which only ever makes
      # this test weaker, never falsely green.
      #
      # This step exists for a different reason: PROVE the leg is the
      # architecture it claims to be. Covering x86_64-apple-darwin is the entire
      # justification for the second matrix entry, and if GitHub ever re-points
      # `macos-15-intel` at Apple Silicon (or the label is swapped when it
      # retires in 2027) both legs would quietly test the same triple while the
      # matrix still advertised two. That is a pass for the wrong reason, so
      # assert it. install.sh derives its triple from the same `uname -m`.
      - name: Assert this leg really is ${{ matrix.triple }}
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64|aarch64) got='aarch64-apple-darwin' ;;
            x86_64)        got='x86_64-apple-darwin' ;;
            *) echo "::error::unexpected machine type '$(uname -m)' on ${{ matrix.runner }} — install.sh would not resolve a triple for it either"; exit 1 ;;
          esac
          if [ "$got" != "$TRIPLE" ]; then
            echo "::error::${{ matrix.runner }} resolved to $got, but this matrix leg exists to cover $TRIPLE. The runner label has changed architecture, so the matrix no longer tests what it claims — fix the matrix rather than the assertion."
            exit 1
          fi
          echo "runner:      ${{ matrix.runner }}"
          echo "uname -m:    $(uname -m)  ⇒  $got"
          echo "macOS:       $(sw_vers -productVersion 2>/dev/null || echo unknown)"
          # On macOS /bin/sh IS bash, so `| sh` never takes install.sh's dash
          # re-exec branch — the opposite of the Linux job, whose whole point is
          # to exercise that branch. Print it so the difference is visible in the
          # log rather than assumed.
          echo "/bin/sh:     $(readlink /bin/sh 2>/dev/null || echo '/bin/sh (not a symlink — bash in sh mode)')"
          echo "bash:        $(bash --version | head -n 1)"

      # ── rung 1 ────────────────────────────────────────────────────────────────
      # The `front-door` job's payload sniff, unchanged in substance: `curl -fsSL`
      # is NOT enough on a soft-404 origin (-f only fails on an HTTP error status,
      # and Cloudflare Pages' SPA fallback returns the landing page at 200), so
      # check the PAYLOAD. Every helper lib a piped install sources must resolve
      # to shell, not HTML.
      - name: Every helper lib the installer needs resolves to shell, not HTML
        shell: bash
        run: |
          set -uo pipefail
          # A STABLE directory rather than `mktemp -d`, for the same reason as
          # the Linux job: the asset preflight below consumes the payloads this
          # rung already fetched, and each step is its own shell.
          tmp="$RUNNER_TEMP/front-door-payloads"
          rm -rf "$tmp"
          mkdir -p "$tmp"

          # ── Cloudflare Access headers for the gated RC origin ────────────────
          # rc.lucidos.dev is behind an Access app; the service token is the only
          # non-interactive way past it. Production is public and gets no headers.
          #
          # ONE macOS-only deviation from the Linux job, and it is load-bearing:
          # the expansion is `${FD_HDR[@]+"${FD_HDR[@]}"}`, not a bare
          # `"${FD_HDR[@]}"`. Expanding an EMPTY array to nothing under `set -u`
          # is bash 4.4+ behavior; Apple still ships bash 3.2.57 as /bin/bash and
          # a macOS runner can resolve `bash` to it, where the bare form aborts
          # the step with "FD_HDR[@]: unbound variable" — on the PRODUCTION
          # origin, which is the one that has no headers. (scripts/lint-shell.sh
          # documents the same bash-3.2 array trap.) The guarded form is correct
          # on both 3.2 and 5.x, so it costs nothing to always use it here.
          #
          # THE ORIGIN IS TESTED FIRST, exactly as in the Linux job and for the
          # same reason: the two secrets are set at JOB level, so keying only on
          # "are the secrets set?" attached the RC service token to every
          # production fetch as well.
          FD_HDR=()
          if [ "$FRONT_DOOR" != "${FRONT_DOOR#https://rc.}" ]; then
            if [ -n "${RC_ACCESS_CLIENT_ID:-}" ] && [ -n "${RC_ACCESS_CLIENT_SECRET:-}" ]; then
              FD_HDR=(-H "CF-Access-Client-Id: $RC_ACCESS_CLIENT_ID"
                      -H "CF-Access-Client-Secret: $RC_ACCESS_CLIENT_SECRET")
              echo "==> Cloudflare Access service token present (gated origin)"
            else
              # Named explicitly rather than left to fail as "returned HTML": a
              # missing secret and a broken deploy look identical in the payload
              # sniff, and only one of them is an origin regression.
              echo "::error::$FRONT_DOOR is behind Cloudflare Access but RC_ACCESS_CLIENT_ID/SECRET are not set. Every fetch will get the 302 login page and be reported as 'not shell'. Add both repo secrets (Cloudflare -> Access -> Service Tokens -> lucidos-ci-front-door)."
              exit 1
            fi
          fi

          # assert_shell_file <file> <url> — the payload must be a shell script.
          # Two distinct failures, because they mean different things: a body
          # starting with '<' is the soft-404 HTML (the origin is misconfigured),
          # while a missing shebang is "something else entirely is at this URL".
          assert_shell_file() {
            local f="$1" url="$2" first_line
            if [ ! -s "$f" ]; then
              echo "::error::$url returned an EMPTY body"
              return 1
            fi
            if [ "$(head -c 1 "$f")" = "<" ]; then
              # A Cloudflare Access login page is an AUTH failure, NOT a soft
              # 404. Same reasoning and same wording as the Linux job, whose
              # comment is the canonical one: the 302 to the login page is
              # followed by `curl -L` and arrives at 200 as HTML, so only the
              # EFFECTIVE URL recorded at the installer fetch can tell it apart
              # from the Pages SPA fallback.
              case "${FD_EFFECTIVE_URL:-}" in
                *cloudflareaccess.com*)
                  echo "::error::$url served no payload: the fetch was redirected to the Cloudflare Access login page at ${FD_EFFECTIVE_URL}. That is an AUTH failure, not the Pages soft 404, and it says nothing about what $FRONT_DOOR actually serves. If this is the gated RC origin, a service token was sent (an unset one is refused earlier in this step) and Access REJECTED it: check that RC_ACCESS_CLIENT_ID / RC_ACCESS_CLIENT_SECRET are current and still authorized for this Access application. If it is not, then an Access application has started covering a host that is supposed to be public, which is an origin change rather than a CI one."
                  echo "    first 3 lines:"; head -n 3 "$f" | sed 's/^/      /'
                  return 1
                  ;;
              esac
              echo "::error::$url returned HTML, not shell — the origin answered a script path with the landing page at status 200 (soft 404). A piped install sources this AS SHELL."
              echo "    first 3 lines:"; head -n 3 "$f" | sed 's/^/      /'
              # In payload mode the whole origin is a subpath the site publisher
              # creates, so "HTML at 200" has a second, much likelier cause than
              # a regressed deploy: the route simply does not exist yet.
              if [ "${FD_MODE:-full}" = "payload" ]; then
                echo "    NOTE: this is the RC front door. Every path under $FRONT_DOOR/ answers with the landing page at 200 when the RC copy of the installer has not been published there — check that the site publisher uploaded install.sh + scripts/lib/*.sh under $FRONT_DOOR/ for THIS release candidate before treating this as an origin regression."
              fi
              return 1
            fi
            first_line="$(head -n 1 "$f")"
            case "$first_line" in
              '#!'*) ;;
              *)
                echo "::error::$url has no '#!' shebang on line 1 — it is not a shell script"
                echo "    first 3 lines:"; head -n 3 "$f" | sed 's/^/      /'
                return 1
                ;;
            esac
            printf '    OK  %-58s %8s bytes  %s\n' "$url" "$(wc -c < "$f" | tr -d ' ')" "$first_line"
            return 0
          }

          # The EFFECTIVE URL is recorded for the Access-vs-soft-404 distinction,
          # exactly as in the Linux job.
          echo "==> Fetching the advertised installer"
          FD_EFFECTIVE_URL="$(curl -fsSL ${FD_HDR[@]+"${FD_HDR[@]}"} "$FRONT_DOOR/install.sh" -o "$tmp/install.sh" -w '%{url_effective}')" \
            || { echo "::error::could not fetch $FRONT_DOOR/install.sh"; exit 1; }
          assert_shell_file "$tmp/install.sh" "$FRONT_DOOR/install.sh" || exit 1

          # ── the version the SERVED installer will resolve ─────────────────────
          # Parsed on every event and exported for the asset preflight, fail
          # closed, for the reasons spelled out in the Linux job.
          served_version="$(sed -n 's/^LUCIDOS_DEFAULT_VERSION="\([^"]*\)".*/\1/p' "$tmp/install.sh" | head -n 1)"
          if [ -z "$served_version" ]; then
            echo "::error::could not parse LUCIDOS_DEFAULT_VERSION out of the served $FRONT_DOOR/install.sh. This check must never silently pass, so it fails closed."
            grep -n '^LUCIDOS_DEFAULT_VERSION=' "$tmp/install.sh" || true
            exit 1
          fi
          echo "    served version: $served_version"

          # ── the RC origin must be serving THIS release candidate ──────────────
          # Only on an rc/** push, where the branch name pins the version we are
          # gating. Without this, the previous RC's copy, still sitting at the
          # same URL, satisfies every payload check and the gate goes green
          # having verified last release's installer.
          #
          # A MISMATCH IS RE-READ BEFORE IT IS BELIEVED, same as the Linux job,
          # whose comment is the canonical one. release.sh's arming wait
          # (scripts/lib/release_rc_front_door.sh) blocks until the origin serves
          # the candidate, but it polls from the maintainer's Mac and so observes
          # exactly ONE Cloudflare POP; a runner resolves to another, whose edge
          # cache can still hold the PREVIOUS release's copy. This job is where
          # that bit: on v0.18.5 (2026-07-31) the macos-latest leg reddened alone
          # while macos-15-intel and ubuntu read the correct version off the same
          # origin, which is a per-POP cache and not an origin regression, and
          # v0.18.3 was the same failure. Both passed on a bare
          # `gh run rerun --failed`.
          #
          # ONLY the mismatch case retries, to a bounded deadline
          # (FD_RC_VERSION_WAIT_SECS, every FD_RC_VERSION_POLL_SECS). The
          # unparseable-version branch above still fails closed on the first
          # read, HTML and the Access login page still fail with their own
          # messages (each retry re-runs assert_shell_file, so a retry landing on
          # HTML is reported as HTML), and a non-push event asserts nothing.
          # Every retry fetch defeats the edge cache with a per-attempt query
          # nonce (Cloudflare's cache key includes the query string) plus the
          # no-cache request headers, and keeps the Access headers in the
          # bash-3.2-safe expansion form this job uses everywhere.
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            case "${GITHUB_REF_NAME:-}" in
              rc/?*) rc_version="${GITHUB_REF_NAME#rc/}" ;;
              *) echo "::error::this job only runs on a push for an rc/<version> branch, got '${GITHUB_REF_NAME:-}'"; exit 1 ;;
            esac
            rc_started="$(date +%s)"
            rc_deadline=$(( rc_started + FD_RC_VERSION_WAIT_SECS ))
            rc_attempt=0
            while [ "$served_version" != "$rc_version" ]; do
              if [ "$(date +%s)" -ge "$rc_deadline" ]; then
                echo "::error::$FRONT_DOOR/install.sh bakes version $served_version, but this push is $GITHUB_REF_NAME (expected $rc_version): the RC front door is serving a DIFFERENT release candidate. This is not a first-read verdict. The baked version was re-read with a cache-busting query nonce and no-cache headers $rc_attempt time(s) across the full ${FD_RC_VERSION_WAIT_SECS}s budget and never converged, so Cloudflare POP propagation lag no longer explains it. Either the site publisher has not published this RC's installer yet, or it published another one; gating against it would verify the wrong tree. Last read: $served_version. Expected: $rc_version."
                exit 1
              fi
              sleep "$FD_RC_VERSION_POLL_SECS"
              rc_attempt=$(( rc_attempt + 1 ))
              rc_url="$FRONT_DOOR/install.sh?cb=$(date +%s)-$rc_attempt"
              FD_EFFECTIVE_URL="$(curl -fsSL ${FD_HDR[@]+"${FD_HDR[@]}"} -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$rc_url" -o "$tmp/install.sh" -w '%{url_effective}')" \
                || { echo "::error::could not re-fetch $rc_url while waiting for this runner's Cloudflare POP to serve $rc_version"; exit 1; }
              assert_shell_file "$tmp/install.sh" "$rc_url" || exit 1
              served_version="$(sed -n 's/^LUCIDOS_DEFAULT_VERSION="\([^"]*\)".*/\1/p' "$tmp/install.sh" | head -n 1)"
              if [ -z "$served_version" ]; then
                echo "::error::could not parse LUCIDOS_DEFAULT_VERSION out of the re-fetched $rc_url. This check must never silently pass, so it fails closed."
                grep -n '^LUCIDOS_DEFAULT_VERSION=' "$tmp/install.sh" || true
                exit 1
              fi
              echo "    re-read $rc_attempt at $(( $(date +%s) - rc_started ))s: this POP now serves $served_version (want $rc_version)"
            done
            if [ "$rc_attempt" -gt 0 ]; then
              echo "::warning::the RC front door needed $rc_attempt cache-busting re-read(s) over $(( $(date +%s) - rc_started ))s before this runner's Cloudflare POP served $rc_version. The origin is fine: this is Cloudflare POP propagation lag on the RC origin, which release.sh's arming wait cannot see because it polls from a single vantage point. Recorded here so the run does not read as a clean first-try pass."
            fi
            echo "    OK  the RC front door serves $served_version, matching $GITHUB_REF_NAME"
          fi

          # ── this POP must serve the release we were dispatched to verify ──────
          # The `front-door` job carries the canonical note. The short version:
          # rung 1 fetches install.sh once and the install step fetches it AGAIN,
          # independently, so in the post-publish window (when Cloudflare POPs are
          # mid propagation) the two can land on different releases and the asset
          # preflight between them then certifies a release nobody downloads.
          #
          # THIS JOB IS WHERE THAT BIT. On 2026-08-03, 28 s after v0.20.1
          # published, both macOS legs read 0.20.0 here, passed the preflight on
          # attempt 1 against the PREVIOUS release's assets, and then died when
          # the install step re-fetched install.sh, got 0.20.1 from a POP that had
          # since flipped, and asked for a tarball release-tarballs.yml had not
          # attached yet. The ubuntu leg read 0.20.1 from the first fetch, waited
          # out the attach window, and went green off the same origin.
          #
          # THIS LOOP DELIBERATELY DOES NOT CACHE-BUST, unlike the rc loop right
          # above it, and that contrast is the load-bearing detail rather than an
          # oversight. A '?cb=' nonce is a DIFFERENT Cloudflare cache key: it is
          # correct up there, where payload mode stops after rung 1 and the
          # nonced fetch is the last word, and wrong down here, where the install
          # step fetches the PLAIN URL and converging on a nonced one would prove
          # nothing about it. Poll exactly the URL the install step will request:
          # no nonce, no Cache-Control, no Pragma. Do not "fix" it into a nonce.
          #
          # An EMPTY input keeps the old single-read behaviour exactly, so the
          # daily cron (which runs long after the assets have settled) gains no
          # new way to red.
          if [ -n "${FD_EXPECT_VERSION:-}" ]; then
            ev_started="$(date +%s)"
            ev_deadline=$(( ev_started + FD_EXPECT_VERSION_WAIT_SECS ))
            ev_attempt=0
            while [ "$served_version" != "$FD_EXPECT_VERSION" ]; do
              if [ "$(date +%s)" -ge "$ev_deadline" ]; then
                echo "::error::$FRONT_DOOR/install.sh still bakes $served_version after the full ${FD_EXPECT_VERSION_WAIT_SECS}s budget, but this run was dispatched to verify $FD_EXPECT_VERSION. The plain (deliberately un-nonced) URL was re-read $ev_attempt time(s) and never agreed. TWO CAUSES, and only the second is transient: either the site publisher has not deployed $FD_EXPECT_VERSION's installer to this origin at all (that deploy runs on the maintainer's machine off the SitePublished chain, not in CI, so no change in this repository can turn it green), or this runner's Cloudflare POP is still lagging after the whole budget, in which case a rerun lands on a POP that has caught up. Last read: $served_version. Expected: $FD_EXPECT_VERSION."
                exit 1
              fi
              sleep "$FD_EXPECT_VERSION_POLL_SECS"
              ev_attempt=$(( ev_attempt + 1 ))
              # The PLAIN url, byte for byte what the install step will request,
              # with the Access headers in this job's bash-3.2-safe form.
              FD_EFFECTIVE_URL="$(curl -fsSL ${FD_HDR[@]+"${FD_HDR[@]}"} "$FRONT_DOOR/install.sh" -o "$tmp/install.sh" -w '%{url_effective}')" \
                || { echo "::error::could not re-read $FRONT_DOOR/install.sh while waiting for this runner's Cloudflare POP to serve $FD_EXPECT_VERSION"; exit 1; }
              # The whole payload is re-validated, exactly as in the rc loop, so a
              # re-read that lands on the soft-404 landing page is reported as
              # HTML rather than swallowed as one more version mismatch.
              assert_shell_file "$tmp/install.sh" "$FRONT_DOOR/install.sh" || exit 1
              served_version="$(sed -n 's/^LUCIDOS_DEFAULT_VERSION="\([^"]*\)".*/\1/p' "$tmp/install.sh" | head -n 1)"
              if [ -z "$served_version" ]; then
                echo "::error::could not parse LUCIDOS_DEFAULT_VERSION out of the re-read $FRONT_DOOR/install.sh. This check must never silently pass, so it fails closed."
                grep -n '^LUCIDOS_DEFAULT_VERSION=' "$tmp/install.sh" || true
                exit 1
              fi
              echo "    re-read $ev_attempt at $(( $(date +%s) - ev_started ))s: this POP now serves $served_version (want $FD_EXPECT_VERSION)"
            done
            if [ "$ev_attempt" -gt 0 ]; then
              echo "::warning::$FRONT_DOOR needed $ev_attempt plain re-read(s) over $(( $(date +%s) - ev_started ))s before this runner's Cloudflare POP served $FD_EXPECT_VERSION. The origin is fine: this is post-publish POP propagation, which is exactly the window the install step used to fall into unnoticed. Recorded here so the run does not read as a clean first-try pass."
            fi
            echo "    OK  $FRONT_DOOR serves $FD_EXPECT_VERSION to a plain unadorned fetch, which is what the install step will get too"
          fi

          # Exported only NOW, after BOTH convergence loops, and exactly once: a
          # write before them would pin the FIRST read and hand every later
          # consumer the stale version a re-read had already replaced.
          echo "FD_SERVED_VERSION=$served_version" >> "$GITHUB_ENV"

          # Which libs, from where — both READ OUT of the installer we just
          # fetched, so this stays correct when the set changes.
          libs="$(grep -E '^LUCIDOS_LIBS=|_source_libs ' "$tmp/install.sh" \
                  | grep -oE '[A-Za-z0-9_]+\.sh' | sort -u)"
          lib_count="$(printf '%s\n' "$libs" | grep -c . || true)"
          # Fail closed on a broken scrape: a parser that silently finds nothing
          # would make this whole job report green against a dead front door.
          if [ "${lib_count:-0}" -lt 2 ]; then
            echo "::error::parsed only ${lib_count:-0} helper lib name(s) from install.sh — its lib declaration changed shape and this parser needs updating (it must never silently check nothing)"
            grep -nE '^LUCIDOS_LIBS=|_source_libs ' "$tmp/install.sh" || true
            exit 1
          fi

          # Base URL: the same expression _source_libs uses, resolved from the
          # baked LUCIDOS_INSTALL_URL in the copy we were just served. Reading it
          # instead of assuming keeps rung 1 pointed at the URLs a piped install
          # will REALLY hit.
          install_url="$(grep -m1 '^LUCIDOS_INSTALL_URL=' "$tmp/install.sh" | sed -e 's/.*:-//' -e 's/}"$//')"
          case "$install_url" in
            http*://*/install.sh) ;;
            *) echo "::error::could not parse LUCIDOS_INSTALL_URL out of the served install.sh (got '$install_url')"; exit 1 ;;
          esac
          lib_base="${install_url%/install.sh}/scripts/lib"

          echo "==> Helper libs the installer will fetch when piped"
          echo "    lib base: $lib_base"
          echo "    libs:     $(echo "$libs" | tr '\n' ' ')"

          # Accumulate into ONE verdict rather than exiting at the first problem,
          # so a run reports every broken payload it found (see the Linux job).
          fail=0

          # pin_mismatch <message>: a served script pointing its own fetches
          # somewhere other than this origin, which would make the rung pass
          # without having touched the front door. FATAL in payload mode (rung 1
          # is the only rung there), loud in full mode (rungs 2-8 still drive
          # this origin). One helper for all three pin checks below.
          pin_mismatch() {
            if [ "$FD_MODE" = "payload" ]; then
              echo "::error::$1, and payload mode has no other rung to fall back on. Refusing to report green on a check that never touched $FRONT_DOOR."
              fail=1
            else
              echo "::warning::$1"
            fi
          }

          # EQUALITY, not a prefix match — with FRONT_DOOR set to the apex, an
          # installer wrongly pinned to the RC copy would prefix-match and pass
          # silently while rung 1 checked the RC's libs instead of production's.
          expected_lib_base="$FRONT_DOOR/scripts/lib"
          if [ "$lib_base" != "$expected_lib_base" ]; then
            pin_mismatch "the served install.sh points its helper-lib fetch at $lib_base, NOT $expected_lib_base, so rung 1 is not exercising this origin's script paths"
          fi

          lib_fail=0
          for name in $libs; do
            url="$lib_base/$name"
            if ! curl -fsSL ${FD_HDR[@]+"${FD_HDR[@]}"} "$url" -o "$tmp/$name"; then
              echo "::error::could not fetch $url (HTTP error)"
              lib_fail=1
              continue
            fi
            assert_shell_file "$tmp/$name" "$url" || lib_fail=1
          done
          if [ "$lib_fail" -ne 0 ]; then
            echo "::error::at least one helper lib does not resolve to a shell script — 'curl -fsSL $FRONT_DOOR/install.sh | sh' would source that payload as shell and die on a fresh Mac"
            fail=1
          fi

          # ── the advertised UNINSTALLER is part of the front door too ──────────
          # Same reasoning as the Linux job, which carries the full note: both
          # advertised uninstall paths EXECUTE what this URL serves (install.sh's
          # dispatch_uninstall runs `exec bash -c "$payload"` on it; the direct
          # pipe feeds it to a shell), so a soft-404 here means the landing page
          # RUNS. Checked in BOTH modes, and the URL is DERIVED from the served
          # installer so it follows the pin.
          uninstall_url="${install_url%/install.sh}/uninstall.sh"
          echo "==> The advertised uninstaller"
          echo "    $uninstall_url"
          if ! curl -fsSL ${FD_HDR[@]+"${FD_HDR[@]}"} "$uninstall_url" -o "$tmp/uninstall.sh"; then
            echo "::error::could not fetch $uninstall_url (HTTP error)"
            fail=1
          elif ! assert_shell_file "$tmp/uninstall.sh" "$uninstall_url"; then
            echo "::error::$uninstall_url does not serve a shell script, so BOTH advertised uninstall paths would RUN that payload: 'curl -fsSL $FRONT_DOOR/install.sh | sh -s -- --uninstall' execs it via dispatch_uninstall, and 'curl -fsSL $uninstall_url | sh' pipes it into a shell directly."
            echo "::error::FIX: the site publisher must publish the /uninstall.sh route beside /install.sh. That deploy runs on the maintainer's machine off the SitePublished trigger chain, NOT in CI, so no change in this repository can turn this green."
            fail=1
          else
            # The served uninstaller carries TWO pins of its own, both of which
            # must point here (the Linux job documents why in full):
            # LUCIDOS_UNINSTALL_SELF_URL is where a piped run re-fetches itself,
            # and LUCIDOS_INSTALL_URL is what its scripts/lib/service.sh fetch
            # derives from. Both parses fail closed.
            u_self="$(grep -m1 '^LUCIDOS_UNINSTALL_SELF_URL=' "$tmp/uninstall.sh" | sed -e 's/.*:-//' -e 's/}"$//')"
            case "$u_self" in
              http*://*/uninstall.sh) ;;
              *)
                echo "::error::could not parse LUCIDOS_UNINSTALL_SELF_URL out of the served $uninstall_url (got '$u_self'). This check must never silently pass, so it fails closed."
                grep -n '^LUCIDOS_UNINSTALL_SELF_URL=' "$tmp/uninstall.sh" || true
                fail=1
                u_self=""
                ;;
            esac
            if [ -n "$u_self" ] && [ "$u_self" != "$FRONT_DOOR/uninstall.sh" ]; then
              pin_mismatch "the served uninstall.sh re-execs itself from $u_self, NOT $FRONT_DOOR/uninstall.sh, so a piped 'curl -fsSL $uninstall_url | sh' would run THAT copy instead of this origin's"
            fi

            u_install_url="$(grep -m1 '^LUCIDOS_INSTALL_URL=' "$tmp/uninstall.sh" | sed -e 's/.*:-//' -e 's/}"$//')"
            case "$u_install_url" in
              http*://*/install.sh) ;;
              *)
                echo "::error::could not parse LUCIDOS_INSTALL_URL out of the served $uninstall_url (got '$u_install_url'). This check must never silently pass, so it fails closed."
                grep -n '^LUCIDOS_INSTALL_URL=' "$tmp/uninstall.sh" || true
                fail=1
                u_install_url=""
                ;;
            esac
            if [ -n "$u_install_url" ] && [ "${u_install_url%/install.sh}/scripts/lib" != "$expected_lib_base" ]; then
              pin_mismatch "the served uninstall.sh points its service.sh fetch at ${u_install_url%/install.sh}/scripts/lib, NOT $expected_lib_base, so an uninstall run from this origin would source its helper lib from somewhere else"
            fi
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "rung 1 OK: the installer, all $lib_count helper libs at $lib_base, and the uninstaller at $uninstall_url all resolve to shell"

          # Be explicit about where a payload-mode run stops and what that green
          # does NOT mean, so nobody reads it as "the RC installs cleanly".
          if [ "$FD_MODE" = "payload" ]; then
            echo
            echo "PAYLOAD MODE — stopping here, green."
            echo "  verified:     $FRONT_DOOR serves an installer, an uninstaller, and all $lib_count helper libs the installer declares, every one of them as SHELL rather than the landing page (the 2026-07-29 soft-404 class)."
            echo "  NOT verified: that the install completes. It cannot be: an RC installer resolves its tarball to"
            echo "                https://github.com/lucidos-dev/lucidos/releases/download/v<version>/… and that tag does not"
            echo "                exist during an RC (Phase A publishes only an rc-<version> prerelease, DMG + .sig, no tarballs)."
            echo "                Wiring the install here would 404 every single run. The full ladder runs against the real"
            echo "                origin post-publish (dispatch) and daily (cron)."
          fi

      # ── the release assets must EXIST before the install starts ───────────────
      # The `front-door` job carries the canonical note on why this step exists
      # (the 2026-07-31 v0.18.0 legs, which downloaded nothing and then reported
      # a 900 s health timeout while release-tarballs was still attaching the
      # assets). Two macOS differences only:
      #
      #   * the triple comes from the MATRIX, not from a uname map. This leg
      #     already asserted `uname -m` against $TRIPLE in its own step above,
      #     and that assertion is the whole justification for the second matrix
      #     entry, so re-deriving here would be a second, weaker copy of it.
      #   * this leg is exactly where the wait pays for itself: macOS has no
      #     installer-exited fast-fail (see the verify step), so a missing asset
      #     costs the FULL health budget rather than a few seconds.
      - name: Wait for the release assets this install will download
        if: env.FD_MODE == 'full'
        shell: bash
        run: |
          set -uo pipefail
          payloads="$RUNNER_TEMP/front-door-payloads"
          triple="$TRIPLE"

          version="${FD_SERVED_VERSION:-}"
          if [ -z "$version" ]; then
            echo "::error::FD_SERVED_VERSION is empty. Rung 1 parses the served installer's baked version and exports it; without it this step would have to guess which release to probe, so it fails closed instead."
            exit 1
          fi

          # The base URL is DERIVED from the served install_common.sh and the
          # artifact stem is drift-guarded against the served headless_tarball.sh,
          # both fail closed. See the Linux job for why each shape is validated
          # rather than assumed.
          lib="$payloads/install_common.sh"
          if [ ! -s "$lib" ]; then
            echo "::error::rung 1 left no served install_common.sh at $lib, so the download URL cannot be derived from what this origin serves. Fail closed rather than assume the GitHub default."
            exit 1
          fi
          base_fmt="$(sed -n '/^install_default_base_url()/,/^}/p' "$lib" \
                      | sed -n "s/.*printf '\([^']*\)'.*/\1/p" | head -n 1)"
          case "$base_fmt" in
            https://*%s) ;;
            *)
              echo "::error::could not derive the release base URL from the served install_common.sh: install_default_base_url prints '$base_fmt', which is not the expected 'https://...%s' shape. Update this step to match the lib rather than probing a URL install.sh would never request."
              exit 1
              ;;
          esac
          base_prefix="${base_fmt%'%s'}"
          case "$base_prefix" in
            *%*)
              echo "::error::the served install_default_base_url format '$base_fmt' carries more than one printf directive, and this preflight only knows how to substitute the version. Fail closed."
              exit 1
              ;;
          esac
          base_url="$base_prefix$version"

          stem_lib="$payloads/headless_tarball.sh"
          if [ ! -s "$stem_lib" ]; then
            echo "::error::rung 1 left no served headless_tarball.sh at $stem_lib, so the artifact name cannot be checked against what this origin serves. Fail closed."
            exit 1
          fi
          stem_fmt="$(sed -n '/^headless_tarball_stem()/,/^}/p' "$stem_lib" \
                      | sed -n "s/.*printf '\([^']*\)'.*/\1/p" | head -n 1)"
          if [ "$stem_fmt" != 'lucidos-%s-%s' ]; then
            echo "::error::the served headless_tarball_stem builds '$stem_fmt', not the 'lucidos-%s-%s' this preflight constructs. The artifact name changed shape, so update this step to match it."
            exit 1
          fi
          stem="lucidos-$version-$triple"

          tarball_url="$base_url/$stem.tar.gz"
          checksum_url="$tarball_url.sha256"
          echo "==> The install will download, and both must exist first:"
          echo "    $tarball_url"
          echo "    $checksum_url"
          echo "    (the .sha256 too: install.sh's checksum step is mandatory and fails closed)"

          fd_code=''
          probe() {
            fd_code="$(curl -sS -L -r 0-0 -o /dev/null -w '%{http_code}' --max-time 30 "$1" 2>/dev/null || echo 000)"
            case "$fd_code" in 200|206) return 0 ;; *) return 1 ;; esac
          }

          deadline=$(( $(date +%s) + FD_ASSET_WAIT_SECS ))
          attempt=0
          tar_code='000'
          sha_code='000'
          while : ; do
            attempt=$(( attempt + 1 ))
            if probe "$tarball_url"; then
              tar_code="$fd_code"
              if probe "$checksum_url"; then
                sha_code="$fd_code"
                echo "preflight OK on attempt $attempt: the tarball answered $tar_code and its .sha256 answered $sha_code."
                break
              fi
              sha_code="$fd_code"
            else
              tar_code="$fd_code"
              sha_code='not probed'
            fi
            now="$(date +%s)"
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::the release assets this install needs are MISSING after ${FD_ASSET_WAIT_SECS}s: $tarball_url answered $tar_code and $checksum_url answered $sha_code. This is an ASSET AVAILABILITY failure. It is not a broken front door and not a gateway health failure, and the install is deliberately NOT being started: it would 404 at the download step and then burn the ${GW_HEALTH_TIMEOUT_SECS}s gateway poll before reporting the wrong cause. DO NOT read this as 'the tarballs are still attaching, wait longer'. Since 2026-08-04 a release is created as a DRAFT and published only once release-tarballs.yml has attached all four per-platform tarballs, so a PUBLISHED v$version missing one is a real fault rather than a race: either it was published deliberately incomplete (release.sh --allow-missing-tarballs), or the asset was removed afterwards, or this POP is serving an install.sh for a release that was never published. Look at the v$version release page for $stem.tar.gz + .sha256, then at the release-tarballs run that was supposed to attach them."
              exit 1
            fi
            echo "    attempt $attempt: tarball $tar_code, sidecar $sha_code; $(( deadline - now ))s of the ${FD_ASSET_WAIT_SECS}s budget left, retrying in ${FD_ASSET_POLL_SECS}s"
            sleep "$FD_ASSET_POLL_SECS"
          done

      # ── rungs 2-4: FULL MODE ONLY ─────────────────────────────────────────────
      # The RC payload-only rule applies here IDENTICALLY, and for the same
      # reason — an RC install.sh bakes LUCIDOS_DEFAULT_VERSION=<rc version> and
      # resolves its tarball to a v<version> tag that does not exist yet, so
      # these steps would 404 on every single rc/** push. Do not "fix" that by
      # re-enabling the install for the RC origin; it makes the gate permanently
      # red, not stronger. See the long note on the `front-door` job.
      #
      # THE LAUNCH SHAPE DIFFERS FROM THE LINUX JOB — this is the substantive
      # macOS difference and the verify step below depends on it:
      #
      #   * Linux (ubuntu:22.04 container): no service manager, so
      #     service_detect_manager returns `none` and install.sh degrades to a
      #     FOREGROUND launch that never returns. There, an installer that exits
      #     is ALWAYS a failure.
      #   * macOS runner: `launchctl` is present, so the manager resolves to
      #     launchd and install.sh takes the register_service path — it writes a
      #     LaunchAgent, health-waits the gateway itself, prints the banner, and
      #     EXITS 0 with the gateway still running detached.
      #
      # On a macOS RUNNER only the launchd shape is actually reachable, and it
      # is worth being precise about why rather than hand-waving "either may
      # occur": service_decide_manager returns `launchd` for Darwin whenever
      # launchctl exists (always here), service_compose_decision picks
      # `foreground` only for manager `none` or --no-service (neither applies),
      # and when the bootstrap DOES fail register_launchd dies rather than
      # degrading. So a failed registration is an installer abort, not a
      # foreground launch.
      #
      # We still background the command, for two reasons that survive that:
      # backgrounding is free in the exit-0 shape, and it keeps this job's shape
      # identical to the Linux one so the two stay comparable if install.sh ever
      # does start degrading on Darwin. What must NOT be copied back from the
      # Linux job is its fast-fail — see the verify step.
      #
      # The wrapper script exists ONLY to capture the installer's exit status:
      # the background child is reparented once this step's shell exits, so the
      # next step cannot `wait` for it. It records the status in a file instead,
      # which the verify step folds into its failure message.
      - name: Run the advertised command (background — launchd exit-0 or foreground, either is legal)
        if: env.FD_MODE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          echo "==> curl -fsSL $FRONT_DOOR/install.sh | sh"

          # The origin is passed as an ARGUMENT, not spliced into the `sh -c`
          # string: it can originate in a dispatch input, and a string-interpolated
          # value would be parsed as shell by the very command we are constructing.
          # The validation step already rejects anything that is not plainly a URL;
          # this is the second lock on the same door. The single quotes around the
          # inner command are load-bearing: "$0" must reach the inner shell
          # UNEXPANDED so it resolves to the argument, which is the whole point of
          # not interpolating the origin. The quoted heredoc delimiter keeps this
          # true through the file write as well.
          runner_script="$RUNNER_TEMP/front-door-run.sh"
          cat > "$runner_script" <<'RUNNER'
          #!/usr/bin/env bash
          # $1 = the validated origin, $2 = where to record the exit status.
          sh -c 'curl -fsSL "$0/install.sh" | sh' "$1"
          status=$?
          # PUBLISH THE STATUS ATOMICALLY. A plain `> "$2"` truncates-then-writes,
          # so the verify step — which polls every 5s and treats the file's
          # existence as "the installer has exited" — can catch it empty and
          # report a blank exit status. Write beside it and rename, which is
          # atomic on the same filesystem: the file either is not there or is
          # complete.
          printf '%s\n' "$status" > "$2.partial" && mv -f "$2.partial" "$2"
          exit "$status"
          RUNNER
          chmod +x "$runner_script"

          nohup "$runner_script" "$FRONT_DOOR" "$RUNNER_TEMP/install.status" \
            > "$RUNNER_TEMP/install.log" 2>&1 &
          echo "INSTALL_PID=$!" >> "$GITHUB_ENV"
          echo "Installer started (pid $!). Log: $RUNNER_TEMP/install.log"

      - name: Verify the front door installed a working Lucidos
        if: env.FD_MODE == 'full'
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/install.log"
          status_file="$RUNNER_TEMP/install.status"
          dump() { echo "--- installer log (tail 200) ---"; tail -n 200 "$log" 2>/dev/null || true; }

          # installer_state — diagnostic context appended to a failure message,
          # NOT a verdict. On this runner an exited installer is the SUCCESSFUL
          # shape, so the status only helps tell the cases apart afterwards:
          # non-zero ⇒ the installer itself aborted (a real regression), zero ⇒
          # it registered the launchd job and left (so a red run means the
          # gateway died or never bound), still running ⇒ we are inside
          # install.sh's own post-register health wait.
          # `-s`, not `-f`, at both read sites: the writer renames a complete
          # file into place, so a zero-byte one should never exist — but if it
          # ever did, "still running" is the honest reading of it, not an exit
          # with a blank status.
          installer_state() {
            if [ -s "$status_file" ]; then
              printf 'the installer process had already exited with status %s' "$(tr -d ' \t\r\n' < "$status_file")"
            else
              printf 'the installer process was still running'
            fi
          }

          # ── rung 2: the installer must never source a NON-SHELL payload ───────
          # The 2026-07-29 failure surfaces exactly here — '<!DOCTYPE html>' echoed
          # by the shell plus a syntax error from the sourced lib. Terminal the
          # moment it appears; there is nothing to wait for after it.
          #
          # The pattern is the SHELL-PARSE signature, not a bare 'syntax error':
          # this log can also carry the gateway's own stdout, so a plain substring
          # would red a perfectly healthy install the first time embedded Postgres
          # logs "syntax error at or near". Both shells that can parse the payload
          # are covered — bash says "syntax error near unexpected token", dash says
          # "Syntax error: <what> unexpected" — and neither matches Postgres's
          # wording.
          HTML_PAYLOAD_RE='DOCTYPE|syntax error near|syntax error:'
          assert_no_html_payload() {
            grep -qiE "$HTML_PAYLOAD_RE" "$log" 2>/dev/null || return 0
            echo "::error::the installer sourced a NON-SHELL payload — the origin answered a script path with HTML (soft 404)"
            grep -inE "$HTML_PAYLOAD_RE" "$log" | head -n 10 | sed 's/^/      /'
            dump
            exit 1
          }

          # ── the residual download failure, named as itself ────────────────────
          # The `front-door` job carries the canonical note. It matters MORE on
          # this runner: there is no installer-exited fast-fail below (see the
          # next paragraph), so without this a failed download would poll out the
          # entire health budget and then report the gateway rather than the
          # download. Both of install.sh's asset-fetch aborts are matched, but
          # not the checksum MISMATCH, which is a different verdict.
          #
          # AND ONE OF THESE IS NOT A DOWNLOAD FAILURE AT ALL, which is the other
          # half of the 2026-08-03 v0.20.1 fix and matters most on these legs
          # (they are the ones that hit it). When the URL the installer died on
          # names a DIFFERENT version than rung 1 verified, the two independent
          # fetches of install.sh landed on two different releases and the
          # preflight certified assets nobody downloaded: a front-door
          # version-drift race, prevented by rung 1's expect_version convergence
          # and pointlessly attributed to release-tarballs.yml if reported as a
          # flat download failure. A URL the version cannot be parsed from falls
          # through to the plain verdict: this branch renames a failure, it never
          # invents one. The canonical note is on the `front-door` job.
          DOWNLOAD_FAIL_RE='Download failed:|could NOT fetch its checksum sidecar'
          assert_no_download_failure() {
            grep -qE "$DOWNLOAD_FAIL_RE" "$log" 2>/dev/null || return 0
            # `-A 1` because the two aborts print their URL differently: the
            # tarball one puts it on the same line as "Download failed:", the
            # sidecar one on the line below its own wording.
            local failed_version
            failed_version="$(grep -A 1 -E "$DOWNLOAD_FAIL_RE" "$log" 2>/dev/null \
                              | sed -n 's#.*/releases/download/v\([^/[:space:]]*\)/.*#\1#p' | head -n 1)"
            if [ -n "$failed_version" ] && [ -n "${FD_SERVED_VERSION:-}" ] \
               && [ "$failed_version" != "$FD_SERVED_VERSION" ]; then
              echo "::error::FRONT-DOOR VERSION DRIFT, not a plain download failure. Rung 1 read $FD_SERVED_VERSION from $FRONT_DOOR/install.sh and the asset preflight verified THAT release's tarball, but the install step re-fetched the same URL and resolved $failed_version. The two fetches landed on different releases, so the preflight's guarantee never covered what was actually downloaded. This is the post-publish Cloudflare POP race: dispatch this workflow with expect_version set to the release being verified, and rung 1 waits for this runner's POP to serve it before the preflight or the install run."
              grep -nE "$DOWNLOAD_FAIL_RE" "$log" | head -n 5 | sed 's/^/      /'
              dump
              exit 1
            fi
            echo "::error::the installer could not fetch the release asset, AFTER the preflight found it published. This is a DOWNLOAD failure, not a gateway health failure: the gateway was never going to start."
            grep -nE "$DOWNLOAD_FAIL_RE" "$log" | head -n 5 | sed 's/^/      /'
            dump
            exit 1
          }

          # ── rung 3: the gateway answers /health (polled) ──────────────────────
          # The gateway lives in the sigil namespace: a bare /api/v1/health would
          # resolve as a workspace slug and 404. The port comes from the launch
          # banner — install.sh auto-picks the first free port from its default
          # upward, so read what it chose instead of assuming.
          #
          # NOTE THE ABSENCE OF A `kill -0 "$INSTALL_PID"` FAST-FAIL, and do not
          # copy one back in from the Linux job. There it is correct: a container
          # install is a foreground launch, so an exited installer can only mean
          # failure. Here a successful launchd registration exits 0 BY DESIGN
          # while the gateway keeps running detached, so that check would abort
          # the poll on the healthy path. Worse, it would do so intermittently —
          # only when the installer happened to finish before the first probe.
          # An exited installer therefore proves nothing on macOS; we keep polling
          # to the deadline and report its status alongside the failure instead.
          #
          # A NARROWER fast-fail IS available and is deliberately not taken: a
          # non-zero status file plus no bootstrapped launchd job means nothing
          # can ever become healthy, so the remaining poll is pure waiting. It
          # would save up to ${GW_HEALTH_TIMEOUT_SECS}s on a genuinely broken
          # run — but it would also turn any `launchctl print` hiccup into a
          # false RED, and it cannot be allowed to fire on the case the warning
          # below exists for (installer exits non-zero, KeepAlive brings the
          # gateway up afterwards). A slow red is strictly better than a wrong
          # one here, and public-repo macOS minutes are free (see the file
          # header), so the wait is the cheaper mistake. Revisit only if these
          # runs start timing out at the 30-minute job limit.
          echo "Polling the gateway (timeout ${GW_HEALTH_TIMEOUT_SECS}s)…"
          deadline=$(( $(date +%s) + GW_HEALTH_TIMEOUT_SECS ))
          port="$GW_DEFAULT_PORT"
          body=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            assert_no_html_payload
            assert_no_download_failure
            banner_port="$(sed -n 's|.*http://localhost:\([0-9][0-9]*\)/.*|\1|p' "$log" 2>/dev/null | head -n 1)"
            [ -n "$banner_port" ] && port="$banner_port"
            body="$(curl -fsS --max-time 5 "http://localhost:$port/~/api/v1/health" 2>/dev/null || true)"
            echo "$body" | grep -q '"status":"ok"' && break
            sleep 5
          done
          assert_no_html_payload
          assert_no_download_failure
          echo "$body" | grep -q '"status":"ok"' \
            || { echo "::error::the gateway never reported healthy within ${GW_HEALTH_TIMEOUT_SECS}s ($(installer_state))"; dump; exit 1; }
          echo "$body" | grep -q '"role":"gateway"' \
            || { echo "::error::/~/api/v1/health did not answer as the gateway: $body"; dump; exit 1; }
          echo "rung 2 + 3 OK — installed cleanly, gateway healthy on port $port ($(installer_state)): $body"

          # Healthy — but did the advertised command itself SUCCEED? An exited
          # installer is legal here (the launchd shape exits 0); a NON-ZERO exit
          # is not. It means a user running the one-liner watched it fail, and
          # only launchd's KeepAlive brought the gateway up afterwards, inside
          # our much longer window. Without this the two outcomes are
          # indistinguishable: installer_state() is otherwise consulted only on
          # the failure path, so a real install failure that self-heals reports
          # green with no signal at all.
          #
          # A WARNING, not a failure, and that is deliberate: the likeliest
          # cause is install.sh's own health wait (LUCIDOS_HEALTH_TIMEOUT, 120s
          # by default) expiring on a cold runner while the download, extract
          # and embedded-PG initdb finish — a slow boot, not a broken front
          # door. Reddening on it would make this job flaky for an environment
          # artifact; a warning keeps the signal visible at no such cost. If it
          # turns out to fire on real regressions rather than slow runners, the
          # fix is to raise LUCIDOS_HEALTH_TIMEOUT for the run and THEN make it
          # fatal.
          if [ -s "$status_file" ]; then
            st="$(tr -d ' \t\r\n' < "$status_file")"
            [ "$st" = "0" ] || echo "::warning::the gateway is healthy, but the installer itself exited $st — a user running this one-liner would have seen it fail, and the gateway only came up afterwards. Check the log for install.sh's own health wait timing out."
          fi

          # ── rung 4: the frontend is served ────────────────────────────────────
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://localhost:$port/" || echo 000)"
          [ "$code" = "200" ] \
            || { echo "::error::frontend http://localhost:$port/ returned HTTP $code"; dump; exit 1; }
          echo "rung 4 OK — frontend serves 200 at http://localhost:$port/"

          echo "OK — 'curl -fsSL $FRONT_DOOR/install.sh | sh' works on a fresh ${{ matrix.runner }} ($TRIPLE)."

      # ── rungs 5-8: the advertised UNINSTALL paths (FULL MODE ONLY) ────────────
      # The `front-door` job carries the canonical note on why these exist, what
      # the four rungs are, and why their ORDER saves a reinstall (a data-safe
      # rung 7 keeps the data dir and its port marker, so rung 8 still has a
      # target). Only the macOS differences are commented again here.
      #
      # THE MACOS DIFFERENCE IS THE SERVICE HALF, and it is what makes this leg
      # strictly stronger than the Linux one for uninstall. The container has no
      # service manager, so install.sh registered nothing there and a removal has
      # no service to remove. Here launchd exists: install.sh bootstrapped
      # com.lucidos.gateway.default with KeepAlive, so a data-safe uninstall must
      # boot it out and delete its plist, and this job asserts exactly that. It is
      # also the only leg where "uninstall actually stops the thing" is testable,
      # because remove_instance stops the embedded runtime only when it really did
      # unregister a service.
      #
      # SECOND MACOS DIFFERENCE: /bin/sh here is bash, not dash, so a piped
      # uninstall does NOT take uninstall.sh's re-exec branch. The Linux leg is
      # what covers that branch; this leg covers the launchd one.
      - name: Verify the front door can uninstall what it installed
        if: env.FD_MODE == 'full'
        shell: bash
        run: |
          set -uo pipefail

          # install.sh's defaults: this job passes no --prefix and no --name, so
          # the slug is `default` and everything hangs off $HOME/.lucidos. The
          # plist path is service_launchd_plist_path("$HOME", default).
          prefix="$HOME/.lucidos"
          slug="default"
          data="$prefix/$slug"
          runtime="$prefix/runtime"
          marker="$data/port"
          plist="$HOME/Library/LaunchAgents/$GW_LAUNCHD_LABEL.plist"
          target="gui/$(id -u)/$GW_LAUNCHD_LABEL"

          # ── rung 5's precondition: WAIT FOR THE INSTANCE TO BE DISCOVERABLE ───
          # HEALTH IS NOT THE INSTALLER'S FINISH LINE ON THE LAUNCHD PATH, and
          # every rung below depends on the part that comes after it. The
          # previous step returns the moment the gateway answers /health, which
          # is a statement about the gateway, not about install.sh.
          #
          # install.sh's register_service bootstraps the LaunchAgent FIRST and
          # calls record_instance_port SECOND, deliberately, so that a
          # registration which dies leaves no marker claiming the instance was
          # installed. launchd starts the gateway as soon as it accepts the
          # bootstrap, while register_launchd keeps going: it does not return
          # until launchctl has CONFIRMED the job is loaded, and that path runs
          # a `kickstart -k` over a gateway which ignores SIGTERM (so launchd
          # has to wait out its ExitTimeOut) before a `launchctl print` state
          # check. The gateway is racing that confirmation to the health
          # endpoint, and it can win.
          #
          # service_list_instance_names keys on <prefix>/<slug>/port and NOTHING
          # else, so inside that window the instance is invisible: --list reports
          # none, resolve_targets resolves no targets, and rungs 5, 6, 7 and 8
          # all fail off the one missing file. That is exactly what separated two
          # runs of this leg 22 minutes apart on 2026-08-04: identical rungs 1-4
          # (all six routes shell, preflight 206, gateway healthy, frontend 200)
          # and one differing log line, "the installer process had already
          # exited" on the green one against "was still running" on the red,
          # which then lost all four uninstall rungs. Do not "simplify" this wait
          # away: the health step passing is not evidence the marker is on disk.
          #
          # THIS IS NOT THE LINUX JOB'S FAST-FAIL, and the health poll's warning
          # against copying that one back here still stands in full. That check
          # ABORTS because the installer exited; this one only stops WAITING,
          # because a marker still absent once install.sh is gone is never going
          # to appear. An exited installer remains the successful launchd shape,
          # and the verdict below is about the marker, never about the process.
          # The gate test's "no installer-exited fast-fail" assertion is scoped
          # to the health step, which is the step that must not have one.
          #
          # THE LINUX JOB HAS NO TWIN OF THIS WAIT, and does not need one: the
          # ordering there is INVERTED, not merely faster. That container has no
          # service manager, so install.sh degrades to launch_runtime, which
          # calls record_instance_port BEFORE an `exec` that never returns. The
          # marker is therefore on disk before the process that answers health
          # has even started, which is a happens-before and not a race won on
          # timing. Copy this wait over there only if that job ever gains a
          # service manager.
          echo "Waiting for the port marker $marker (timeout ${FD_MARKER_WAIT_SECS}s)…"
          marker_deadline=$(( $(date +%s) + FD_MARKER_WAIT_SECS ))
          while [ ! -f "$marker" ]; do
            # Unquoted-default deliberately absent, same reasoning as the health
            # poll: `kill -0 0` targets the whole process group and always
            # succeeds, so a `${INSTALL_PID:-0}` fallback would silently disable
            # this. `set -u` is the right failure; the launch step shares this
            # step's `FD_MODE == 'full'` guard, so it always ran first.
            if ! kill -0 "$INSTALL_PID" 2>/dev/null; then
              # One more look: the marker can land between the loop test above
              # and this check.
              [ -f "$marker" ] && break
              echo "::error::the port marker $marker was NEVER written and the installer (pid $INSTALL_PID) has exited, so it never will be. service_list_instance_names keys on that file and nothing else, so this instance is invisible to --list, resolve_targets resolves no targets, and run_uninstall would return before purging. This is an INSTALLER defect in record_instance_port (register_service must write the marker after register_launchd, and launch_runtime before its exec), NOT a harness race and NOT an origin regression."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$marker_deadline" ]; then
              echo "::error::HARNESS BUDGET, not a product failure: $marker had still not appeared after ${FD_MARKER_WAIT_SECS}s and the installer (pid $INSTALL_PID) is STILL RUNNING. install.sh writes that marker right after a launchd registration it has evidently not finished, so rungs 5-8 would now fail on an instance that is merely not discoverable YET. Raise FD_MARKER_WAIT_SECS on this job; it fits inside the slack timeout-minutes already carries. Do NOT read this as a record_instance_port defect, which is the OTHER error this wait can print."
              exit 1
            fi
            sleep "$FD_MARKER_POLL_SECS"
          done
          echo "    OK  the instance is discoverable: $marker records port $(tr -d ' \t\r\n' < "$marker" 2>/dev/null)"

          fail=0
          HTML_PAYLOAD_RE='DOCTYPE|syntax error near|syntax error:'

          # marker_diagnosis: called by a rung that could not see the instance, to
          # say whether DISCOVERY is what failed. It reports; it deliberately does
          # not attribute, and that restraint is the point.
          #
          # THIS ANNOTATION CAUSED A REAL MISDIAGNOSIS ON 2026-08-04. It used to
          # offer exactly two explanations, an INSTALLER defect in
          # record_instance_port or an origin regression, and the actual cause was
          # a third one it did not name: this step reached rung 5 while install.sh
          # was still mid-registration, so the marker was not written YET.
          # install.sh does record it on the launchd shape. It does so after
          # register_launchd returns, deliberately, so that a registration which
          # dies leaves no marker. A reader following the old text went hunting
          # for a bug in record_instance_port that was never there.
          #
          # That case cannot reach this function at all any more. The wait at the
          # top of this step blocks rung 5 until the marker exists, and it is now
          # where the never-written verdict gets made, in its OWN two errors: the
          # installer exited without writing it (a real record_instance_port
          # regression) against the deadline expiring with the installer still
          # running (a harness budget). Those two are the ones that can genuinely
          # fire for a marker that was never there, so send the reader to them
          # rather than repeating a verdict this line is no longer entitled to.
          #
          # What is left for the error branch below is genuinely stranger: the
          # marker was OBSERVED and then vanished mid-step. Name that, and name
          # what fits it, instead of blaming a write that demonstrably happened.
          marker_diagnosis() {
            if [ -f "$marker" ]; then
              echo "    (the port marker $marker is still here, so discovery is not what failed: the cause is in the rung's own output below)"
              return 0
            fi
            echo "::error::the port marker $marker is GONE, and it EXISTED when this step began: the wait above blocks rung 5 until it does. service_list_instance_names keys on that file and nothing else, so from this point the instance is invisible to --list, resolve_targets resolves no targets, and run_uninstall returns before purging. Something removed it DURING these rungs, so suspect the rungs themselves first: a data-safe rung 7 (no --purge) promises to keep the instance data dir AND this marker, which is exactly what leaves rung 8 a target to purge. Do NOT read this as install.sh failing to write the marker. That case cannot reach this line, and its verdict, installer defect against harness budget, is made by the wait's own two errors at the top of this step."
          }

          # assert_uninstaller_ran <label> <log> <status>: the floor every rung
          # shares. `curl -f` cannot see a soft-404, so check the OUTPUT.
          assert_uninstaller_ran() {
            local label="$1" log="$2" st="$3" bad=0
            if grep -qiE "$HTML_PAYLOAD_RE" "$log" 2>/dev/null; then
              echo "::error::$label executed a NON-SHELL payload: the origin answered a script path with HTML at status 200 (soft 404) and the shell tried to run it."
              grep -inE "$HTML_PAYLOAD_RE" "$log" | head -n 5 | sed 's/^/      /'
              bad=1
            fi
            if ! grep -q 'Lucidos uninstaller' "$log" 2>/dev/null; then
              echo "::error::$label never reached uninstall.sh: its 'Lucidos uninstaller' banner is absent from the output, so nothing about the advertised uninstall path was exercised."
              bad=1
            fi
            if [ "$st" != "0" ]; then
              echo "::error::$label exited $st"
              bad=1
            fi
            if [ "$bad" -ne 0 ]; then
              echo "--- $label output (tail 40) ---"
              tail -n 40 "$log" 2>/dev/null || true
              return 1
            fi
            return 0
          }

          # assert_listed <label> <log>: do_list prints "<slug>  port <n>  <status>".
          assert_listed() {
            local label="$1" log="$2"
            if grep -qE "(^|[[:space:]])${slug}[[:space:]]+port[[:space:]]+[0-9]+" "$log"; then
              echo "    OK  $label lists instance '$slug'"
              return 0
            fi
            echo "::error::$label ran the uninstaller but did not list the instance this job just installed ('$slug' under $prefix)."
            marker_diagnosis
            echo "--- $label output (tail 20) ---"
            tail -n 20 "$log" 2>/dev/null || true
            return 1
          }

          # The origin is an ARGUMENT to every command below, never spliced into
          # the `sh -c` string, and the single quotes keeping "$0" unexpanded are
          # load-bearing. Same shape as the launch step, for the same reason.

          # ── rung 5: --list through the DELEGATION front door ──────────────────
          log5="$RUNNER_TEMP/uninstall-rung5.log"
          echo "==> rung 5: curl -fsSL $FRONT_DOOR/install.sh | sh -s -- --list"
          # shellcheck disable=SC2016
          sh -c 'curl -fsSL "$0/install.sh" | sh -s -- --list' "$FRONT_DOOR" > "$log5" 2>&1
          st5=$?
          if assert_uninstaller_ran "rung 5 (install.sh --list)" "$log5" "$st5"; then
            if grep -qF "$FRONT_DOOR/uninstall.sh" "$log5"; then
              echo "    OK  the delegation fetched $FRONT_DOOR/uninstall.sh"
            else
              echo "::error::rung 5: install.sh did not fetch the uninstaller from $FRONT_DOOR. Its baked LUCIDOS_INSTALL_URL points somewhere else, so a user's --uninstall would run another origin's uninstaller."
              grep -i 'uninstall' "$log5" | head -n 5 | sed 's/^/      /'
              fail=1
            fi
            assert_listed "rung 5 (install.sh --list)" "$log5" || fail=1
            # Only reachable on this leg: the instance is registered, so --list
            # must say so rather than reporting it stopped.
            #
            # This USED to convict instance_status outright, which is the same
            # closed-set mistake marker_diagnosis above was rewritten out of: the
            # agent's state is read here, not at rung 3, and the agent carries
            # KeepAlive, so a job that crashed out of the domain in between reads
            # identically from --list and is not a misreading of anything.
            #
            # So ask launchctl DIRECTLY, at the moment the rung disagrees, and
            # let the two answers name their own cause. A second opinion from a
            # different source taken microseconds later is what separates them;
            # the teardown's report cannot, because rung 7 boots the agent out
            # itself, so by then "nothing left behind" is the expected outcome on
            # every run and says nothing about what rung 5 saw.
            if grep -q 'launchd loaded' "$log5"; then
              echo "    OK  rung 5 reports the launchd agent as loaded"
            else
              if launchctl print "$target" >/dev/null 2>&1; then
                echo "::error::rung 5: --list did not report instance '$slug' as '(launchd loaded)', but launchctl says $GW_LAUNCHD_LABEL IS bootstrapped at $target right now. The agent is fine and the report is wrong, so instance_status is misreading launchd state."
              else
                echo "::error::rung 5: --list did not report instance '$slug' as '(launchd loaded)', and launchctl agrees: $GW_LAUNCHD_LABEL is NOT bootstrapped at $target. instance_status reported the truth, so the fault is upstream of it. install.sh bootstrapped this agent and the gateway answered health at rung 3, so it left the domain in between: look at the gateway logs under $data/logs and at whether KeepAlive was still restarting it."
              fi
              fail=1
            fi
          else
            fail=1
          fi

          # ── rung 6: --list through the DIRECT piped uninstaller ───────────────
          log6="$RUNNER_TEMP/uninstall-rung6.log"
          echo "==> rung 6: curl -fsSL $FRONT_DOOR/uninstall.sh | sh -s -- --list"
          # shellcheck disable=SC2016
          sh -c 'curl -fsSL "$0/uninstall.sh" | sh -s -- --list' "$FRONT_DOOR" > "$log6" 2>&1
          st6=$?
          if assert_uninstaller_ran "rung 6 (uninstall.sh --list)" "$log6" "$st6"; then
            assert_listed "rung 6 (uninstall.sh --list)" "$log6" || fail=1
          else
            fail=1
          fi

          # ── rung 7: DATA-SAFE removal (no --purge) ────────────────────────────
          # Two promises at once, and both are documented in uninstall.sh --help:
          # the SERVICE goes away, and the DATA does not.
          log7="$RUNNER_TEMP/uninstall-rung7.log"
          echo "==> rung 7: curl -fsSL $FRONT_DOOR/install.sh | sh -s -- --uninstall --all   (no --purge)"
          # shellcheck disable=SC2016
          sh -c 'curl -fsSL "$0/install.sh" | sh -s -- --uninstall --all' "$FRONT_DOOR" > "$log7" 2>&1
          st7=$?
          if assert_uninstaller_ran "rung 7 (install.sh --uninstall --all)" "$log7" "$st7"; then
            if launchctl print "$target" >/dev/null 2>&1; then
              echo "::error::rung 7: $GW_LAUNCHD_LABEL is STILL bootstrapped at $target after a data-safe uninstall. The agent carries KeepAlive, so a user who uninstalled would keep a gateway restarting forever."
              fail=1
            else
              echo "    OK  rung 7 booted out $GW_LAUNCHD_LABEL"
            fi
            if [ -e "$plist" ]; then
              echo "::error::rung 7: the LaunchAgent plist is still on disk at $plist, so the agent returns at the next login."
              fail=1
            else
              echo "    OK  rung 7 removed $plist"
            fi
            if [ -d "$data" ]; then
              echo "    OK  rung 7 kept the instance data at $data"
            else
              echo "::error::rung 7: a data-safe uninstall (no --purge) DELETED $data. uninstall.sh --help promises it leaves your data on disk, so purging without --purge is data loss."
              fail=1
            fi
          else
            fail=1
          fi

          # ── rung 8: --all --purge ─────────────────────────────────────────────
          log8="$RUNNER_TEMP/uninstall-rung8.log"
          echo "==> rung 8: curl -fsSL $FRONT_DOOR/uninstall.sh | sh -s -- --all --purge"
          # shellcheck disable=SC2016
          sh -c 'curl -fsSL "$0/uninstall.sh" | sh -s -- --all --purge' "$FRONT_DOOR" > "$log8" 2>&1
          st8=$?
          if assert_uninstaller_ran "rung 8 (uninstall.sh --all --purge)" "$log8" "$st8"; then
            left=0
            if [ -e "$data" ]; then
              echo "::error::rung 8: --all --purge left the instance data behind at $data"
              left=1
            fi
            if [ -e "$runtime" ]; then
              echo "::error::rung 8: --all --purge left the shared runtime behind at $runtime"
              left=1
            fi
            if [ "$left" -ne 0 ]; then
              marker_diagnosis
              echo "--- rung 8 output (tail 40) ---"
              tail -n 40 "$log8" 2>/dev/null || true
              fail=1
            else
              echo "    OK  rung 8 removed both $data and $runtime"
            fi
          else
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::the advertised uninstall paths do not work against $FRONT_DOOR (see the per-rung errors above)"
            exit 1
          fi
          echo "rungs 5-8 OK: --list through both front doors, a data-safe removal that unregistered $GW_LAUNCHD_LABEL and kept $data, and --all --purge that removed the data and the shared runtime."

      # The cause is always in this log; make it readable in the Actions output
      # rather than only in an artifact (this job has no checkout and uploads none).
      # Full mode only: payload mode never launches an installer, so there is no
      # log — and an unconditional dump would answer a rung-1 failure with a
      # misleading "(no installer log — it never started)".
      - name: Dump the installer log
        if: failure() && env.FD_MODE == 'full'
        shell: bash
        run: |
          echo "=== full installer log ==="
          cat "$RUNNER_TEMP/install.log" 2>/dev/null || echo "(no installer log — it never started)"

      # CLEANUP ONLY. THIS STEP IS NOT COVERAGE, and the distinction is the whole
      # reason it looks the way it does.
      #
      # Until 2026-07-30 this step WAS the file's only uninstall: it piped
      # `--uninstall --all --purge` from the origin behind a `|| true`, so it
      # could not red the job, and it carried a canary branch that printed "does
      # not serve uninstall.sh yet … Not a regression" whenever the origin
      # soft-404ed. That branch would have swallowed exactly the regression the
      # new rungs exist to catch. Both are gone. Uninstall is now asserted by
      # rungs 5-8 above, which CAN fail the job.
      #
      # What is left is the last-resort tidy-up, and it is still needed because
      # `if: always()` also covers the runs where an EARLIER rung failed and
      # rung 7 never executed. A successful registration leaves a LaunchAgent
      # with KeepAlive, so the gateway would restart forever, hold the port and
      # outlive the job; killing $INSTALL_PID does nothing about it, because the
      # installer process is not the gateway's parent in that shape.
      #
      # Do NOT re-add a piped uninstall here. On a rung-1 failure the origin is
      # exactly the thing that is broken, so piping it into `sh` would bury the
      # real diagnosis under a page of shell syntax errors while uninstalling
      # nothing. `launchctl bootout` needs no origin and cannot lie.
      #
      # Nothing here may red the job: a teardown failure would hide the real one,
      # and the runner is disposable either way.
      - name: Tear down (kill the installer, unregister any leftover launchd job)
        if: always() && env.FD_MODE == 'full'
        shell: bash
        run: |
          set -uo pipefail

          # Guard on a non-empty pid: a bare `kill 0` (which `${INSTALL_PID:-0}`
          # would expand to) signals this shell's entire process group, killing
          # the teardown step itself. In the launchd shape this pid is already
          # gone, which is fine, it is the foreground shape this catches.
          if [ -n "${INSTALL_PID:-}" ]; then
            kill "$INSTALL_PID" 2>/dev/null || true
          fi

          # On a green run rung 7 already booted this out, so finding work here
          # means an earlier rung failed. Not a ::warning:: on its own: the
          # failure that mattered has already been reported by the rung that
          # found it, and a second warning would only add noise to a red run. The
          # genuine teardown failure, a job that could not be removed at all,
          # keeps its warning below.
          target="gui/$(id -u)/$GW_LAUNCHD_LABEL"
          if launchctl print "$target" >/dev/null 2>&1; then
            echo "    $GW_LAUNCHD_LABEL is still bootstrapped (rungs 5-8 did not run, or did not get that far). Booting it out directly."
            launchctl bootout "$target" >/dev/null 2>&1 || true
          fi
          if launchctl print "$target" >/dev/null 2>&1; then
            echo "::warning::could not remove $GW_LAUNCHD_LABEL from $target; the runner is disposable so this is noted, not fatal"
          else
            echo "no launchd job left behind ($GW_LAUNCHD_LABEL)"
          fi

  # ── FRONT-DOOR ROUTE PARITY (production vs the release candidate) ────────────
  # THE ONLY JOB IN THIS FILE THAT LOOKS AT BOTH ORIGINS. Read that before
  # folding it into `front-door`, which is where it superficially belongs.
  #
  # A *publish route* is any path a piped run curls back from its own origin and
  # executes: `/install.sh`, `/uninstall.sh`, and every `/scripts/lib/*.sh` the
  # two of them source. The site publisher decides that set TWICE, in a
  # route-discovery path for production and a separate one for the release
  # candidate, and the two can drift.
  #
  # On 2026-07-30 they did. `/uninstall.sh` became a published route and only
  # the production path learned about it. Nothing noticed until the rc/0.18.0
  # push the next morning, when all three `front-door (rc, payload only)` legs
  # failed on `could not fetch https://rc.lucidos.dev/uninstall.sh`. One
  # omission, reported three times, on release morning.
  #
  # WHY NO EXISTING JOB CATCHES IT EARLIER, and why a better rung 1 would not
  # help: rung 1 is already correct. It derives the checked route list from the
  # served installer rather than hardcoding it, and it DID fail on the missing
  # route. Its limit is structural, not a bug: `FRONT_DOOR` holds one origin per
  # run, so no amount of care inside a single-origin job can see that the OTHER
  # origin serves a different set. Only a job that fetches both can, which is
  # this one.
  #
  # TRIGGERS: the daily cron and a dispatch. DELIBERATELY NOT the rc/** push.
  # The divergence exists from the moment the publisher's two paths differ, so
  # the daily cron names it within a day, independent of any release; the rc
  # push is the LATEST possible moment (it is exactly where the 2026-07-30
  # omission surfaced), the RC leg already reds there, and a fourth red on
  # release morning is noise. It would also red falsely: a candidate that ADDS a
  # route legitimately leads production until publish.
  #
  # SEVERITY IS ASYMMETRIC AND THAT IS THE DESIGN, not an inconsistency:
  #
  #   production serves it, the candidate does not  -> FATAL. The 2026-07-30
  #       shape. Always wrong, always actionable now.
  #   the candidate serves it, production does not  -> WARNING. Expected while a
  #       candidate that adds a route is in flight. Failing would red this cron
  #       through every such release window, and it does not go unguarded: at
  #       publish, production's own served installer starts declaring the route
  #       and `front-door` rung 1 reds fatally on it.
  #   neither serves it                             -> WARNING. Both front doors
  #       are broken, which is `front-door`'s verdict to give, and that job runs
  #       against production in this same daily run. A second red adds nothing.
  #
  # THIS JOB CHECKS OUT THE REPO AND `front-door` MUST NOT, which is not an
  # inconsistency either. That rule keeps the SUBJECT of the test honest:
  # front-door's entire input has to be what the origin serves. Here the tree is
  # the measuring instrument, never the subject. `front_door_parity.sh` derives
  # each origin's route set from THAT ORIGIN'S own served scripts and reads
  # nothing about routes from the checkout. What the checkout buys is real:
  # ShellCheck coverage through `make lint`, a hermetic offline test
  # (`front_door_parity_test.sh`, which also pins the scrape against the tree's
  # actual install.sh), one definition of the derivation instead of a third copy
  # of bash inside a YAML string, and a command the maintainer can run by hand
  # to confirm a publisher fix without waiting for a cron.
  #
  # The origins are the harness's own constants rather than the `origin`
  # dispatch input: this job's subject IS that specific pair, and taking no URL
  # from the event means there is no hostile input to validate. It also never
  # pipes anything into a shell, it only sniffs, which is why it does not need
  # front-door's validate-and-rename dance.
  front-door-parity:
    name: front-door route parity (production vs rc)
    # Public mirror only (see the smoke job's repo guard). Dispatch and the
    # DAILY cron. The `github.event.schedule` guard is not optional: a schedule
    # trigger fires the whole workflow, so a job without it would silently drag
    # itself into the weekly run too.
    if: >-
      github.repository == 'lucidos-dev/lucidos'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'schedule'
              && github.event.schedule == '0 6 * * *'))
      && inputs.dmg_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `contents: read` rather than front-door's `{}`, and only because this job
    # checks the harness out. It still executes nothing it fetches.
    permissions:
      contents: read
    env:
      # The RC origin sits behind Cloudflare Access. Without the service token
      # every fetch of it answers 302 to a login page, every route sniffs as
      # "not shell", and the run would report a total divergence whose real
      # cause is a missing secret. The harness refuses up front rather than
      # producing that diagnosis.
      RC_ACCESS_CLIENT_ID: ${{ secrets.RC_ACCESS_CLIENT_ID }}
      RC_ACCESS_CLIENT_SECRET: ${{ secrets.RC_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout (the harness only; the route sets come from the origins)
        uses: actions/checkout@v4

      - name: Both front doors serve the same publish routes
        shell: bash
        run: ./scripts/lib/front_door_parity.sh
