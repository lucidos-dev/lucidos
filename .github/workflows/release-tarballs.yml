# Build the per-platform HEADLESS runtime tarballs (the Docker-free, compile-free
# download artifact a later install.sh lays down — step 2 of
# docs/plans/2026-06-30-installer-step2-linux-tarball.md).
#
# Each matrix entry runs scripts/build-headless.sh on a NATIVE runner for its target
# triple (the engine/gateway + pgvector are compiled natively, not cross-compiled),
# producing lucidos-<version>-<triple>.tar.gz + a .sha256 sidecar and uploading them
# as WORKFLOW ARTIFACTS. The macOS PG18 + pgvector recipe and the Linux one are the
# same scripts/lib/stage_runtime.sh code; the triple selects the theseus relocatable
# Postgres asset.
#
# WHAT THIS WORKFLOW DOES NOT DO, it never creates or tags a Release:
#   • It NEVER creates a GitHub Release and NEVER cuts a tag.
#   • The attach step only ADDS assets to a Release that ALREADY exists, and
#     that Release is normally still a DRAFT when this runs.
#
# THE TAG PUSH IS WHAT ATTACHES (2026-08-04). release-to-lucidos.sh pushes the
# v<version> tag, creates the Release as a DRAFT, and then WAITS for the assets
# this run produces before flipping it public, so a release is COMPLETE at the
# moment it becomes visible. Two ways into the attach step: the v* tag push (the
# real one), and workflow_dispatch with attach_to_release=true (the backfill).
#
# There used to be a THIRD way in, `release: types: [published]`, and removing
# it is half of the fix. It built the same four tarballs a second time from a
# run that started two seconds after the tag-push one (v0.21.0: runs
# 30926097107 and 30926100020), and it can no longer serve any purpose here:
# a DRAFT release fires no webhook at all, so it would not start the build, and
# publishing the draft at the END would start a whole second 35-minute build
# that re-attached over files already there.
#
# Supported pair (parent plan): macOS arm64 + Linux x86_64. macOS x86_64 and Linux
# aarch64 are best-effort. x86_64-unknown-linux-gnu is the MUST-WORK entry;
# fail-fast is off so a best-effort entry can fail without sinking the rest.
#
# GLIBC FLOOR (docs/plans/2026-07-01-linux-prod-install-audit-fixes.md): the Linux
# entries build INSIDE an ubuntu:22.04 container, NOT on the runner image. A binary
# compiled on the raw ubuntu-latest image (24.04, glibc 2.39) refuses to start on
# Ubuntu 22.04 / Debian 12 / RHEL 9 ("GLIBC_2.3x not found") — i.e. on most current
# LTS servers — and the tarball-smoke job can't see that because it builds and runs
# on the same image. The container pins the floor at glibc 2.35 / GCC-12 libstdc++
# durably (runner images get retired; the container tag doesn't move under us), and
# the "Assert portability floor" step fails the build if any staged binary ever
# references a versioned symbol above that floor.
#
# macOS note: these tarballs are UNSIGNED (no Developer ID on the runner) — and they
# ARE what a Mac's `curl … | sh` downloads. build-dmg.sh uploads only the DMG +
# Lucidos.app.tar.gz + .sig + latest.json, and release.sh never passes
# --emit-tarball, so the local SIGNED headless tarball is a capability nothing
# attaches. Acceptable, not accidental: a curl-fetched file gets no
# com.apple.quarantine xattr, so Gatekeeper never assesses the runtime (the same
# reasoning ADR 0027 uses to defer notarization), and install.sh's
# verify_runtime_executes runs the gateway once at install time so any refusal is
# loud. Wire --emit-tarball into the release flow if that ever stops holding.

name: release-tarballs

on:
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'Also attach the tarballs to an EXISTING GitHub Release (the backfill path). Default off, and it never creates a Release.'
        type: boolean
        default: false
      attach_tag:
        description: 'Release tag to attach to (e.g. v0.15.0). Empty = use the dispatched ref, which must then BE a tag. Set it to backfill a release whose own run failed or attached nothing.'
        type: string
        default: ''
  # THE REAL TRIGGER. A v* tag push builds all four tarballs and attaches them to
  # the Release carrying that tag, which at that point is still a DRAFT: this is
  # what lets release-to-lucidos.sh publish a release that is already complete.
  #
  # Workflows run from the version of the file at the PUSHED REF, so the tag's
  # own tree decides what this does. That is why the attaching behaviour takes
  # effect on the very release that ships it, rather than one release later.
  #
  # `rc-<version>` never reaches this arm: the RC flow pushes a BRANCH
  # (rc/<version>) and creates the rc-<version> draft prerelease, and pushes no
  # v* tag at all. The attach step re-checks anyway (see its two refusals).
  push:
    tags: ['v*']

permissions:
  # `contents: write` is needed ONLY by the gated attach-to-release step below;
  # nothing writes to the repo/releases unless that opt-in step runs.
  #
  # It is load-bearing for READING too, which is easy to miss: GitHub lists
  # DRAFT releases only to a token with push access, and the release this step
  # attaches to is a draft. A `contents: read` token would see an empty listing
  # and the step would report "no release carries this tag". That is the same
  # trap ADR 0036 documents for dmg-verify and the rc draft.
  contents: write

jobs:
  tarball:
    name: ${{ matrix.triple }}
    # Public mirror ONLY: the same guard install-smoke.yml puts on every job.
    #
    # This workflow lives in BOTH repos (the private development repo and the
    # public lucidos-dev/lucidos mirror), and a release pushes the v* tag to both.
    # Without this guard the full 4-way matrix ran TWICE per release: once free in
    # the public mirror, and once BILLED against the private repo's 2000-minute
    # free tier, where two of the four entries are macOS at the 10x multiplier
    # (~590 multiplied minutes per release, i.e. the allowance covers ~3.4
    # releases/month). That second copy is pure waste. It uploads workflow
    # artifacts nobody consumes, and its attach step can never fire because the
    # private repo has no Releases at all. It exhausted the account's minutes on
    # 2026-08-04. Public repos get unlimited free minutes on every runner, so the
    # mirror's copy (the one that actually attaches assets to the Release) is the
    # only one that needs to exist.
    if: github.repository == 'lucidos-dev/lucidos'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The MUST-WORK entry: the Linux x86_64 tarball install.sh downloads.
          # Linux entries build inside ubuntu:22.04 → glibc 2.35 floor (see header).
          - { runner: ubuntu-latest,    triple: x86_64-unknown-linux-gnu,  container: 'ubuntu:22.04' }
          # Best-effort additions (parent plan):
          - { runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu, container: 'ubuntu:22.04' }
          # aarch64-darwin needs the macos-15 (Apple-silicon) image, not macos-14:
          # the theseus-rs relocatable PG 18 arm64 binary is built against macOS 26
          # libSystem (references _strchrnul), which the older macos-14 runner OS
          # lacks — so pg_config won't even run there and staging aborts.
          - { runner: macos-15,         triple: aarch64-apple-darwin }
          - { runner: macos-15-intel,   triple: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    # Empty for the macOS entries → no container, runs on the VM as before.
    container: ${{ matrix.container }}
    # Force bash for every `run` step. Inside the ubuntu:22.04 container GitHub
    # otherwise invokes steps with `sh -e {0}` (dash), which does NOT support the
    # `set -o pipefail` our steps rely on ("set: Illegal option -o pipefail",
    # exit 2). bash ships in the ubuntu:22.04 base image and on the macOS runners,
    # so this resolves everywhere and gives us `-o pipefail` consistently.
    defaults:
      run:
        shell: bash
    timeout-minutes: 75   # container entries pay a cold rustup + apt install on top of the build
    steps:
      # pgvector compiles against the relocatable PG via PGXS (needs make + a C
      # toolchain); the engine statically vendors OpenSSL (needs perl + cc); the
      # staging scripts need python3 (version/sha256 helpers) + curl + tar; and
      # actions/checkout needs git INSIDE the container (this step runs before it —
      # the container starts as root, so no sudo). macOS gets all of these from the
      # preinstalled Xcode Command Line Tools (clang, make, xcrun) + runner image.
      - name: Install Linux build deps (ubuntu:22.04 container)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential perl pkg-config curl ca-certificates git python3 binutils
          git --version && python3 --version

      # The ubuntu:22.04 container has no Rust toolchain (the preinstalled one lives
      # on the runner image, outside the container). Install rustup ITSELF with no
      # toolchain: this step runs BEFORE checkout, so rust-toolchain.toml isn't on
      # disk yet, and installing `stable` here would download a toolchain that the
      # pin then discards — cargo would fetch the pinned one on its first
      # invocation anyway. `--default-toolchain none` means exactly one toolchain
      # is ever downloaded, and it is the pinned one.
      - name: Install rustup (container; toolchain comes from rust-toolchain.toml)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # install.sh requires Node 18+; 20 is the current LTS

      - name: Toolchain versions
        run: |
          set -euo pipefail
          # First cargo/rustc call after checkout, so this is where rustup
          # materialises the toolchain pinned by rust-toolchain.toml — on the
          # Linux container (which has rustup but no toolchain) and on the macOS
          # runners (which ship a preinstalled stable that the pin overrides).
          # Printing the active toolchain makes a pin bump visible in the log.
          rustup show active-toolchain
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Build headless tarball (${{ matrix.triple }})
        run: |
          set -euo pipefail
          ./scripts/build-headless.sh --triple "${{ matrix.triple }}" --out-dir dist/headless
          echo "--- artifacts:"
          ls -la dist/headless
          echo "--- checksum self-verify:"
          ( cd dist/headless && shasum -a 256 -c ./*.tar.gz.sha256 )

      # Fail the build — not the user's install — if any of OUR three staged
      # binaries references a versioned glibc/libstdc++ symbol above the
      # ubuntu:22.04 floor (glibc 2.35, GCC-12 libstdc++ = GLIBCXX 3.4.30 /
      # CXXABI 1.3.13). This is the tripwire for a container-tag bump, a
      # toolchain drift, or someone reverting the container build: the staged
      # tree is exactly what headless_tarball_emit ships. The bundled theseus
      # postgres/ binaries are deliberately NOT asserted — they're prebuilt
      # upstream artifacts with their own (older) baseline, not our compile.
      - name: Assert portability floor (glibc ≤ 2.35, Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          stage=".lucidos/headless-build/${{ matrix.triple }}/stage"
          # ceiling_check <binary> <prefix> <ceiling> — the highest PREFIX_x.y[.z]
          # symbol version the binary references must sort at-or-below CEILING.
          ceiling_check() {
            local bin="$1" prefix="$2" ceiling="$3" worst
            worst="$(objdump -T "$bin" | grep -oE "${prefix}_[0-9]+(\.[0-9]+)*" | sort -uV | tail -1 || true)"
            [ -n "$worst" ] || { echo "  $bin: no ${prefix}_* refs"; return 0; }
            if printf '%s\n%s\n' "$worst" "${prefix}_${ceiling}" | sort -VC; then
              echo "  $bin: ${prefix} ceiling OK ($worst <= ${prefix}_${ceiling})"
            else
              echo "::error::$bin references $worst — above the ${prefix}_${ceiling} floor; it will not start on Ubuntu 22.04-era distros. Did the build escape the ubuntu:22.04 container?"
              return 1
            fi
          }
          for name in lucidos-engine lucidos-gateway lucidos; do
            bin="$stage/$name"
            [ -f "$bin" ] || { echo "::error::staged binary missing: $bin"; exit 1; }
            ceiling_check "$bin" GLIBC 2.35
            ceiling_check "$bin" GLIBCXX 3.4.30
            ceiling_check "$bin" CXXABI 1.3.13
          done
          echo "OK — all staged binaries respect the ubuntu:22.04 portability floor."

      - name: Upload tarball + checksum as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucidos-tarball-${{ matrix.triple }}
          path: |
            dist/headless/*.tar.gz
            dist/headless/*.tar.gz.sha256
          if-no-files-found: error

      # ── ATTACH TO THE RELEASE FOR THIS TAG, DRAFT OR PUBLISHED ────────────────
      # This is the step the whole ordering turns on. The Release exists (
      # release-to-lucidos.sh created it seconds after pushing the tag) and is
      # still a DRAFT, waiting for exactly these assets before it goes public.
      #
      # Two ways in: the v* tag push (the real one), and workflow_dispatch with
      # attach_to_release=true (the backfill, used when a run failed or attached
      # nothing). It only ADDS assets to a Release someone already cut, and it
      # never publishes or tags one: the publish is release-to-lucidos.sh's, once
      # it has seen every asset land.
      #
      # Upload is done via the raw GitHub REST API (curl), NOT `gh release upload`,
      # because the Linux matrix entries run inside the ubuntu:22.04 container which
      # has no `gh` CLI (only the macOS runner images ship it). curl works on BOTH
      # the container and the macOS runners.
      - name: Attach tarballs to the release for this tag
        # 1. push of a v* tag -> the release flow. GITHUB_REF_NAME is the tag.
        # 2. workflow_dispatch with attach_to_release=true -> the backfill. The
        #    target tag comes from inputs.attach_tag, else the dispatched ref
        #    (which must then be a tag). attach_tag lets a branch carrying a CI
        #    fix attach to a tag whose own tree predates that fix.
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'workflow_dispatch'
              && inputs.attach_to_release == true
              && (inputs.attach_tag != '' || startsWith(github.ref, 'refs/tags/')))
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.attach_tag }}
        run: |
          set -euo pipefail
          # Resolve which Release to attach to: the explicit dispatch input, else
          # the pushed or dispatched tag ref.
          attach_tag="${INPUT_TAG:-}"
          [ -n "$attach_tag" ] || attach_tag="${GITHUB_REF_NAME}"
          [ -n "$attach_tag" ] || { echo "::error::no target tag resolved"; exit 1; }

          # REFUSAL 1: never a release candidate. The RC flow pushes a branch and
          # creates an rc-<version> draft PRERELEASE carrying only the DMG + the
          # updater .sig; the headless tarballs belong to GA releases. The tag-push
          # arm cannot reach an rc (no v* tag is ever pushed for one), so this
          # guards the dispatch path, where a hand-typed attach_tag could.
          case "$attach_tag" in
            rc-*)
              echo "::error::refusing to attach GA platform tarballs to '${attach_tag}': rc-* is a release-candidate draft, gated by dmg-verify, and it must not carry install.sh's download artifacts."
              exit 1
              ;;
          esac

          echo "Attaching $(ls dist/headless/*.tar.gz) to the release for ${attach_tag}"
          api="https://api.github.com"; up="https://uploads.github.com"

          # ── find the release, INCLUDING A DRAFT ─────────────────────────────
          # GET /releases/tags/<tag> cannot see a draft: a draft has no tag ref,
          # so that endpoint 404s for exactly the release this step now targets.
          # The only listing that includes drafts is GET /releases (and only for
          # a token with push access, which is what `permissions: contents: write`
          # at the top of this file buys). Paged, because the mirror already
          # carries 30+ releases and the newest is not guaranteed to be page one
          # forever.
          #
          # Exit codes: 0 found (prints "<id> <draft> <prerelease>"), 1 no such
          # tag, 3 the API answered something unusable. 1 is retried, 3 is fatal.
          find_release() {
            FIND_REPO="${GITHUB_REPOSITORY}" FIND_TAG="$1" python3 -c '
          import json, os, sys, urllib.error, urllib.request

          repo = os.environ["FIND_REPO"]
          tag = os.environ["FIND_TAG"]
          token = os.environ["GH_TOKEN"]

          def get(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer %s" % token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          for page in range(1, 11):
              url = "https://api.github.com/repos/%s/releases?per_page=100&page=%d" % (repo, page)
              try:
                  releases = get(url)
              except urllib.error.URLError as exc:
                  sys.stderr.write("could not list releases: %s\n" % exc)
                  sys.exit(3)
              if not isinstance(releases, list):
                  sys.stderr.write("the releases listing is not an array\n")
                  sys.exit(3)
              if not releases:
                  break
              for rel in releases:
                  if not isinstance(rel, dict) or rel.get("tag_name") != tag:
                      continue
                  if not isinstance(rel.get("id"), int):
                      sys.stderr.write("the release for %s has no numeric id\n" % tag)
                      sys.exit(3)
                  print("%d %s %s" % (rel["id"],
                                      str(bool(rel.get("draft"))).lower(),
                                      str(bool(rel.get("prerelease"))).lower()))
                  sys.exit(0)
          sys.exit(1)
          '
          }

          # The draft is created moments AFTER the tag push that started this run,
          # and this step runs at the END of a 10 to 35 minute build, so it is
          # always there by now. The bounded retry is for the pathological case
          # (a slow or retried `gh release create`), and it FAILS rather than
          # skipping: a green run that attached nothing is exactly what makes a
          # release look finished when it is not.
          rel=""
          rel_deadline=$(( $(date +%s) + 300 ))
          while : ; do
            set +e
            rel="$(find_release "$attach_tag")"
            rc=$?
            set -e
            [ "$rc" -eq 0 ] && break
            if [ "$rc" -ne 1 ]; then
              echo "::error::could not read the release listing for ${attach_tag} (see above). Refusing to guess which release to attach to."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$rel_deadline" ]; then
              echo "::error::no GitHub Release carries the tag ${attach_tag}, draft or published, after 300s of looking. The tarballs are built and uploaded as workflow artifacts, but nothing was attached. If the release exists now, backfill with: gh workflow run release-tarballs.yml --ref ${attach_tag} -f attach_to_release=true -f attach_tag=${attach_tag}"
              exit 1
            fi
            echo "no release for ${attach_tag} yet; retrying in 15s"
            sleep 15
          done
          rel_id="${rel%% *}"
          rel_rest="${rel#* }"
          rel_draft="${rel_rest%% *}"
          rel_prerelease="${rel_rest##* }"

          # REFUSAL 2: the same rule as refusal 1, asked of the RELEASE rather
          # than of its name, so a prerelease under any tag is still refused.
          if [ "$rel_prerelease" = "true" ]; then
            echo "::error::${attach_tag} is a PRERELEASE. The per-platform tarballs are install.sh's download artifacts and belong to GA releases only."
            exit 1
          fi
          echo "release id = $rel_id (draft=$rel_draft, prerelease=$rel_prerelease)"
          for f in dist/headless/*.tar.gz dist/headless/*.tar.gz.sha256; do
            base=$(basename "$f")
            # delete any existing asset with the same name (clobber)
            existing=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$api/repos/${GITHUB_REPOSITORY}/releases/$rel_id/assets" | \
              python3 -c "import sys,json;[print(a['id']) for a in json.load(sys.stdin) if a['name']=='$base']")
            for aid in $existing; do
              curl -sS -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                "$api/repos/${GITHUB_REPOSITORY}/releases/assets/$aid" >/dev/null
            done
            echo "uploading $base"
            curl -sS --fail -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/gzip" \
              --data-binary @"$f" \
              "$up/repos/${GITHUB_REPOSITORY}/releases/$rel_id/assets?name=$base" >/dev/null \
              && echo "  ok $base"
          done
