# Development mode: PostgreSQL with pgvector in Docker, engine runs natively on macOS
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cognos-pg-${COGNOS_PG_NAME:-default}
    ports:
      - "${COGNOS_PG_PORT:-5432}:5432"
    volumes:
      - ${COGNOS_WORKSPACE:-./workspace}/data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=cognos
      - POSTGRES_PASSWORD=cognos
      - POSTGRES_DB=cognos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognos"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "no"
