# The 40 seeded memory entries, as data rather than as vectors.
#
# ADR 0087 seeds roughly 40 fixture entries so the control arm's memory recall
# has something to return in the early threads. A workspace built from scratch
# has none, and the arms would then be identical exactly where the comparison
# starts.
#
# Two rules bind every row here.
#
# **Nothing may touch the eval's own facts.** The fact register (F01 to F23) is
# what the probes measure, so a seeded row naming a report convention, a
# threshold, a timezone or a collector would hand the lean arm the answer
# through a channel the eval is not measuring. Every row below is about
# something else entirely.
#
# **The vectors are generated, never written by hand.** Run
# `cargo run -p lucidos-eval --features fixture-gen -- generate-memory-fixture`
# to embed these summaries with the pinned embedding model and rewrite the
# generated block in `seed.sql`. Commit the result. The vectors are checked in
# so the digest is reproducible and no run re-embeds anything.

embedding_model = "multilingual-e5-small"
extractor_version = 1

