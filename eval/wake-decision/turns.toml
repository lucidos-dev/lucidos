# The wake decision check's labelled set (`lucidos-eval wake-decision`).
#
# Every case is synthetic, with placeholder names and paths, because this file
# ships publicly. Each reaches the gate's call in the shape the engine builds
# it at a child's turn end: the message that opened the child's turn, the
# parent's latest reply, the child's reply, its finish, and how many of the
# parent's other children still run.
#
# - message: the message that opened the child's turn, usually the parent's
#   spawn message.
# - source: absent means `agent` (the parent wrote the message). `user` means
#   the user wrote in the child thread itself.
# - status: `success` or `no-changes`. The gate wakes on every other finish
#   without a call, so the set holds only these two.
# - label: `must-wake` when the parent must act now, `file` when it can read
#   the report on its next turn.
# - kind: the case's shape, for the per-kind breakdown.
#
# A wrong `file` is the costly error: the parent then waits for a wake that
# never comes.

