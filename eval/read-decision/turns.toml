# The read decision check's labelled set (`lucidos-eval read-decision`).
#
# Every turn is synthetic, with placeholder names and paths, because this file
# ships publicly. Each reaches the forced call in the shape the turn-end gate
# builds it: what opened the turn, an optional question the user answered
# inside it, the reply, and what the thread still waits on.
#
# - source: user, child-report, trigger or agent.
# - report_wakes_parent: true when the turn's report wakes the parent agent,
#   which then acts on it (ADR 0446). Defaults to false.
# - read: true when the user should read the reply, false when not.
# - kind: the turn's shape, for the per-kind breakdown.
#
# The noise kinds follow the forced yeses sampled in the plan
# `docs/plans/2026-10-11-read-decision-sees-the-answer-and-a-measured-model.md`.

# --- must read --------------------------------------------------------------

[[turn]]
kind = "answer"
source = "user"
message = "Why does the nightly backup fail on Sundays?"
reply = """
It fails because the Sunday run overlaps the weekly database vacuum. Both lock the same table, and the backup times out after 10 minutes.

- **Cause:** the vacuum starts at 03:00 on Sundays, the backup at 03:05.
- **Evidence:** all four failed runs logged a lock timeout on `events`.
- **Fix options:** move the backup to 04:00, or raise its lock timeout to 30 minutes.
"""
read = true

