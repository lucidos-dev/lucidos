         `<base href="/<slug>/">`. Direct engine access serves the bundled
         manifest as-is, so "." installs a per-workspace PWA. Gateway access on
         port 5252 serves /<slug>/manifest.json itself and widens scope to "/",
         so switching workspaces stays in the standalone PWA. In the picker
         context (base "/~/") this resolves to /~/manifest.json, which the
         gateway also re-stamps with scope "/" + start_url "/~/". -->
    <link rel="manifest" href="manifest.json">

    <!--
      PWA cold-start fast path (the load-bearing smoothness fix). When the picker
      (server-stamped <base href="/~/">) would auto-open the last workspace, do the
      redirect HERE — in <head>, before the bundle loads and before anything
      paints — so the picker NEVER renders a splash and there is no
      picker→workspace cross-document reload seam (the persistent cold-start
      jank/flicker). The browser goes straight to /<slug>/, which plays the single
      reveal. Skipped when `?pick` is present (the in-app "Manage workspaces"
      escape) or no workspace is remembered, so the picker still renders its list.
      Reads the RAW device-global `lucidos-last-workspace` key (this runs before
      workspaceStorage.install namespacing, matching how the picker writes it).
      `location.replace` so the picker is not left in history. A since-deleted slug
      is caught by the gateway, which 302s it to `/~/?pick` (server.rs) — `?pick`
      then stands this redirect down, so there is no loop. Mirrors openWorkspace()
      (`/${encodeURIComponent(id)}/`).

      PRESERVES `location.search` + `location.hash` through the redirect. A push
      tap can cold-launch the PWA in picker context with a deep link on the URL
      (`/?notification=…&thread=…&tap=…` when the push subscription scope is the
      gateway root). Redirecting to a bare `/<slug>/` dropped those params before
      the app ever booted — so every such tap landed on the workspace with the
      deep link gone (`handle_hash_location {found:false}`), turning the flaky iOS
      push tap into a consistent failure. Carrying search+hash forward lands
      `/<slug>/?notification=…`, which `handleHashLocation` then dispatches. (`?pick`
      already returned above, so it can't be carried into a loop.)
    -->
    <script>
      (function () {
        try {
          var base = document.querySelector('base');
          if (!base || base.getAttribute('href') !== '/~/') return;
          if (new URLSearchParams(location.search).has('pick')) return;
          var slug = localStorage.getItem('lucidos-last-workspace');
          // Preserve the deep link (notification/thread/tap query + any hash) so a
          // push tap that cold-launches into the picker still reaches the workspace
          // WITH its params, instead of a bare /<slug>/.
          if (slug) location.replace('/' + encodeURIComponent(slug) + '/' + location.search + location.hash);
        } catch (e) { /* fall through to the normal picker render */ }
      })();
    </script>
    <!--
      localStorage-driven FOUC. localStorage is the per-browser source of
      truth for the user's theme/font/scale (preferences.ts mirrors every
      change there); reading it synchronously before any stylesheet
      evaluates makes first paint match the user's choice without a cookie
      or DB roundtrip. These keys are PER-WORKSPACE (workspaceStorage.ts),
      so they live under `ws:<slug>:…`. This script runs before the app
      bundle installs the namespacing override, so it prefixes by hand via
      `wsKey()` (slug from the stamped <base href>, mirroring basePath.ts).
      Same-origin app iframes derive the SAME slug from their `/<slug>/…`
      URL (sdk_prefs.rs + sdk/_storage.ts), so the parent and every app
      iframe agree on first-paint values.
    -->
    <script>
      (function() {
        var d = document.documentElement;
        // The workspace picker (gateway sigil surface, <base href="/~/">) is a
        // pre-workspace page that renders standalone — preferences.ts never runs
        // on it, so this FOUC resolve is its ONLY theme application. With no
        // per-workspace preference to honor, it follows the OS theme when nothing
        // is saved on this origin, instead of the app's dark default.
        var baseEl = document.querySelector('base');
        // The base href, reduced to a path. An ABSOLUTE value is supported
        // (normalizeBasePath in basePath.ts tolerates it explicitly) and the app
        // derives everything from its PATHNAME, so both readers below must too:
        // slash-stripping the whole URL would yield a slug like `https:/host/myws`
        // (making every `ws:myws:` key the app wrote invisible here) and would
        // fail the picker comparison. All three wsKey derivations in this document
        // run this same normalization; they must not disagree.
        var basePathHref = (function () {
          var href = baseEl && baseEl.getAttribute('href');
          if (!href) return null;
          if (/^https?:\/\//i.test(href)) {
            try { href = new URL(href).pathname; } catch (e) { /* keep the raw value */ }
          }
          return href;
        })();
        var isPicker = basePathHref === '/~/';
        // Per-workspace key namespacing (mirrors workspaceStorage.ts +
        // basePath.ts). Slug from the stamped <base href="/<slug>/">; picker
        // (/~/) and legacy root (/) → no slug → raw key (their own fallback).
        var wsSlug = (function () {
          if (!basePathHref) return null;
          var seg = basePathHref.replace(/^\/+|\/+$/g, '');
          return (seg === '' || seg === '~') ? null : seg;
        })();
        function wsKey(name) { return wsSlug ? 'ws:' + wsSlug + ':' + name : name; }
        var raw = localStorage.getItem(wsKey('lucidos-theme'));
        var fallbackTheme = isPicker ? 'system' : 'dark';
        var theme = (raw === 'light' || raw === 'dark' || raw === 'system') ? raw : fallbackTheme;
        var mqLight = matchMedia('(prefers-color-scheme: light)').matches;
        var resolved = theme === 'system' ? (mqLight ? 'light' : 'dark') : theme;
        d.setAttribute('data-theme', resolved);
        var bg = resolved === 'light' ? '#ffffff' : '#07172e';
        d.style.setProperty('--bg-primary', bg);
        // Paint the boot-splash brand gradient on the document canvas during boot
        // (base colour + fixed attachment). This covers TWO gaps:
        //   1. the WKWebView white flash on iOS PWA cold-restart (what the
        //      previous solid-`bg` inline covered), and
        //   2. the iOS standalone bottom safe-area strip that the fixed
        //      `inset:0` .boot-splash element leaves bare. The body gets the same
        //      paint below: in light mode its own background otherwise wins in
        //      that uncovered strip and shows white despite this root paint.
        //      Same fixed-attachment-gradient technique the gateway
        //      splash uses (crates/lucidos-gateway/src/proxy.rs `.mark`/html bg).
        //
        // THE BASE COLOUR IS THE SEAM COLOUR, not the gradient's end colour.
        // iOS fills that bottom strip with the flat base colour and never with
        // the gradient image, so the base is what the user actually sees there,
        // butted directly against the gradient above it. #0a4ea8 (the 100% stop)
        // made the strip a visibly darker band: along the bottom edge the
        // gradient is only 0.62 (at x=30%) to 0.84 (at x=100%) of the way to it.
        // #145eb9 is the gradient's own colour at progress 0.70, the mean across
        // that edge, which leaves under 4% per channel anywhere along it. The
        // progress figures are aspect-independent (both radii are percentages of
        // their own axis), so this holds on every device.
        // dismissBootSplash() (src/utils/bootSplash.ts) reverts this to
        // var(--bg-primary) once the splash is gone, so no blue lingers behind
        // the app's own bottom safe-area inset.
        d.style.background = '#145eb9 radial-gradient(125% 125% at 30% 22%, #2d83e0 0%, #0a4ea8 100%) no-repeat fixed';
        var FONTS = {
          monospace: "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'Fira Code', 'JetBrains Mono', Monaco, Consolas, monospace",
          system: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
          inter: "'Inter', system-ui, sans-serif",
          'jetbrains-mono': "'JetBrains Mono', monospace",
          'ibm-plex-mono': "'IBM Plex Mono', monospace",
          'fira-code': "'Fira Code', monospace"
        };
        var fontKey = localStorage.getItem(wsKey('lucidos-font-family'));
        d.style.setProperty('--font-ui', FONTS[fontKey] || FONTS.monospace);
        // Programming ligatures, only for fonts that ship them (Fira Code);
        // every other font gets `normal` (CSS initial → unchanged). Mirrors
        // FONT_FEATURES in preferences.ts and the same map in api/sdk_prefs.rs.
        var FEATURES = { 'fira-code': '"liga" 1, "calt" 1' };
        d.style.setProperty('font-feature-settings', FEATURES[fontKey] || 'normal');
        var scale = localStorage.getItem(wsKey('lucidos-ui-scale'));
        if (scale) {
          // Snap to the 12.5% grid (see UI_SCALE_STEP) so a pre-grid saved
          // value like "115" doesn't paint at 115% for one frame before the
          // app boots, re-clamps to 112.5%, and re-paints — visible flash.
          var legacy = { small: 100, medium: 112.5, large: 125 };
          var n = legacy[scale];
          if (n === undefined) n = parseFloat(scale);
          if (!isNaN(n)) {
            var snapped = Math.min(200, Math.max(75, Math.round(n / 12.5) * 12.5));
            d.style.setProperty('--user-ui-scale', snapped + '%');
          }
        }

        // Always-on theme-flash telemetry: POST breadcrumbs to engine.log so
        // we can grep for the transition that preceded a reported flash. The
        // bug we're hunting (iOS WKWebView matchMedia returning a stale
        // synchronous value at random post-FOUC moments) doesn't reproduce on
        // demand, so the only way to catch it is to log every transition and
        // inspect after the fact. Theme transitions fire ~3-5 times per cold
        // load — negligible noise. window.__themeLogEvt is the same hook
        // applyTheme() uses, kept here so both surfaces share one channel.
        try {
          var t0 = performance.now();
          window.__themeLogEvt = function(label, info) {
            var body = JSON.stringify({
              category: 'theme',
              message: label,
              data: Object.assign({ tMs: Math.round(performance.now() - t0) }, info)
            });
            // keepalive=true so the POST survives a navigation away (pageshow
            // breadcrumbs in particular can fire just before a route swap).
            // Relative URL (ADR 0014): resolves against the engine-stamped
            // `<base href="/<slug>/">` (or `/` at a legacy root), so the
            // breadcrumb reaches this workspace's engine through the gateway —
            // no inline prefix parsing needed.
            fetch('api/v1/internal/client-log', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: body,
              keepalive: true
            }).catch(function() {});
          };
          window.__themeLogEvt('fouc', {
            raw: raw, theme: theme, resolved: resolved, mqLight: mqLight
          });
          // pageshow fires on bfcache restore — the IIFE doesn't re-run, so
          // re-read live values here instead of trusting the stale FOUC entry.
          window.addEventListener('pageshow', function(e) {
            window.__themeLogEvt('pageshow', {
              persisted: e.persisted,
              dataTheme: d.getAttribute('data-theme'),
              rawNow: localStorage.getItem(wsKey('lucidos-theme')),
              mqLightNow: matchMedia('(prefers-color-scheme: light)').matches
            });
          });
        } catch (e) { /* telemetry must never break FOUC */ }
      })();
    </script>
    <script>
      (function() {
        var t = document.documentElement.getAttribute('data-theme') || 'dark';
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#ffffff' : '#07172e');
      })();
    </script>
    <!--
      Boot splash — inlined here (markup + style) so it paints on the FIRST
      frame, BEFORE the JS/CSS bundle downloads. That is what makes the cold
      launch connection-independent: on a slow link the splash shows immediately
      instead of a black/empty #app. The SAME inline splash ships in every served
      context (picker `/~/`, workspace `/<slug>/`, direct `/`) — the engine and
      gateway both serve this one `index.html`.

      REVEAL ONLY IN THE FINAL DOCUMENT (the load-bearing rule). The picker→
      workspace auto-open is a full cross-document navigation (a reload). A reveal
      animation that played in BOTH documents would build, reload, and build again
      — the jank we hit before. So:
        • The picker (base href `/~/`) hides the mark (the inline script below
          tags the splash `boot-splash-reload`) so the reveal plays only in the
          workspace. When the picker LIST renders (no remembered workspace to
          auto-open, or an explicit `?pick`) that script also CLEARS the baked
          "Opening your workspace…" status — on the picker you choose a workspace,
          you don't open one — so it shows only the silent gradient cover. The
          auto-open path (a remembered workspace) keeps the status and carries it
          into the workspace document.
        • The final document (workspace / direct, base href NOT `/~/`) plays the
          reveal ONCE, then settles into a gentle breathe. So the mark builds up
          exactly once, on a clean gradient, in the destination: never a double
          build and never a formed→rebuild jump (the picker showed no mark to
          jump from). hooks/useBootSplashReady.ts keeps the splash up until the
          reveal has finished at least once (min-reveal), THEN dismisses on
          readiness.
        • Unless the mark is ALREADY BUILT when this document loads, which is the
          case when the gateway boot splash was up. It stands one there at the
          same size and place and hands it over (see the body script), so the
          reveal is skipped entirely: the mark just keeps standing, and there is
          no min-reveal to wait out.

      STATUS LINE — constant size always (incl. when invisible) so the mark never
      shifts, and a baked default ("Opening your workspace…") shown from first
      paint. This SAME text is baked into both documents; the auto-open path does
      NOT override it, so the status is byte-identical across the picker→workspace
      reload — it neither vanishes ("message that disappears immediately") nor
      swaps wording ("opening your workspace" → "opening") at the seam. (The
      picker-LIST render path is the exception — it clears the status, since you're
      choosing a workspace there, not opening one; see the body script below.)
      src/utils/bootSplash.ts updates the text; it fades the whole splash out once
      the app is ready. The mark geometry mirrors
      scripts/generate-brand-icons.mjs / components/shared/LucidosMark.tsx
      verbatim; the gradient is the brand radial. z-index 2500 sits above every
      overlay + the floating header chrome (modals 2300, toasts 2400, control
      panel 2200; see styles/global/base.css) and is hardcoded because the bundle
      CSS isn't loaded yet at first paint.

      SINGLE SOURCE FOR BOTH SPLASH SURFACES. The gateway serves its own 503 boot
      splash while a workspace engine starts, on the SAME url this document then
      loads at (crates/lucidos-gateway/src/proxy.rs). It cannot link a stylesheet
      (there is no engine to serve one yet), so it `include_str!`s THIS FILE at
      compile time and lifts the stylesheet and the mark markup out of it
      verbatim, between the lucidos-boot-splash-css and lucidos-boot-splash-mark
      marker pairs below. So the two surfaces are the same splash by
      construction, not two copies kept in step: edit a value here and the
      gateway moves with it. Two things follow.
        • Keep those markers, exactly one pair of each. Both sides pin them
          (src/utils/bootSplash.test.ts and proxy.rs), so dropping one fails a
          test rather than silently unstyling the gateway splash.
        • Every length here is in FIXED px, never rem. This document's <html>
          font-size is var(--user-ui-scale) (base.css, 112.5% by default on
          mobile.css) and the gateway's is the browser default, so one rem value
          paints at two different sizes: at 137.5% scale a 15rem mark was 330px
          here and 240px there, and it visibly grew when this document took over.
    -->
    <style>
      /* lucidos-boot-splash-css-start */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2500;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* px, not rem: see the no-rem rule in the comment above. */
        gap: 24px;
        background: radial-gradient(125% 125% at 30% 22%, #2d83e0 0%, #0a4ea8 100%);
        /* Type for the whole splash, set once here so every line on either
           surface inherits it (the gateway adds an escape link; this document's
           status is the only child today).
           FIXED font stack, deliberately NOT var(--font-ui): the workspace font
           preference can be a web font (Inter / JetBrains Mono / IBM Plex Mono)
           that isn't downloaded yet at first paint, so the text would paint in a
           fallback and then reflow when the web font swaps, which is visible
           jank on the boot splash. An all-system monospace stack paints
           instantly with no swap. Size in px for the no-rem reason above. */
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'Fira Code', 'JetBrains Mono', Monaco, Consolas, monospace;
        font-size: 15px;
        line-height: 1.4;
        letter-spacing: 0.01em;
        /* Decorative during normal boot: the app shell loads + is interactive
           behind it, so the splash does not intercept pointer events. The
           guarded terminal-recovery state deliberately enables a tap below. */
        pointer-events: none;
      }
      .boot-splash-mark {
        /* px, not rem: see the no-rem rule in the comment above. 240px is what
           the old 15rem cap resolved to at a default 16px root. */
        width: min(46vmin, 240px);
        height: min(46vmin, 240px);
        /* Reveal the WHOLE mark as one compositor layer (svg-root transform +
           opacity), then breathe. The previous reveal animated transform:scale on
           each SVG shape (.bs-tile/.bs-spark) — iOS WebKit does NOT GPU-composite
           SVG sub-element transforms, so they ran on the main thread and janked
           while boot saturated it (bundle parse + initial render). Animating the
           svg element itself composites cleanly (will-change hints the layer), so
           the reveal stays smooth regardless of main-thread load. */
        will-change: transform, opacity;
        transform-origin: center;
        animation: boot-mark-reveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both,
                   boot-mark-breathe 2.8s ease-in-out 1.3s infinite;
      }
      /* Picker (about to reload): hide the mark so the reveal happens ONLY in the
         workspace. Space is reserved (visibility, not display) so the status line
         keeps its position. */
      .boot-splash-reload .boot-splash-mark { visibility: hidden; }
      /* The mark was already built by a previous document (the gateway boot
         splash, or an earlier refresh of it) and is standing on screen right now
         (see the handover script in the body). Skip the reveal and settle
         straight into the breathe, so the swap leaves the mark where it is
         instead of dropping it to opacity 0 and building it a second time.
         Higher specificity than the reveal rule above, so it wins without
         touching it. Used by BOTH surfaces. */
      .boot-splash-formed .boot-splash-mark {
        animation: boot-mark-breathe 2.8s ease-in-out infinite;
      }
      /* A notification-tap document (see the deep-link script in the body).
         WebKit gives no reload-free channel for a push tap, so the tap arrives
         as a full cross-document load of `?notification=…` and this splash is
         what the user stares at. But that load is the CONTINUATION of a session
         the user was already in, not a launch, so it gets no launch ceremony:
         no mark, no status, and the app's own flat --bg-primary instead of the
         brand gradient, so the cover reads as the app redrawing rather than
         relaunching. hooks/useBootSplashReady.ts additionally skips the
         min-reveal floor here, since there is no reveal to wait out. The
         gradient is dropped on the splash AND on both canvas layers (the body
         script), because a fixed inset:0 element does not reach the iOS
         standalone bottom safe-area strip. Only the DELAYED status survives
         (utils/bootSplash.ts writes it past STATUS_DELAY_MS): quiet is not
         silent, and a genuinely stuck tap still has to say so. */
      .boot-splash-quiet {
        background: var(--bg-primary, #07172e);
      }
      .boot-splash-quiet .boot-splash-mark { display: none; }
      /* Both foregrounds on this splash are hardcoded white, which is right on
         the brand gradient and wrong on a quiet cover: in light theme
         --bg-primary is #ffffff, so the delayed status ("Connecting…",
         "Workspace not started") and the watchdog's escape link ("Start this
         workspace", the ONLY way out of a stopped direct-port workspace) would
         both be white on white. That would make "quiet, but not silent"
         literally false for a light-theme user, at exactly the moment boot has
         given up. Keyed on data-theme, which the FOUC script resolves before
         first paint, so it holds even when the bundle CSS never loads, which is
         precisely the case the escape link exists for. Values mirror
         --text-primary in styles/global/base.css; px/hex only, per the no-rem
         rule above. */
      [data-theme="light"] .boot-splash-quiet .boot-splash-status {
        color: rgba(31, 35, 40, 0.82);
      }
      [data-theme="light"] .boot-splash-quiet .boot-splash-escape { color: #1f2328; }
      /* Nothing branded to fade out, so the cover leaves faster than a launch
         splash does. Two-class specificity (0,2,0), which is what lets it beat
         the `animation` shorthand on .boot-splash-leaving below, and is also why
         the reduced-motion block has to restate it: a media query adds no
         specificity, so the plain 0.15s rule in there would lose to this one. */
      .boot-splash-quiet.boot-splash-leaving { animation-duration: 0.2s; }
      .boot-splash-status {
        /* Type is inherited from .boot-splash (one declaration for both
           surfaces); this rule owns only what is the status line's own. The
           gateway lets this same line wrap for its longer labels and overrides
           nothing else. */
        color: rgba(255, 255, 255, 0.82);
        /* Constant size, reserved identically whether the text is present,
           empty, or invisible, so the mark above it never shifts. One line at
           the inherited 1.4 line-height. */
        height: 1.4em;
        max-width: 80vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .boot-splash-status.boot-splash-status-shown { opacity: 1; }
      /* The one action a splash can offer when boot cannot proceed: a link out.
         Both surfaces render one, so the appearance is declared here once and
         each surface owns only WHEN it is shown. The gateway page renders its
         link outright (its stalled/failed pages have nothing else left to
         offer); this document ships its own with the `hidden` attribute and
         drops that only in the recovery state, so a healthy boot never shows
         it. Reads brighter than the status and is underlined, so it reads as a
         tap target, and it takes its pointer events back from the
         pointer-events:none splash that covers a live shell. */
      .boot-splash-escape {
        color: #fff;
        opacity: 0.92;
        text-decoration: underline;
        text-underline-offset: 0.2em;
        pointer-events: auto;
      }
      .boot-splash.boot-splash-stalled { pointer-events: auto; cursor: pointer; }
      .boot-splash-leaving { animation: boot-splash-out 0.45s ease forwards; }
      @keyframes boot-mark-reveal {
        from { opacity: 0; transform: scale(0.86); }
        70%  { opacity: 1; transform: scale(1.04); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes boot-mark-breathe {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.84; }
      }
      @keyframes boot-splash-out { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-mark,
        .boot-splash-formed .boot-splash-mark { animation: none; }
        .boot-splash-status { transition: none; }
        .boot-splash-leaving,
        .boot-splash-quiet.boot-splash-leaving { animation-duration: 0.15s; }
      }
      /* lucidos-boot-splash-css-end */
    </style>
</head>
<body style="background:#145eb9 radial-gradient(125% 125% at 30% 22%, #2d83e0 0%, #0a4ea8 100%) no-repeat fixed">
    <div class="boot-splash" aria-hidden="true">
      <!-- lucidos-boot-splash-mark-start -->
      <svg class="boot-splash-mark" viewBox="0 0 100 100" aria-hidden="true">
        <g transform="translate(11 11) scale(0.78)" fill="#ffffff">
          <rect x="17" y="17" width="29" height="29" rx="7" />
          <rect x="17" y="54" width="29" height="29" rx="7" />
          <rect x="54" y="54" width="29" height="29" rx="7" />
          <path d="M68.5 12 C71 25 74 28.5 87 31 C74 33.5 71 37 68.5 50 C66 37 63 33.5 50 31 C63 28.5 66 25 68.5 12 Z" />
        </g>
      </svg>
      <!-- lucidos-boot-splash-mark-end -->
      <div class="boot-splash-status boot-splash-status-shown" role="status" aria-live="polite">Opening your workspace…</div>
      <!-- The way out of a workspace this document cannot reach, revealed only
           when boot has given up (see the watchdog below and
           src/utils/bootSplash.ts). `hidden` until then, and it carries no href
           until one is built, so a healthy boot has nothing here to see or tap.
           Kept OUTSIDE the mark markers: the gateway splash lifts only the mark
           and renders its own escape link. -->
      <a class="boot-splash-escape" hidden></a>
    </div>
    <script>
      // Gateway-splash handover, before first paint. The gateway serves its own
      // 503 boot splash on the SAME url while the engine starts (proxy.rs), with
      // the mark at the same size and position as this one; when the engine
      // answers, that document is replaced by this one. Left alone, this document
      // would re-play its reveal, so a mark that was already standing on screen
      // drops to opacity 0 and builds a second time. The gateway page hands over
      // a one-shot sessionStorage flag: consume it (removing it as we read, so it
      // can only suppress that ONE rebuild) and tag the splash `boot-splash-formed`
      // to skip straight to the breathe. No flag (engine already up, or a direct
      // engine port with no gateway) means no mark was on screen, so the reveal
      // plays as usual. See the splash comment above.
      (function () {
        var formed;
        try {
          formed = sessionStorage.getItem('lucidos-splash-mark-formed') === '1';
          sessionStorage.removeItem('lucidos-splash-mark-formed');
        } catch (e) { formed = false; }
        if (!formed) return;
        var splash = document.querySelector('.boot-splash');
        if (splash) splash.classList.add('boot-splash-formed');
      })();
    </script>
    <script>
      // Picker context (server-stamped <base href="/~/">). Two jobs, both before
      // first paint:
      //   1. Hide the mark (tag `boot-splash-reload`) so the reveal plays
      //      ONLY in the workspace document, never double-builds across the
      //      picker→workspace auto-open navigation.
      //   2. When the picker LIST is what renders — i.e. we are NOT auto-opening a
      //      remembered workspace (explicit `?pick`, or none remembered: the SAME
      //      condition the <head> redirect uses to NOT redirect) — clear the baked
      //      "Opening your workspace…" status. On the picker you choose a
      //      workspace, you don't open one, so that message is wrong; cleared, the
      //      picker shows a silent gradient cover that fades into the list. The
      //      auto-open path keeps the status (it redirects in <head> and the text
      //      carries into the workspace document, byte-identical across the seam).
      // See the splash comment above + hooks/useBootSplashReady.ts.
      (function () {
        var base = document.querySelector('base');
        if (!base || base.getAttribute('href') !== '/~/') return;
        var splash = document.querySelector('.boot-splash');
        if (splash) splash.classList.add('boot-splash-reload');
        var renderingList;
        try {
          renderingList = new URLSearchParams(location.search).has('pick') ||
            !localStorage.getItem('lucidos-last-workspace');
        } catch (e) { renderingList = true; }
        if (renderingList && splash) {
          var status = splash.querySelector('.boot-splash-status');
          if (status) { status.textContent = ''; status.classList.remove('boot-splash-status-shown'); }
        }
      })();
    </script>
    <script>
      // Quiet the splash, before first paint, for a reload that CONTINUES a
      // session rather than starting one.
      //
      // Two documents qualify, and the shared rule is the point: the user was
      // already in the app one moment ago, so a full brand launch is a lie about
      // what just happened.
      //
      //   1. A REFRESH the user asked for (`lucidos-splash-quiet`, a one-shot
      //      sessionStorage flag stamped by `refreshClient` in hooks/sw-update.ts,
      //      the single refresh funnel: the control-panel button, the "New version
      //      available" toast, the applied-change / reconnect toasts, the recovery
      //      "Reload page" buttons, the stale-chunk auto-reload). The user watched
      //      the screen dim under UiBlockingOverlay and is waiting for the SAME
      //      workspace to come back. This trigger is PERMANENT.
      //   2. A NOTIFICATION TAP (`?notification=…` on the URL). TEMPORARY MEASURE
      //      (docs/temporary-measures.md § "Cross-document notification-tap reload
      //      on iOS (and its quiet boot cover)"): a push tap on an installed iOS
      //      PWA cannot reach an already-open window without a full cross-document
      //      load, because WebKit implements neither launchQueue nor
      //      `launch_handler: focus-existing` nor a same-document declarative
      //      navigate, and every reload-free variant tried so far silently dropped
      //      the deep link (system-knowhow/notifications.md §4.5). So the reload IS
      //      the navigation, and this splash is what the user stares at on the way
      //      through. Only this trigger goes away when WebKit gives us a better
      //      channel; the cover itself stays for (1).
      //
      // Either way the document gets no launch ceremony: `boot-splash-quiet` drops
      // the mark and the gradient (see the stylesheet), the baked "Opening your
      // workspace…" is cleared, and both canvas layers are repainted flat so the
      // iOS bottom safe-area strip (which a fixed inset:0 element never reaches)
      // matches the cover. Paired with hooks/useBootSplashReady.ts, which skips the
      // min-reveal floor when there is no reveal to wait out. The DELAYED status
      // still writes here past STATUS_DELAY_MS, so a genuinely stuck load is quiet
      // but not silent.
      //
      // The flag is consumed as it is read (like the gateway handover flag above),
      // so a refresh whose reload never happened can quiet at most ONE later load.
      //
      // The deep-link gate mirrors `handleHashLocation`
      // (store/actions/hash-deeplink-router.ts) branch for branch, and that
      // precision is load-bearing three times over:
      //   • A bare `#thread=<uuid>` is the cross-workspace landing channel, which
      //     the router checks FIRST (THREAD_HASH_RE, store/actions/cross-workspace.ts)
      //     and which wins even when a notification param is also present. That hop
      //     goes through the gateway and can lazy-start a stopped engine, so
      //     "Opening your workspace…" is true there: it stays a launch.
      //   • The router reads the notification id with the HASH winning over the query
      //     (its `get` is `hash ?? query`), so a present-but-empty hash value beats a
      //     good query one.
      //   • It dispatches on the VALUE being non-empty (`hasDeepLinkParams` is
      //     `!!notification`), not on the key existing. So `?notification=` and a bare
      //     `thread=`/`event=` pair both stay launches: quieting a document that then
      //     routes nothing would drop the mark and the reveal floor for a real cold
      //     start.
      // Reads `location` and never writes it: consuming the deep link belongs to
      // handleHashLocation alone.
      (function () {
        // Per-workspace key, by hand. `refreshClient` writes through the app's
        // namespacing override (utils/workspaceStorage.ts), whose prototype patch
        // ALSO covers sessionStorage, so the flag lands at `ws:<slug>:…`. This
        // script runs before that override exists, so it must build the same
        // prefix itself or it would read a key nobody writes, and the cover would
        // silently never appear behind the gateway. Mirrors the boot watchdog's
        // own wsKey below (and basePath.ts): picker (`/~/`) and legacy root (`/`)
        // have no slug and stay raw, exactly as the override no-ops there.
        var bootBase = document.querySelector('base');
        var bootBaseHref = bootBase && bootBase.getAttribute('href');
        // Absolute base href: normalize to its pathname first, as the FOUC copy
        // above and basePath.ts do. See that comment for why.
        if (bootBaseHref && /^https?:\/\//i.test(bootBaseHref)) {
          try { bootBaseHref = new URL(bootBaseHref).pathname; } catch (e) { /* keep the raw value */ }
        }
        // Strip THEN compare, matching the FOUC copy: comparing the raw href
        // against '/' and '/~/' first would call a slash-less `~` a workspace
        // slug and namespace under `ws:~:`, where basePath.ts derives null.
        var bootSlug = (function () {
          if (!bootBaseHref) return null;
          var seg = bootBaseHref.replace(/^\/+|\/+$/g, '');
          return (seg === '' || seg === '~') ? null : seg;
        })();
        function wsKey(name) { return bootSlug ? 'ws:' + bootSlug + ':' + name : name; }
        // Consume the refresh flag FIRST and unconditionally, so it cannot survive
        // a load that then declines to quiet for some other reason.
        var quiet;
        try {
          quiet = sessionStorage.getItem(wsKey('lucidos-splash-quiet')) === '1';
          sessionStorage.removeItem(wsKey('lucidos-splash-quiet'));
        } catch (e) { quiet = false; }
        if (!quiet) {
          try {
            if (/^#thread=[0-9a-f-]+$/.test(location.hash)) return;
            var hashParams = location.hash.charAt(0) === '#'
              ? new URLSearchParams(location.hash.slice(1))
              : new URLSearchParams();
            var notification = hashParams.get('notification');
            if (notification === null) {
              notification = new URLSearchParams(location.search).get('notification');
            }
            quiet = !!notification;
          } catch (e) { quiet = false; }
        }
        if (!quiet) return;
        var splash = document.querySelector('.boot-splash');
        // The gateway handover WINS, and this is the one case where a deep-link
        // document is not a continuation of a live session. A tap on a stopped
        // workspace is lazy-started by the gateway, which serves its own boot
        // splash on this exact url (query intact, meta-refreshed) until the engine
        // answers, so by the time this document loads the user has been watching a
        // fully built mark for seconds and the script above tagged it
        // `boot-splash-formed` to keep it standing. Quieting that would hide the
        // mark mid-boot with `display: none` and snap the gradient to flat in one
        // frame, which is precisely the seam jump the handover exists to prevent.
        // Bail BEFORE the canvas repaint below, or the mark keeps standing on a
        // flattened background. (Same reasoning as the `#thread=` stand-down: a hop
        // that can lazy-start an engine really is a launch.)
        if (splash && splash.classList.contains('boot-splash-formed')) return;
        if (splash) {
          splash.classList.add('boot-splash-quiet');
          var status = splash.querySelector('.boot-splash-status');
          if (status) { status.textContent = ''; status.classList.remove('boot-splash-status-shown'); }
        }
        // The flat colour the FOUC script above already resolved for this theme.
        // Recomputed from data-theme when that script could not run (a browser
        // refusing localStorage throws out of it), so the canvas can never keep the
        // gradient while the cover on top of it is flat.
        var d = document.documentElement;
        var bg = d.style.getPropertyValue('--bg-primary') ||
          (d.getAttribute('data-theme') === 'light' ? '#ffffff' : '#07172e');
        d.style.background = bg;
        if (document.body) document.body.style.background = bg;
      })();
    </script>
    <div id="app"></div>
    <script>
      /* lucidos-boot-watchdog-start
         The application module normally takes ownership immediately below. If
         its content-hashed entry is stale/missing, none of the module-owned
         status or safety timers can run, so keep the recovery floor in this
         classic inline script. Retry automatically once; a second failure stops
         with a tappable action instead of reload-looping forever. */
      (function () {
        var RETRY_KEY = 'lucidos-boot-retry';
        var RETRY_PARAM = '_boot_retry';
        var base = document.querySelector('base');
        var baseHref = base && base.getAttribute('href');
        // Slug only: `baseHref` itself stays raw, because revealGatewayEscape
        // below keys on its mere PRESENCE ("direct" is exactly "no base
        // element"). Absolute base href normalized to its pathname, as the two
        // wsKey copies above do; see the FOUC one for why.
        var slugHref = baseHref;
        if (slugHref && /^https?:\/\//i.test(slugHref)) {
          try { slugHref = new URL(slugHref).pathname; } catch (e) { /* keep the raw value */ }
        }
        // Strip THEN compare, matching the two copies above (see the FOUC one).
        var workspaceSlug = (function () {
          if (!slugHref) return null;
          var seg = slugHref.replace(/^\/+|\/+$/g, '');
          return (seg === '' || seg === '~') ? null : seg;
        })();
        function wsKey(name) { return workspaceSlug ? 'ws:' + workspaceSlug + ':' + name : name; }
        var recovered = false;

        function metaContent(name) {
          var el = document.querySelector('meta[name="' + name + '"]');
          var value = el && el.getAttribute('content');
          return value ? value.trim() : '';
        }

        /* The way out of a workspace this document cannot reach, and the reason
           the engine stamps a gateway port and a workspace id into every shell
           (api/base_path.rs): built from those two metas plus `location`, so it
           needs no engine, no network and no application bundle. Exactly the
           resources a document served from the service worker's cache against a
           dead origin still has.

           Only a DIRECT-PORT document gets one. Direct access is the case with
           no way out: nothing on that origin lazy-starts a stopped workspace,
           and the gateway is a different origin (its own port), so no relative
           route reaches it. A document already behind the gateway (base
           `/<slug>/`), the picker (`/~/`), and an engine with no gateway at all
           (no port meta) each have nothing to offer here, and keep the plain
           retry. `inject_base_href` is a no-op for `/`, so "direct" is exactly
           "no base element".

           Prefers `/<slug>/`, whose navigation is what makes the gateway
           lazy-start the workspace. A shell cached before the id stamp existed
           falls back to the picker, which is a tap further but still a way in.

           Returns the revealed anchor, or null when there is nothing to offer. */
        function revealGatewayEscape() {
          var splash = document.querySelector('.boot-splash');
          if (!splash || baseHref) return null;
          var port = metaContent('lucidos-gateway-port');
          if (!port) return null;
          var link = splash.querySelector('.boot-splash-escape');
          if (!link) return null;
          var slug = metaContent('lucidos-workspace-id');
          var origin = location.protocol + '//' + location.hostname + ':' + port;
          link.href = slug
            ? origin + '/' + encodeURIComponent(slug) + '/'
            : origin + '/~/?pick';
          link.textContent = slug ? 'Start this workspace' : 'Back to workspaces';
          link.hidden = false;
          // The splash ships aria-hidden (it is decorative over a live shell).
          // The moment it carries the only action on screen that has to stop:
          // otherwise the status naming the problem is never announced, and the
          // link is a focusable element inside an aria-hidden subtree.
          splash.setAttribute('aria-hidden', 'false');
          return link;
        }

        // One automatic retry, then a tappable action. Reached two ways, and the
        // distinction is the whole point of the pair: the timer below covers a
        // module that never takes ownership (a hang, where waiting IS the test),
        // and `onEntryModuleError` covers a module that reported it CANNOT load
        // (a stale bundle, or an engine that isn't answering at all), where the
        // answer is already in and there is nothing left to wait for. Before the
        // error arm, a dead direct engine port left the user staring at
        // "Opening your workspace…" for 15s, then again after the silent retry.
        function recover() {
          if (recovered) return;
          recovered = true;
          window.clearTimeout(timer);
          var tried = false;
          try { tried = sessionStorage.getItem(wsKey(RETRY_KEY)) === '1'; } catch (e) {}
          // The retry marks the URL as well as sessionStorage, and either mark
          // spends the one attempt. A browser that refuses storage would
          // otherwise never observe its own retry and would reload forever.
          try {
            tried = tried || new URL(location.href).searchParams.has(RETRY_PARAM);
          } catch (e) {}
          if (!tried) {
            try { sessionStorage.setItem(wsKey(RETRY_KEY), '1'); } catch (e) {}
            var retryUrl = new URL(location.href);
            retryUrl.searchParams.set(RETRY_PARAM, '1');
            location.replace(retryUrl.toString());
            return;
          }
          var splash = document.querySelector('.boot-splash');
          var status = splash && splash.querySelector('.boot-splash-status');
          // On a direct engine port the gateway is the only thing that can help:
          // reloading cannot start a stopped workspace, and the gateway starts
          // one on a navigation to it. So where an escape exists it REPLACES
          // tap-to-retry rather than sitting beside it, leaving exactly one tap
          // target in the recovery state.
          var escape = revealGatewayEscape();
          if (status) {
            status.textContent = escape ? "Can't reach this workspace" : 'Tap to retry';
            status.classList.add('boot-splash-status-shown');
          }
          if (splash && !escape) {
            splash.classList.add('boot-splash-stalled');
            splash.setAttribute('aria-hidden', 'false');
            splash.addEventListener('click', function () {
              try { sessionStorage.removeItem(wsKey(RETRY_KEY)); } catch (e) {}
              location.reload();
            }, { once: true });
          }
        }

        var timer = window.setTimeout(recover, 15000);

        // A script that fails to fetch (or is refused for its MIME type, which
        // is how the SPA fallback's HTML answer for a deleted bundle arrives)
        // fires `error` on its own element. That event does not bubble, but it
        // does reach window in the CAPTURE phase, so this needs no attribute on
        // the tag below and survives the build rewriting that tag's src.
        //
        // Keyed on the event, never on elapsed time: a slow but working load
        // fires nothing, so it is untouched and still owned by the timer.
        function onEntryModuleError(e) {
          var el = e && e.target;
          // A runtime exception targets window, not an element; only a module
          // script's own load failure is evidence the entry never arrived.
          if (!el || el === window || el.tagName !== 'SCRIPT' || el.type !== 'module') return;
          recover();
        }
        window.addEventListener('error', onEntryModuleError, true);

        // The application faces the same dead end when its bundle DID load but
        // the engine is unreachable (utils/bootSplash.ts, reached from the
        // direct-port branch of hooks/useBootSplashReady.ts). It reuses this
        // one implementation rather than rebuilding the href rule in TS, so the
        // two can never disagree about where the escape points. Deliberately
        // NOT deleted by the handover below, unlike __lucidosBootLoaded: the
        // application needs it precisely after boot has taken over.
        window.__lucidosGatewayEscape = revealGatewayEscape;

        window.__lucidosBootLoaded = function () {
          recovered = true;
          window.clearTimeout(timer);
          // Boot is the module's now. A later module-script failure is the
          // application's to handle, and must never reload the page under it.
          window.removeEventListener('error', onEntryModuleError, true);
          try { sessionStorage.removeItem(wsKey(RETRY_KEY)); } catch (e) {}
          try {
            var current = new URL(location.href);
            if (current.searchParams.has(RETRY_PARAM)) {
              current.searchParams.delete(RETRY_PARAM);
              history.replaceState(history.state, '', current.toString());
            }
          } catch (e) {}
          delete window.__lucidosBootLoaded;
        };
      })();
      /* lucidos-boot-watchdog-end */
    </script>
    <script type="module" src="/src/main.tsx"></script>
