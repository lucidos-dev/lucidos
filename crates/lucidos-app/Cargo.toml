[package]
name = "lucidos-app"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-window-state = "2"
serde_json = "1"

# Native macOS notifications WITH click delivery. tauri-plugin-notification's
# desktop show() is fire-and-forget (no click callback), so we drive
# mac-notification-sys directly — the same crate notify-rust uses under the
# hood — and block for the click response on a worker thread. See
# `show_native_notification` in lib.rs and system-knowhow/notifications.md §4.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }
