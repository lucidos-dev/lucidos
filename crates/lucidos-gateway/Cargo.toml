[package]
name = "lucidos-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

# The workspace gateway (ADR 0014): a standalone reverse-proxy + control plane
# that fronts N per-workspace `lucidos-engine` stacks. Deliberately has NO
# dependency on `lucidos-engine` — the only network-facing process must link
# proxy + supervise + registry code, not the engine's heavy core (LLM clients,
# agent loop, EventBus, sqlx, every credential path). Most of the small shared
# surface it needs (a `log!` macro, hop-by-hop helpers, the umbrella release
# string, a Postgres readiness probe) is duplicated here rather than shared, on
# purpose. Tailscale is the exception: two copies drifted, so it lives in
# `lucidos-tailscale`, which depends on `libc` alone and stays that way.

[[bin]]
name = "lucidos-gateway"
path = "src/main.rs"

[dependencies]
lucidos-tailscale = { path = "../lucidos-tailscale" }
lucidos-home = { path = "../lucidos-home" }
lucidos-local-token = { path = "../lucidos-local-token" }
# The only road to an engine: its Unix socket, connected only once the kernel
# names this user as the listener (ADR 0014 §1 keeps the engine crate out).
lucidos-engine-socket = { path = "../lucidos-engine-socket" }
lucidos-owner-lock = { path = "../lucidos-owner-lock" }
lucidos-frame-capability = { path = "../lucidos-frame-capability" }
lucidos-file-backup-exclusion = { path = "../lucidos-file-backup-exclusion" }
lucidos-pg-url = { path = "../lucidos-pg-url" }
lucidos-gateway-constants = { path = "../lucidos-gateway-constants" }
# Enumerating the machine's Lucidos installs, shared with `lucidos-app` so the
# control plane and the client cannot describe one machine two ways.
lucidos-installs = { path = "../lucidos-installs" }
lucidos-update-address = { path = "../lucidos-update-address" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
# Free disk space for the slowness warning, the same call the engine makes.
# Already in the lockfile through the engine.
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
# The WebSocket upgrade hop (ADR 0151). `reqwest` cannot carry an upgrade, so
# that one path speaks HTTP/1.1 directly and then splices the two byte streams.
# No WebSocket library here on purpose: the gateway never parses a frame. Both
# crates are already in the tree under `axum`, which is built on them.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util", "limit"] }
# `catch-panic` and `timeout` are the hook socket's, and are load-bearing rather
# than hygiene. That listener is the one surface a user may point at the open
# internet, and it shares this process with every workspace's supervisor.
tower-http = { version = "0.6", features = ["catch-panic", "cors", "fs", "set-header", "timeout"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
# One listener serves TLS and plain HTTP by sniffing each connection's first
# byte (`crate::tls`), which `axum-server`'s fixed rustls acceptor cannot do.
# Already in the lockfile under `axum-server`.
tokio-rustls = { version = "0.26", default-features = false }
# The public roots a phone trusts. An operator certificate serves the tailnet
# name only when it chains to one of them (`crate::tls::operator`). Already in
# the lockfile under `reqwest`.
webpki-roots = "1"
dotenvy = "0.15"
# Inbound auth stores a digest of each paired device's credential, never the
# credential. A leaked store then grants nobody remote reuse. A leaf crypto
# crate already in the lockfile via the engine, so it does not widen the
# gateway's dependency surface in any real sense.
sha2 = "0.10"
# The relay signs each device claim with an HMAC keyed by the gateway
# credential (ADR 0591). Already in the lockfile via the engine.
hmac = "0.12"
# A pairing code is eight digits somebody types into a phone. The Access page
# offers a QR instead, so the phone scans the whole pairing URL. `svg` is a
# pure-code feature and `image` is the crate's only dependency, gated off here,
# so this adds exactly one crate and nothing under it.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# A pairing label is user text and a header value is bytes, so the label the
# proxy forwards to the engine is percent-encoded. Already in the lockfile via
# the engine, which decodes it.
urlencoding = "2.1.3"
# Temp files the gateway writes, such as a legacy migration's plaintext dump,
# are created owner-only. Already a dependency of the engine.
tempfile = "3"

# macOS reports a process's processor time in Mach ticks, and converting them
# needs `mach_timebase_info`. `libc` deprecates its copy in favour of this crate,
# which is already in the lockfile, so it adds nothing to download.
[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[dev-dependencies]
# Stages a listener held by a stranger, which one user cannot otherwise do.
lucidos-engine-socket = { path = "../lucidos-engine-socket", features = ["test-support"] }
# A stand-in engine serving a router on an engine socket, as the real one does.
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["service"] }
# A self-signed cert for the https stand-in gateway in `peers_tests.rs`. Minted
# per run rather than checked in, so no test starts failing on an expiry date.
# Pinned to the `aws_lc_rs` backend `rustls` above already uses, so this adds no
# second crypto stack.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
