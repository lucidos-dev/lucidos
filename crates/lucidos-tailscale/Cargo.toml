[package]
name = "lucidos-tailscale"
version.workspace = true
edition.workspace = true
license.workspace = true

# Everything the tree knows about Tailscale, in one place: asking Tailscale
# where this machine sits on its tailnet, and locating the CLI.
#
# It exists because THREE crates needed the same knowledge and each grew its own
# copy, which is how a fix landed in two of them and missed the third (see
# docs/plans/2026-08-02-mobile-access-cli-free-tailscale-detection.md).
#
# Deliberately small, and it must stay that way. ADR 0014 §1 requires
# `lucidos-gateway` to have NO dependency on `lucidos-engine`, and this crate is
# the shared util it allows. `serde_json` reads Tailscale's status, and every
# consumer already builds it (ADR 0588). Never tokio, sqlx, or engine crates.

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
