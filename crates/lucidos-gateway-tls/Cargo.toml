[package]
name = "lucidos-gateway-tls"
version.workspace = true
edition.workspace = true
license.workspace = true

# What each gateway connection is served over: the listener kinds, the
# sniffing acceptor, the operator certificate and the tailnet certificate
# tailscaled issues.
#
# Only the gateway depends on it. It is a crate of its own because ADR 0738
# caps the gateway's size, and the loopback listener work lands here instead
# (decision 15 of `docs/plans/2026-11-19-desktop-window-https.md`).

[dependencies]
lucidos-tailscale = { path = "../lucidos-tailscale" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util", "limit"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
# One listener serves TLS and plain HTTP by sniffing each connection's first
# byte, which `axum-server`'s fixed rustls acceptor cannot do. Already in the
# lockfile under `axum-server`.
tokio-rustls = { version = "0.26", default-features = false }
# The public roots a phone trusts. An operator certificate serves the tailnet
# name only when it chains to one of them (`operator.rs`). Already in the
# lockfile under `reqwest`.
webpki-roots = "1"
# The kept tailnet certificate is written owner-only, file by file, through a
# rename (`managed.rs`).
tempfile = "3"

[dev-dependencies]
lucidos-local-token = { path = "../lucidos-local-token", features = ["test-support"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
hyper = { version = "1", features = ["server"] }
# Test certificates minted per run, on the backend `rustls` above uses.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
