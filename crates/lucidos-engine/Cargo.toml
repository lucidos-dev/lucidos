[package]
name = "lucidos-engine"
version.workspace = true
edition.workspace = true

[features]
# Tests that exercise properties of the real fastembed model
# (MultilingualE5Small). These tests require ~465 MB of model + tokenizer
# files from huggingface.co on first run, so they're excluded from default
# `cargo test` to keep the suite offline-safe. Run with:
#     cargo test -p lucidos-engine --features real-embedder-tests
real-embedder-tests = []

# Compiles in test-only HTTP endpoints (e.g. `GET /api/_test/push-log`) and
# swaps the real web-push transport for an in-process logger that appends to
# the `push_log` table. The e2e workspace builds with this feature enabled;
# production binaries never include the test endpoints or the stub
# transport. See `system-knowhow/notifications.md` §5.4 for the e2e harness
# this feature backs.
e2e-test-hooks = []

[dependencies]
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
libc = "0.2"
lucidos-tailscale = { path = "../lucidos-tailscale" }
lucidos-build-slot = { path = "../lucidos-build-slot" }
lucidos-home = { path = "../lucidos-home" }
lucidos-local-token = { path = "../lucidos-local-token" }
lucidos-owner-lock = { path = "../lucidos-owner-lock" }
# The engine socket the gateway reaches this engine on (ADR 0445).
lucidos-engine-socket = { path = "../lucidos-engine-socket" }
lucidos-frame-capability = { path = "../lucidos-frame-capability" }
lucidos-file-backup-exclusion = { path = "../lucidos-file-backup-exclusion" }
lucidos-pg-url = { path = "../lucidos-pg-url" }
lucidos-gateway-constants = { path = "../lucidos-gateway-constants" }
lucidos-capabilities = { path = "../lucidos-capabilities" }
lucidos-claude-code-managed = { path = "../lucidos-claude-code-managed" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
# pg-embed removed - using Docker PostgreSQL with pgvector
# `vendored-openssl` statically links OpenSSL into the binary for the
# libgit2-sys / libssh2-sys path (default features ssh/https/ssh_key_from_memory
# kept). Without it the release engine dynamically links Homebrew's OpenSSL by
# absolute path and crashes under the hardened-runtime macOS app. See the direct
# `openssl` dep below — together they vendor every OpenSSL path crate-wide.
git2 = { version = "0.20", features = ["vendored-openssl"] }
# `native-tls` adds nothing to the tree, since `default-tls` is already on
# through other crates. It unlocks `ClientBuilder::use_native_tls`, which the
# embedding-model downloader calls to trust the system CA store as hf-hub did.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "native-tls"] }
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
# Outbound WebSocket client, for the voice talker. axum's `ws` feature serves a
# socket; nothing here dialled one until voice needed to. Already in the tree
# via chromiumoxide, but without TLS, and the talker is reached over `wss`.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "compression-gzip", "compression-br"] }
fastembed = "4"
# Direct dep ONLY for the cache layout fastembed reads. `memory/model_download.rs`
# downloads the model itself, for byte progress and deadlines, and writes and
# probes that layout through this crate. It
# MUST resolve to the same version fastembed does: the two share the on-disk
# cache layout, and a split would make fastembed re-download everything we
# just fetched. Features mirror what fastembed's
# default `online` feature turns on (`hf-hub/ureq` + `hf-hub/native-tls`), so the
# feature union is unchanged.
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "native-tls"] }
fs2 = "0.4"
# usearch removed - using pgvector for vector search
tokio-cron-scheduler = { version = "0.15", features = ["signal"] }
cron = "0.15"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rand = "0.8"
tempfile = "3"
glob = "0.3"
image = "0.25"
kamadak-exif = "0.6"
urlencoding = "2.1.3"
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
regex = "1"
rayon = "1"
dotenvy = "0.15"
web-push = "0.11"
# NOT used directly in code — declared only to enable `openssl-sys/vendored`, which
# statically links OpenSSL into the engine binary across the whole dependency graph
# (the single shared openssl-sys node). This covers web-push's two OpenSSL paths
# (ece → openssl, isahc/curl → curl-sys) and unifies with git2's vendored-openssl
# above. Required so the release engine carries no `/opt/homebrew/...libssl` dylib
# reference (which crashes the hardened-runtime macOS app). Vendoring needs `perl`
# + a C toolchain at build time (present via Xcode CLT). Build-time only; identical
# for dev and packaged builds so dev exercises exactly what ships.
openssl = { version = "0.10", features = ["vendored"] }
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Serves the router on the engine socket, which `axum-server` 0.7 cannot bind.
# Both are already in the tree under `axum`.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rustls = { version = "0.23", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
mail-parser = "0.9"
aes-gcm = "0.10"
# Seals backup archives to the workspace's backup recipient (age X25519).
# Default features only: no plugins, no ssh keys, no armor.
age = "0.12"
tar = "0.4"
zstd = "0.13"
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
toml = "0.8"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
wasmtime = { version = "36", default-features = false, features = ["cranelift", "async", "cache"] }
unicode-normalization = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }
# Rust parser. Reads the ThreadEvent enum and its payload types out of the
# source, so the frontend's wire types can be generated from them
# (`engine/thread_events/ts_codegen.rs`). Only the `lucidos-codegen` bin reaches
# it, so the linker leaves it out of the engine binary. No production type
# carries a codegen derive.
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
proc-macro2 = "1"

# The macOS Keychain, through the library rather than the `security` command,
# holds the workspace key on the packaged app (ADR 0509).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
# Enables `#[tokio::test(start_paused = true)]` for time-mocked tests.
tokio = { version = "1", features = ["test-util"] }
# WAT (WebAssembly text format) compiler — used by proxy_wasm_signer tests
# to build minimal WASM modules at test time without an external toolchain.
wat = "1"
