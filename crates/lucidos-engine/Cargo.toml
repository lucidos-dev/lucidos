[package]
name = "lucidos-engine"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
libc = "0.2"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
# pg-embed removed - using Docker PostgreSQL with pgvector
git2 = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
fastembed = "4"
fs2 = "0.4"
# usearch removed - using pgvector for vector search
tokio-cron-scheduler = { version = "0.15", features = ["signal"] }
cron = "0.15"
sha2 = "0.10"
pdf-extract = "0.10"
tempfile = "3"
glob = "0.3"
# OCR using PaddleOCR via ocr-rs (pure Rust, supports Latin/Norwegian)
ocr-rs = "2"
image = "0.25"
kamadak-exif = "0.6"
urlencoding = "2.1.3"
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
regex = "1"
dotenvy = "0.15"
web-push = "0.11"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
mail-parser = "0.9"
aes-gcm = "0.10"
tar = "0.4"
zstd = "0.13"
tokio-util = "0.7"

[dev-dependencies]
