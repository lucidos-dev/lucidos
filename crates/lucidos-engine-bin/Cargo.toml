[package]
name = "lucidos-engine-bin"
version.workspace = true
edition.workspace = true
default-run = "lucidos-engine"

[[bin]]
name = "lucidos-engine"
path = "src/main.rs"

# ADR 0087: running the eval is explicit. Its tests are offline.
[[bin]]
name = "lucidos-eval"
path = "src/bin/lucidos-eval/main.rs"
required-features = ["eval"]

[features]
eval = [
    "dep:clap",
    "dep:lucidos-local-token",
    "dep:lucidos-pg-url",
    "dep:regex",
    "dep:reqwest",
    "dep:sha2",
    "dep:tempfile",
    "dep:toml",
]
fixture-gen = ["eval", "dep:fastembed"]
e2e-test-hooks = ["lucidos-agents-api/e2e-test-hooks"]
real-embedder-tests = ["lucidos-agents-api/real-embedder-tests"]

[dependencies]
lucidos-agents-api = { path = "../lucidos-agents-api" }
lucidos-engine = { path = "../lucidos-engine" }
lucidos-engine-boot = { path = "../lucidos-engine-boot" }
lucidos-event-hooks = { path = "../lucidos-event-hooks" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lucidos-home = { path = "../lucidos-home" }
lucidos-owner-lock = { path = "../lucidos-owner-lock" }
lucidos-engine-socket = { path = "../lucidos-engine-socket" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
dotenvy = "0.15"
axum-server = { version = "0.7", features = ["tls-rustls"] }

clap = { version = "4", features = ["derive"], optional = true }
fastembed = { version = "4", optional = true }
lucidos-local-token = { path = "../lucidos-local-token", features = ["client"], optional = true }
lucidos-pg-url = { path = "../lucidos-pg-url", optional = true }
regex = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
toml = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
