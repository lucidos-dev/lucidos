[package]
name = "lucidos-engine-boot"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
dotenvy = "0.15"
fs2 = "0.4"
libc = "0.2"
lucidos-capabilities = { path = "../lucidos-capabilities" }
lucidos-core = { path = "../lucidos-core" }
lucidos-engine = { path = "../lucidos-engine" }
lucidos-gateway-constants = { path = "../lucidos-gateway-constants" }
lucidos-gateway-stamp = { path = "../lucidos-gateway-stamp" }
lucidos-update-channel = { path = "../lucidos-update-channel" }
lucidos-wire-codegen = { path = "../lucidos-wire-codegen" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "uuid"] }
tempfile = "3"
tokio = { version = "1", features = ["process"] }

[dev-dependencies]
lucidos-engine = { path = "../lucidos-engine", features = ["test-support"] }
lucidos-core = { path = "../lucidos-core", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt"] }
