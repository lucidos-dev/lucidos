[package]
name = "lucidos-local-token"
version.workspace = true
edition.workspace = true
license.workspace = true

# The machine-local token that proves a caller is a process on this machine.
#
# Four crates need it: the gateway mints and verifies it, and the engine, the
# CLI and the app send it. None of them may depend on the engine (ADR 0014 §1),
# so this is the `lucidos-tailscale` shape: a crate small enough for every one
# of them to take. Tailscale exists because two hand-copied halves drifted and
# a fix landed in only some of them. A secret path plus a header name copied
# four ways would drift the same way, and its failure mode is worse than a
# missing feature: a stale copy is a caller that silently cannot authenticate.
#
# It also holds the rest of what every loopback caller shares: the loopback
# CA's public certificate path (`loopback_cert.rs`) and the one loopback client
# setup (`client.rs`, behind the `client` and `blocking` features). Every client
# caller already depends on this crate, and the CA crate itself stays with the
# few that mint or trust (decision 14 of
# `docs/plans/2026-11-19-desktop-window-https.md`).
#
# **Its default build depends only on `lucidos-home`, which has none, and both
# must keep it that way.** That is the whole reason every crate can take it.

[dependencies]
lucidos-home = { path = "../lucidos-home" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
# `test-support` only: a throwaway CA, and a stand-in listener serving its leaf.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"], optional = true }
axum = { version = "0.7", default-features = false, optional = true }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
tokio = { version = "1", features = ["rt", "net"], optional = true }

[features]
client = ["dep:reqwest"]
blocking = ["client", "reqwest/blocking"]
# For tests in any crate: the loopback client trusts a throwaway CA instead of
# the user's, and `test_support` serves that CA's leaf. A dev-dependency
# feature, so no shipped build carries it.
test-support = ["client", "dep:rcgen", "dep:rustls", "dep:axum", "dep:axum-server", "dep:tokio"]

[dev-dependencies]
tempfile = "3"
