[package]
name = "lucidos-event-hooks"
version.workspace = true
edition.workspace = true

[dependencies]
lucidos-core = { path = "../lucidos-core" }
# The trigger script rules a hook script shares, and the runtime it runs on.
lucidos-engine = { path = "../lucidos-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }
toml = "0.8"

[dev-dependencies]
lucidos-core = { path = "../lucidos-core", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = "1"
