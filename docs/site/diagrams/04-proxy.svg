<svg class="lx-diagram" viewBox="0 0 1280 620" role="img"
     aria-labelledby="t-proxy d-proxy" xmlns="http://www.w3.org/2000/svg">
  <title id="t-proxy">How Lucidos reaches an outside API</title>
  <desc id="d-proxy">The agent, your apps, your triggers and your scripts all reach an outside API through the same proxy, described once in one config file. The proxy adds what the API wants: a key, a signature, a login handshake, or a signer you wrote. Layers stack. The secret stays in the engine and never reaches the chat, a log, or an app.</desc>
  <defs>
    <marker id="lx-arrow-proxy" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--lx-ink-soft)"/>
    </marker>
    <marker id="lx-arrow-b-proxy" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--lx-blue)"/>
    </marker>
    <marker id="lx-arrow-o-proxy" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--lx-orange)"/>
    </marker>
  </defs>

  <text x="40" y="54" text-anchor="start" font-size="17" font-weight="700" fill="var(--lx-ink-soft)" letter-spacing="2.5">REACHING AN OUTSIDE API</text>

  <!-- The four callers. One hue on purpose: they are the same role, not four series. -->
  <rect x="40" y="120" width="290" height="76" rx="14" fill="var(--lx-blue-t)" stroke="var(--lx-blue)" stroke-width="3" />
  <text x="185" y="152" text-anchor="middle" font-size="21" font-weight="600" fill="var(--lx-ink)">The agent</text>
  <text x="185" y="178" text-anchor="middle" font-size="16" font-weight="400" fill="var(--lx-ink-soft)">in any thread</text>

  <rect x="40" y="212" width="290" height="76" rx="14" fill="var(--lx-blue-t)" stroke="var(--lx-blue)" stroke-width="3" />
  <text x="185" y="244" text-anchor="middle" font-size="21" font-weight="600" fill="var(--lx-ink)">Your apps</text>
  <text x="185" y="270" text-anchor="middle" font-size="16" font-weight="400" fill="var(--lx-ink-soft)">from the browser, no key</text>

  <rect x="40" y="304" width="290" height="76" rx="14" fill="var(--lx-blue-t)" stroke="var(--lx-blue)" stroke-width="3" />
  <text x="185" y="336" text-anchor="middle" font-size="21" font-weight="600" fill="var(--lx-ink)">Your triggers</text>
  <text x="185" y="362" text-anchor="middle" font-size="16" font-weight="400" fill="var(--lx-ink-soft)">on a schedule or an event</text>

  <rect x="40" y="396" width="290" height="76" rx="14" fill="var(--lx-blue-t)" stroke="var(--lx-blue)" stroke-width="3" />
  <text x="185" y="428" text-anchor="middle" font-size="21" font-weight="600" fill="var(--lx-ink)">Your scripts</text>
  <text x="185" y="454" text-anchor="middle" font-size="16" font-weight="400" fill="var(--lx-ink-soft)">python, bash, coding agents</text>

  <!-- All four join one rail, then one arrow into the proxy. -->
  <path d="M 330 158 L 430 158" fill="none" stroke="var(--lx-blue)" stroke-width="2.5"/>
  <path d="M 330 250 L 430 250" fill="none" stroke="var(--lx-blue)" stroke-width="2.5"/>
  <path d="M 330 342 L 430 342" fill="none" stroke="var(--lx-blue)" stroke-width="2.5"/>
  <path d="M 330 434 L 430 434" fill="none" stroke="var(--lx-blue)" stroke-width="2.5"/>
  <path d="M 430 158 L 430 434" fill="none" stroke="var(--lx-blue)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 430 296 L 494 296" fill="none" stroke="var(--lx-blue)" stroke-width="3.5" marker-end="url(#lx-arrow-b-proxy)"/>
  <text x="430" y="500" text-anchor="middle" font-size="18" font-weight="600" fill="var(--lx-ink)">one door,</text>
  <text x="430" y="524" text-anchor="middle" font-size="18" font-weight="600" fill="var(--lx-ink)">one setup</text>

  <!-- The proxy. -->
  <rect x="500" y="110" width="440" height="470" rx="22" fill="none" stroke="var(--lx-ink)" stroke-width="3.5" />
  <text x="720" y="162" text-anchor="middle" font-size="28" font-weight="600" fill="var(--lx-ink)">Proxy</text>
  <text x="720" y="194" text-anchor="middle" font-size="17" font-weight="400" fill="var(--lx-ink-soft)">you describe the API once</text>

  <rect x="534" y="250" width="372" height="52" rx="10" fill="none" stroke="var(--lx-line)" stroke-width="2" />
  <text x="720" y="284" text-anchor="middle" font-size="20" font-weight="500" fill="var(--lx-ink)">Key, token or password</text>
  <rect x="534" y="316" width="372" height="52" rx="10" fill="none" stroke="var(--lx-line)" stroke-width="2" />
  <text x="720" y="350" text-anchor="middle" font-size="20" font-weight="500" fill="var(--lx-ink)">Signed request</text>
  <rect x="534" y="382" width="372" height="52" rx="10" fill="none" stroke="var(--lx-line)" stroke-width="2" />
  <text x="720" y="416" text-anchor="middle" font-size="20" font-weight="500" fill="var(--lx-ink)">Login handshake</text>
  <rect x="534" y="448" width="372" height="52" rx="10" fill="none" stroke="var(--lx-line)" stroke-width="2" />
  <text x="720" y="482" text-anchor="middle" font-size="20" font-weight="500" fill="var(--lx-ink)">Your own signer</text>
  <text x="720" y="540" text-anchor="middle" font-size="16" font-weight="400" fill="var(--lx-ink-soft)">stack them when one is not enough</text>

  <!-- Outside the machine. -->
  <path d="M 940 160 L 1004 160" fill="none" stroke="var(--lx-orange)" stroke-width="3" marker-end="url(#lx-arrow-o-proxy)"/>
  <rect x="1010" y="110" width="230" height="100" rx="14" fill="none" stroke="var(--lx-orange)" stroke-width="3" stroke-dasharray="8 8" />
  <text x="1125" y="154" text-anchor="middle" font-size="23" font-weight="600" fill="var(--lx-ink)">The API</text>
  <text x="1125" y="184" text-anchor="middle" font-size="16" font-weight="400" fill="var(--lx-ink-soft)">signed, authorised</text>

  <path d="M 940 425 L 1004 425" fill="none" stroke="var(--lx-ink-soft)" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#lx-arrow-proxy)"/>
  <rect x="1010" y="330" width="230" height="190" rx="14" fill="none" stroke="var(--lx-line)" stroke-width="2.5" />
  <text x="1125" y="382" text-anchor="middle" font-size="21" font-weight="600" fill="var(--lx-ink)">The secret</text>
  <text x="1125" y="420" text-anchor="middle" font-size="16" font-weight="400" fill="var(--lx-ink-soft)">never in the chat,</text>
  <text x="1125" y="446" text-anchor="middle" font-size="16" font-weight="400" fill="var(--lx-ink-soft)">never in a log,</text>
  <text x="1125" y="472" text-anchor="middle" font-size="16" font-weight="400" fill="var(--lx-ink-soft)">never in an app</text>
</svg>
